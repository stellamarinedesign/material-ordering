<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#282827">
  <script>/* Theme bootstrap — runs before first paint so a themed device never flashes the default look. Choice is per device; see Theme in js/shared.js */try{var t=localStorage.getItem("mo_theme");if(t&&t!=="stella")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Warehouse">
  <title>Warehouse Intake</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest-warehouse.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="fonts/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=2026-11-27.7">
  <link rel="stylesheet" href="css/themes.css?v=2026-11-27.7">
</head>
<body class="floor">
<!-- Start-up cover: painted before any script; see Boot in js/shared.js -->
<div id="boot">
  <div class="header"><div class="col"><div class="header-inner">
    <span class="header-logo"></span>
    <div class="header-left"><div class="header-title">Warehouse Intake</div><div class="header-ref"><span class="live-dot connecting"></span>Connecting…</div></div>
  </div></div></div>
  <div class="boot-tabs"></div>
  <div class="col boot-rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="boot-late"><p>Can't reach the app. Check the Wi-Fi, then tap Reload.</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div>
</div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b)b.classList.add('late');},12000);</script>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- APP CHECK: remove this line to disable App Check (also remove init block in firebase-sync.js) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/shared.js?v=2026-11-27.7"></script>
<script src="js/firebase-sync.js?v=2026-11-27.7"></script>
<script src="js/auth.js?v=2026-11-27.7"></script>
<script src="js/intake.js?v=2026-11-27.7"></script>
<script>
const Warehouse = {
  orders:      [],
  activeTab:   'materials',
  _filters:    { materials: 'outstanding', consumables: 'outstanding' },
  _openOrders: new Set(),
  _drafts:     new Map(), // cardKey ("orderId|||category") -> { [itemId]: {status, qtyReceived, notes} }
  _unsubOrders: null,
  _connState:  { connected: null, latestVersion: null }, // null = not yet known
  _noteSaveTimers: {},

  async init() {
    FirebaseConfig.forget();
    const ok = await DB.init(FirebaseConfig.get());
    if (!ok) { this.showSetup("Can't reach the database. Check the Wi-Fi, then tap Reload."); return; }
    this._drafts = Intake.loadDrafts('warehouse');   // ticks left unsaved on this device
    Intake.page = 'warehouse';                       // and saves waiting for the connection (Intake.waiting)
    DB.onDenied = () => Auth.denied();
    Auth.deviceName = WarehouseDeviceName;
    Auth.start();
    this.renderShell();
    this.renderList('materials'); this.renderList('consumables');
    Boot.ready('page');
    this.startListening();
    this.startConnectionStatus();
    this.startVersionCheck();
  },

  // Firebase itself could not be reached (no network at first load, the SDK
  // blocked): a plain card and a Reload. The config is in the code (shared.js).
  showSetup(err) {
    Boot.gone();
    document.getElementById('root').innerHTML = `
      <div class="setup-screen"><div class="setup-card" style="text-align:center">
        <div class="auth-logo"></div>
        <p style="margin-bottom:16px">${esc(err || 'Could not connect.')}</p>
        <button class="btn btn-primary" style="width:100%" onclick="location.reload()"><i class="ti ti-refresh"></i> Reload</button>
      </div></div>`;
  },

  // ── SHELL ─────────────────────────────────────────────────────────────
  renderShell() {
    const name = WarehouseDeviceName.get();
    document.getElementById('root').innerHTML = `
      <div class="app-root" id="app-root">

        <div class="header">
          <div class="col"><div class="header-inner">
            <span class="header-logo"></span>
            <div class="header-left">
              <div class="header-title"><i class="ti ti-warehouse" style="opacity:.7;margin-right:6px"></i>Warehouse Intake</div>
              <div class="header-ref">
                <span class="live-dot connecting" id="live-dot"></span><span id="live-label">Connecting…</span><span class="hdr-extra">
                &nbsp;·&nbsp; <span id="app-version" style="font-family:var(--mono)"></span></span>
              </div>
            </div>
            <div class="header-actions">
              <span class="role-pill">${esc(name)}</span>
              <span id="auth-pill"></span>
              <button class="icon-btn" id="btn-setup" aria-label="Settings"><i class="ti ti-settings"></i></button>
            </div>
          </div></div>
        </div>

        <div id="update-banner-wrap"></div>
        ${FirebaseConfig.isTestMode() ? '<div class="test-mode-banner"><i class="ti ti-flask"></i> Test mode — connected to test database</div>' : ''}

        <!-- TAB BAR -->
        <div style="background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0">
          <div class="col" style="padding:0">
            <div style="display:flex;overflow-x:auto;scrollbar-width:none">
              <button class="main-tab active" id="tab-materials">
                <i class="ti ti-cube"></i>Materials
              </button>
              <button class="main-tab" id="tab-consumables">
                <i class="ti ti-package"></i>Consumables
              </button>
            </div>
          </div>
        </div>

        <!-- MATERIALS VIEW -->
        <div id="view-materials" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0">
          <div class="col" style="padding-top:10px;padding-bottom:0;flex-shrink:0">
            <div class="intake-filter-bar" id="filter-materials">
              <button type="button" class="intake-filter-chip" data-filter="all" aria-pressed="false">All</button>
              <button type="button" class="intake-filter-chip active" data-filter="outstanding" aria-pressed="true"><i class="ti ti-clock"></i> Outstanding</button>
              <button type="button" class="intake-filter-chip" data-filter="backorder" aria-pressed="false"><i class="ti ti-clock-pause"></i> Back orders</button>
              <button type="button" class="intake-filter-chip" data-filter="completed" aria-pressed="false"><i class="ti ti-circle-check"></i> Completed</button>
              <button type="button" class="intake-filter-chip" data-filter="cancelled" aria-pressed="false"><i class="ti ti-ban"></i> Cancelled</button>
            </div>
          </div>
          <div class="intake-scroll app-scroll">
            <div class="col"><div class="intake-list" id="intake-list-materials"></div></div>
          </div>
        </div>

        <!-- CONSUMABLES VIEW -->
        <div id="view-consumables" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0">
          <div class="col" style="padding-top:10px;padding-bottom:0;flex-shrink:0">
            <div class="intake-filter-bar" id="filter-consumables">
              <button type="button" class="intake-filter-chip" data-filter="all" aria-pressed="false">All</button>
              <button type="button" class="intake-filter-chip active" data-filter="outstanding" aria-pressed="true"><i class="ti ti-clock"></i> Outstanding</button>
              <button type="button" class="intake-filter-chip" data-filter="backorder" aria-pressed="false"><i class="ti ti-clock-pause"></i> Back orders</button>
              <button type="button" class="intake-filter-chip" data-filter="completed" aria-pressed="false"><i class="ti ti-circle-check"></i> Completed</button>
              <button type="button" class="intake-filter-chip" data-filter="cancelled" aria-pressed="false"><i class="ti ti-ban"></i> Cancelled</button>
            </div>
          </div>
          <div class="intake-scroll app-scroll">
            <div class="col"><div class="intake-list" id="intake-list-consumables"></div></div>
          </div>
        </div>

        <!-- SETTINGS PANEL -->
        <div class="panel" id="wh-settings-panel">
          <div class="panel-header">
            <button class="back-btn" id="btn-close-wh-settings"><i class="ti ti-chevron-left"></i>Back</button>
            <div class="panel-title">Settings</div>
          </div>
          <div class="panel-scroll"><div class="panel-col" style="gap:20px">
            <div class="settings-section">
              <div class="settings-label">Device</div>
              <div class="settings-card">
                <div class="settings-row">
                  <div><div class="settings-row-label">Device name</div></div>
                  <input type="text" id="s-device-name" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(WarehouseDeviceName.get())}" style="max-width:220px" data-admin-only ${Auth.adminOpen() ? '' : 'hidden'}>
                  <span class="settings-value" data-admin-locked ${Auth.adminOpen() ? 'hidden' : ''}>${esc(WarehouseDeviceName.get())}</span>
                </div>
              </div>
            </div>
            ${Auth.settingsSection()}
            <div class="settings-section">
              <div class="settings-label">Appearance</div>
              <div class="settings-card">
                <div class="settings-row">
                  <div><div class="settings-row-label">Theme</div><div class="settings-row-sub">Colours and logo for this device — applies to every page opened on it</div></div>
                  <select id="s-theme">${THEMES.map(t => `<option value="${t.id}"${Theme.get() === t.id ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
                </div>
                <label class="settings-row">
                  <div><div class="settings-row-label">Fractions as symbols</div><div class="settings-row-sub">Show 1 1/2" as 1½" — off keeps sizes large and easy to read on the iPads</div></div>
                  <input type="checkbox" id="s-fraction-glyphs" ${Settings.get().fractionGlyphs ? 'checked' : ''} style="width:20px;height:20px">
                </label>
              </div>
            </div>
            <div class="settings-section" data-master-only ${Auth.isMaster() ? "" : "hidden"}>
              <div class="settings-label">Database</div>
              <div class="settings-card">
                <div class="settings-row">
                  <div><div class="settings-row-label">Test mode</div><div class="settings-row-sub">Use a separate test Firebase database — shared across all pages on this server</div></div>
                  <button class="btn-sm ${FirebaseConfig.isTestMode()?'btn-sm-danger':''}" id="btn-wh-toggle-test">${FirebaseConfig.isTestMode()?'On — tap to exit':'Off'}</button>
                </div>
              </div>
            </div>
          </div></div>
        </div>

      </div>`;

    const verEl = document.getElementById('app-version');
    if (verEl) verEl.textContent = verLabel(APP_VERSION);

    // Tab switching
    document.getElementById('tab-materials').addEventListener('click',   () => this.setTab('materials'));
    document.getElementById('tab-consumables').addEventListener('click', () => this.setTab('consumables'));

    // Filter chips
    for (const type of ['materials', 'consumables'])
      document.getElementById(`filter-${type}`).addEventListener('click', e => {
        const chip = e.target.closest('[data-filter]'); if (chip) this.setFilter(type, chip.dataset.filter);
      });

    // Settings button — opens settings panel (test mode toggle + reconnect option)
    document.getElementById('btn-setup').addEventListener('click', () => this.openPanel('wh-settings-panel'));
    document.getElementById('btn-close-wh-settings').addEventListener('click', () => { this.closePanel('wh-settings-panel'); Auth.lockAdmin(); });
    // No Save button on this panel — the theme applies the moment it's picked
    document.getElementById('s-theme').addEventListener('change', e => Theme.set(e.target.value));
    document.getElementById('s-fraction-glyphs').addEventListener('change', e => { Settings.save({ fractionGlyphs: e.target.checked }); this.renderList('materials'); this.renderList('consumables'); });
    document.getElementById('btn-wh-toggle-test').addEventListener('click', () => {
      FirebaseConfig.setTestMode(!FirebaseConfig.isTestMode());
      location.reload();
    });
    const dn = document.getElementById('s-device-name');
    dn.addEventListener('change', () => {
      const v = dn.value.trim();
      if (!v) { dn.value = WarehouseDeviceName.get(); return; }
      WarehouseDeviceName.save(v); dn.defaultValue = v;
      const pill = document.querySelector('.header .role-pill'); if (pill) pill.textContent = v;
      const shown = dn.nextElementSibling; if (shown) shown.textContent = v;
    });
    dn.addEventListener('keydown', e => { if (e.key === 'Enter') dn.blur(); });

    Strip.watch(document.getElementById('filter-materials'), 'wh-mat');
    Strip.watch(document.getElementById('filter-consumables'), 'wh-cons');

    // Wire intake events for both lists
    this._wireIntakeList('materials');
    this._wireIntakeList('consumables');
  },

  _wireIntakeList(type) {
    const container = document.getElementById(`intake-list-${type}`);
    if (!container) return;
    Intake.attachListeners(container, {
      onAction:   (orderId, itemId, action) => this.setItemStatus(orderId, itemId, action),
      onQtyChange:(orderId, itemId, qty)    => this.setPartialQty(orderId, itemId, qty),
      onOutstandingChange:(orderId, itemId, qty) => this.setOutstanding(orderId, itemId, qty),
      onArrived:  (orderId, itemId)         => this.markArrived(orderId, itemId),
      onFollowUp: (orderId, itemId, action) => this.resolveFollowUp(orderId, itemId, action),
      onNoteChange:(orderId, itemId, text)  => this.setNote(orderId, itemId, text),
      onRerender: (orderId)                 => this.rerenderCard(orderId, type),
      onConfirm:  (cardKey)                 => this.onConfirm(cardKey),
      onSave:     (cardKey)                 => this.onSave(cardKey),
      onDiscard:  (cardKey)                 => this.onDiscard(cardKey),
      onApplyStock:(cardKey)                => this.applyStock(cardKey),
    });
  },

  openPanel(id)  { document.getElementById(id)?.classList.add('open'); },
  closePanel(id) { document.getElementById(id)?.classList.remove('open'); },

  setFilter(type, filter) {
    this._filters[type] = filter;
    document.querySelectorAll(`#filter-${type} .intake-filter-chip`).forEach(c => {
      const on = c.dataset.filter === filter;
      c.classList.toggle('active', on); c.setAttribute('aria-pressed', on);
    });
    this.renderList(type);
  },

  setTab(tab) {
    this.activeTab = tab;
    document.getElementById('tab-materials').classList.toggle('active',   tab === 'materials');
    document.getElementById('tab-consumables').classList.toggle('active', tab === 'consumables');
    document.getElementById('view-materials').style.display   = tab === 'materials'   ? 'flex' : 'none';
    document.getElementById('view-consumables').style.display = tab === 'consumables' ? 'flex' : 'none';
  },

  // ── LIVE STATUS ────────────────────────────────────────────────────────
  _renderLiveStatus() { Live.render(this._connState); },
  startConnectionStatus() {
    DB.listenConnectionStatus(c => {
      this._connState.connected = c; this._renderLiveStatus();
      if (c) Intake.flushWaiting(this._host());   // deliveries saved here while offline
    });
  },
  startVersionCheck() {
    DB.announceVersionIfNewer(APP_VERSION, isVersionNewer);
    DB.listenAppVersion(v => { this._connState.latestVersion = v; this._renderLiveStatus(); AutoUpdate.notifyVersion(v); });
    // Idle auto-reload for the warehouse iPad — never while a delivery is being
    // ticked off (the ticks are staged until Save or Confirm).
    AutoUpdate.start({
      onDiscover: v => { this._connState.latestVersion = v; this._renderLiveStatus(); },
      isBusy:     () => Intake.draftsInHand('warehouse'),
    });
  },

  // ── LIVE DATA ─────────────────────────────────────────────────────────
  startListening() {
    this._unsubOrders = DB.listenOrders((orders, fromCache) => {
      this.orders = orders;
      if (!fromCache || orders.length) this._ordersReady = true;
      this.renderList('materials');
      this.renderList('consumables');
      Intake.flushWaiting(this._host());   // anything saved here offline, once the connection is there
    });
  },

  renderList(type) {
    const el = document.getElementById(`intake-list-${type}`); if (!el) return;
    if (!this._ordersReady) { el.innerHTML = skeleton(4, 'tall'); return; }
    const restoreFocus = captureInputFocus(); // live snapshots re-render mid-typing
    el.innerHTML = Intake.renderCategoryList(this.orders, type, this._filters[type], this._openOrders, this._drafts);
    restoreFocus();
  },

  // Looks up a delivery group by groupKey across both types (a card doesn't know its own
  // type ahead of time from the key alone).
  _findGroup(groupKey) {
    const matGroups  = Intake.buildCategoryGroups(this.orders, 'materials');
    const consGroups = Intake.buildCategoryGroups(this.orders, 'consumables');
    return [...matGroups, ...consGroups].find(g => g.groupKey === groupKey);
  },

  // Toggles a card's open/closed state and re-renders it in place. cardKey may be a
  // plain orderId (notes-toggle path — falls back to a full list re-render) or a
  // delivery groupKey (optionally suffixed "|||bo" for the derived back-order-only
  // card) — groupKeys are always DLV-... or legacy:orderId:category, never a bare doc
  // id, which is what lets a bare orderId fall through to the full-rerender branch below.
  rerenderCard(cardKey, type) {
    if (this._openOrders.has(cardKey)) this._openOrders.delete(cardKey);
    else this._openOrders.add(cardKey);

    let isDerived = false, groupKey = cardKey;
    if (groupKey.endsWith('|||bo')) { isDerived = true; groupKey = groupKey.slice(0, -5); }

    const group = this._findGroup(groupKey);
    if (!group) { this.renderList(type || 'materials'); return; }

    const isMat = !group.entries[0].order.type || group.entries[0].order.type === 'materials';
    const t     = type || (isMat ? 'materials' : 'consumables');
    let entries = group.entries;
    if (isDerived) entries = entries.filter(({ order, item }) => Intake.outstandingOf(order, item) > 0);

    const safeId = cardKey.replace(/[^a-zA-Z0-9]/g, '_');
    const cardEl = document.getElementById(`intake-card-${safeId}`);
    const draftForCard = this._drafts.get(groupKey);
    const isCancelled = entries.every(({ order }) => !!order.intakeCancelled);
    const opts = { isDerived, readOnly: isCancelled, isCancelledCard: isCancelled, draftForCard };
    if (cardEl) cardEl.outerHTML = Intake.renderCategoryCard(groupKey, group.category, entries, t, this._openOrders, opts);
    else this.renderList(t);
  },

  // ── INTAKE MUTATIONS (staged in _drafts, kept on this device — nothing reaches
  // the database until Save or Confirm) ──
  // _drafts is keyed by groupKey; each draft's own entries use composite
  // "orderId::itemId" keys since a delivery can span multiple orders (see intake.js).

  setItemStatus(orderId, itemId, action) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._drafts.has(groupKey)) this._drafts.set(groupKey, {});
    const draft = this._drafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    const saved = ((order.intake && order.intake.items) || {})[String(itemId)] || {};
    const draftItem = draft[key] || {};
    const currentStatus = draftItem.status !== undefined ? draftItem.status : (saved.status || null);
    if (currentStatus === action) {
      draft[key] = { ...draftItem, status: null, qtyReceived: null, outstandingQty: null };
    } else {
      // See manager.html intakeSetStatus — B/O means the whole line is still coming.
      const prevOut = draftItem.outstandingQty ?? saved.outstandingQty;
      let outstandingQty = 0;
      if (action === 'backorder')    outstandingQty = (prevOut > 0) ? prevOut : (item.qty || 0);
      else if (action === 'partial') outstandingQty = prevOut || 0;
      draft[key] = {
        ...draftItem,
        status: action,
        qtyReceived: action === 'partial' ? (draftItem.qtyReceived ?? saved.qtyReceived ?? null) : null,
        outstandingQty,
      };
    }
    this._rerenderCardOnly(orderId, item.category, groupKey);
  },

  setPartialQty(orderId, itemId, qty) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._drafts.has(groupKey)) this._drafts.set(groupKey, {});
    const draft = this._drafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    draft[key] = { ...(draft[key] || {}), qtyReceived: qty };
    this._rerenderCardOnly(orderId, item.category, groupKey);
  },

  // How many of this line the supplier is still sending (see manager.html).
  setOutstanding(orderId, itemId, qty) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._drafts.has(groupKey)) this._drafts.set(groupKey, {});
    const draft = this._drafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    draft[key] = { ...(draft[key] || {}), outstandingQty: qty };
    this._rerenderCardOnly(orderId, item.category, groupKey);
  },

  // Resolving a short-delivery follow-up (see manager.html intakeResolveFollowUp).
  resolveFollowUp(orderId, itemId, action) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._drafts.has(groupKey)) this._drafts.set(groupKey, {});
    const draft = this._drafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    const saved = ((order.intake && order.intake.items) || {})[String(itemId)] || {};
    const cur = { ...saved, ...(draft[key] || {}) };
    if (action === 'coming') {
      draft[key] = { ...(draft[key] || {}), outstandingQty: Math.max(0, (item.qty || 0) - (cur.qtyReceived || 0)) };
    } else {
      draft[key] = { ...(draft[key] || {}), followUpDone: true };
    }
    this._rerenderCardOnly(orderId, item.category, groupKey);
  },

  // "Arrived" — books the outstanding amount as received in one tap (see manager.html).
  markArrived(orderId, itemId) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._drafts.has(groupKey)) this._drafts.set(groupKey, {});
    const draft = this._drafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    const saved = ((order.intake && order.intake.items) || {})[String(itemId)] || {};
    const cur   = { ...saved, ...(draft[key] || {}) };
    const outstanding = Intake.outstandingOf(order, item, { [key]: cur });
    if (outstanding <= 0) return;
    const already    = cur.status === 'ok' ? (item.qty || 0) : (cur.qtyReceived || 0);
    const nowRecv    = already + outstanding;
    const isComplete = nowRecv >= (item.qty || 0);
    draft[key] = {
      ...(draft[key] || {}),
      status: isComplete ? 'ok' : 'partial',
      qtyReceived: isComplete ? null : nowRecv,
      outstandingQty: 0,
    };
    this._rerenderCardOnly(orderId, item.category, groupKey);
  },

  setNote(orderId, itemId, text) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._drafts.has(groupKey)) this._drafts.set(groupKey, {});
    const draft = this._drafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    draft[key] = { ...(draft[key] || {}), notes: text };
    this._rerenderCardOnly(orderId, item.category, groupKey);
  },

  // Re-renders just the open card showing staged draft edits — no Firestore write,
  // so tab placement never changes until the user hits Confirm.
  _rerenderCardOnly(orderId, category, groupKey) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const isMat = !order.type || order.type === 'materials';
    const type  = isMat ? 'materials' : 'consumables';
    const group = this._findGroup(groupKey);
    if (!group) return;
    const draftForCard = this._drafts.get(groupKey);
    Intake.keepDrafts('warehouse', this._drafts);
    const restoreFocus = captureInputFocus(); // notes debounce re-renders while typing

    const fullSafe = groupKey.replace(/[^a-zA-Z0-9]/g, '_');
    const fullEl   = document.getElementById(`intake-card-${fullSafe}`);
    if (fullEl) {
      fullEl.outerHTML = Intake.renderCategoryCard(groupKey, category, group.entries, type, this._openOrders, { draftForCard });
      restoreFocus();
      return;
    }

    const boEntries = group.entries.filter(({ order: o, item }) => Intake.outstandingOf(o, item) > 0);
    const boSafe  = `${groupKey}|||bo`.replace(/[^a-zA-Z0-9]/g, '_');
    const boEl    = document.getElementById(`intake-card-${boSafe}`);
    if (boEl) {
      boEl.outerHTML = Intake.renderCategoryCard(groupKey, category, boEntries, type, this._openOrders, { isDerived: true, draftForCard });
      restoreFocus();
    }
  },

  // What the shared save code (Intake.saveCard and friends) needs from this page.
  _host() {
    return {
      page: 'warehouse', drafts: this._drafts, device: 'iPad',
      by:     () => WarehouseDeviceName.get() || 'Warehouse',
      find:   groupKey => this._findGroup(groupKey),
      connected: () => this._connState.connected,
      ready:     () => !!this._ordersReady,   // the save itself checks against the server
      redraw: group => this.renderList(!group.entries[0].order.type || group.entries[0].order.type === 'materials' ? 'materials' : 'consumables'),
      // "Show" on the toast after a Confirm: the delivery, where it went, opened.
      show: (group, filter) => {
        const type = !group.entries[0].order.type || group.entries[0].order.type === 'materials' ? 'materials' : 'consumables';
        this.setTab(type);
        this._openOrders.add(filter === 'backorder' ? `${group.groupKey}|||bo` : group.groupKey);
        this.setFilter(type, filter);
        const safe = (filter === 'backorder' ? `${group.groupKey}|||bo` : group.groupKey).replace(/[^a-zA-Z0-9]/g, '_');
        document.getElementById(`intake-card-${safe}`)?.scrollIntoView({ block: 'nearest' });
      },
    };
  },
  onConfirm(cardKey)  { return Intake.saveCard(this._host(), cardKey, true); },
  onSave(cardKey)     { return Intake.saveCard(this._host(), cardKey, false); },
  onDiscard(cardKey)  { return Intake.discard(this._host(), cardKey); },
  applyStock(cardKey) { return Intake.applyStock(this._host(), cardKey); },
};

Warehouse.init();
</script>
</body>
</html>
