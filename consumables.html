<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#282827">
  <script>/* Theme bootstrap — runs before first paint so a themed device never flashes the default look. Choice is per device; see Theme in js/shared.js */try{var t=localStorage.getItem("mo_theme");if(t&&t!=="stella")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Consumables">
  <title>Consumables</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest-consumables.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="fonts/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=2026-11-27.2">
  <link rel="stylesheet" href="css/themes.css?v=2026-11-27.2">
  <style>
    .cons-stock-badge {
      font-size: 11px; font-family: var(--mono); padding: 2px 8px;
      border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .cons-stock-badge.ok       { background: var(--green-bg); color: var(--green-text); }
    .cons-stock-badge.low      { background: var(--amber-bg); color: var(--amber-text); }
    .cons-stock-badge.critical { background: var(--red-bg);   color: var(--red-text); }
    .cons-stock-badge.zero     { background: var(--bg2);      color: var(--text3); }
    .mat-card.out-of-stock     { opacity: 0.5; pointer-events: none; }
    .mat-card.out-of-stock .mat-controls { opacity: 0.4; }
    /* ── Image grid (tradesmen pick by photo) ── */
    .cons-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px; padding: 12px 0;
    }
    .cons-tile {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      overflow: hidden; display: flex; flex-direction: column;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: transform 0.06s;
    }
    .cons-tile:active { transform: scale(0.97); }   /* tap feedback — the tile is the button */
    .cons-tile.in-order { border-color: var(--select-line); box-shadow: 0 0 0 1px var(--select-line); }
    .cons-tile.out-of-stock { opacity: 0.55; pointer-events: none; }
    .cons-tile-img { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--bg2); }
    .cons-tile-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cons-tile-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46px; }
    .cons-tile-badge { position: absolute; top: 6px; right: 6px; }
    /* No photo yet: a short band in the category's colour instead of a square */
    .cons-tile.no-photo .cons-tile-img { aspect-ratio: auto; height: 88px; }
    .cons-tile.no-photo .cons-tile-icon { font-size: 34px; }
    /* Count bubble — how many of this you've picked, readable at a glance */
    .cons-tile-qty {
      position: absolute; top: 6px; left: 6px; min-width: 26px; height: 26px; padding: 0 7px;
      border-radius: 13px; background: var(--select-bg); color: var(--select-text);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; font-family: var(--mono);
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .cons-tile-body { padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
    .cons-tile-name { font-size: 14px; font-weight: 500; line-height: 1.3; color: var(--text); }
    .cons-tile-unit { font-size: 12px; color: var(--text3); margin-top: 2px; }
    /* Everything below the name is controls: a near miss there does nothing */
    .cons-tile-foot { margin: auto -9px -9px; padding: 0 9px 9px; display: flex; flex-direction: column; gap: 8px; cursor: default; }
    .cons-tile-controls { display: flex; align-items: center; }
    .cons-tile-controls .qty-input { flex: 1; min-width: 0; width: auto; text-align: center; }
    .cons-box-btn {
      display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; min-height: 48px;
      border: 1px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text2);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .cons-box-btn:active { background: var(--border); }
    /* ── Barcode scanning (toast + link picker styles are shared, in style.css) ── */
    /* Setup-mode banner — loud, so it can't be left on by accident */
    .bc-setup-banner {
      display: flex; align-items: center; gap: 8px; padding: 9px 16px; flex-shrink: 0;
      background: var(--setup-banner-bg); color: var(--setup-banner-text); border-bottom: 1px solid var(--setup-banner-line);
      font-size: 12.5px; font-weight: 600;
    }
    /* Setup-mode per-tile flag: green = has barcode(s), red = still to do */
    .cons-bc-flag {
      position: absolute; bottom: 6px; right: 6px; display: flex; align-items: center; gap: 3px;
      padding: 3px 7px; border-radius: 20px; font-size: 11px; font-weight: 700; font-family: var(--mono);
    }
    .cons-bc-flag.has  { background: var(--green); color: #fff; }
    .cons-bc-flag.none { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-text); }
    /* Recent sign-out names — tap instead of retyping */
    .recent-names { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .recent-name-chip {
      min-height: 48px; padding: 0 18px; border-radius: 24px; cursor: pointer; font-size: 15px;
      border: 1px solid var(--border2); background: var(--bg); color: var(--text);
    }
    .recent-name-chip:active { background: var(--bg2); }
    .signout-card { max-width: 560px; }
    .signout-item-list { display: flex; flex-direction: column; gap: 6px; max-height: 42vh; overflow-y: auto; text-align: left; }
    /* Name, then the stepper, then Remove well apart from "+" */
    .signout-item-row {
      display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px 20px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px;
    }
    @media (max-width: 600px) {
      .signout-item-row { grid-template-columns: 1fr auto; }
      .signout-item-controls { grid-row: 2; grid-column: 1 / -1; }
      .signout-item-row .remove-btn { grid-row: 1; grid-column: 2; }
    }
    .signout-item-row.over-limit { border-color: var(--amber-text); }
    .signout-item-info { flex: 1; min-width: 0; text-align: left; }
    .signout-item-name { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.3; }
    .signout-item-unit { font-size: 13px; color: var(--text3); margin-top: 1px; }
    .signout-item-controls { display: flex; align-items: center; flex-shrink: 0; }
    /* A scan that didn't work: stays until it is closed */
    #scan-problem {
      position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 210;
      width: min(560px, calc(100vw - 32px)); display: flex; align-items: center; gap: 14px;
      background: var(--toast-warn-bg); color: #fff; padding: 12px 12px 12px 18px;
      border-radius: var(--radius-lg); box-shadow: var(--shadow-toast);
    }
    #scan-problem .ti { font-size: 24px; flex-shrink: 0; }
    .scan-problem-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 600; line-height: 1.35; text-wrap: pretty; }
    .scan-problem-lines small { display: block; font-size: 12px; font-weight: 400; font-family: var(--mono); opacity: 0.85; }
    #scan-problem button {
      min-height: 48px; padding: 0 18px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.5);
      background: none; color: #fff; font-size: 15px; font-weight: 600;
    }
  </style>
</head>
<body class="floor">
<!-- Start-up cover: painted before any script; see Boot in js/shared.js -->
<div id="boot">
  <div class="header"><div class="col"><div class="header-inner">
    <span class="header-logo"></span>
    <div class="header-left"><div class="header-title">Consumables</div><div class="header-ref"><span class="live-dot connecting"></span>Connecting…</div></div>
  </div></div></div>
  <div class="boot-tabs"></div>
  <div class="col boot-rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="boot-late"><p>Can't reach the app. Check the Wi-Fi, then tap Reload.</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div>
</div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b)b.classList.add('late');},12000);</script>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- APP CHECK: remove this line to disable App Check (also remove init block in firebase-sync.js) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/shared.js?v=2026-11-27.2"></script>
<script src="js/firebase-sync.js?v=2026-11-27.2"></script>
<script src="js/auth.js?v=2026-11-27.2"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}

const ConsApp = {
  consumables: [],
  // CSV-backed list only — this.consumables = _baseConsumables + ghosts (items
  // created during setup on the manager page whose CSV row hasn't landed yet),
  // re-merged on every stock snapshot so new items are usable the same day.
  _baseConsumables: [],
  _stock:      [],       // live from Firestore
  _unsubStock: null,
  _items:      {},       // id -> qty in current checkout
  _stockReady: false,
  _checkoutBusy: false,  // in-flight guard — Enter key bypasses the disabled button
  _noImage: new Set(),   // stock keys whose photo 404'd this session — don't re-request
  _photos: new Set(),    // stock keys that have a photo: images/consumables/photos.txt
  // Barcode setup mode (toggled in Settings): scans LINK barcodes to items instead of
  // signing anything out — for the manager walking through initial setup on this iPad
  // (the scanner is fixed here). Off = tradesman mode: unknown scans never prompt.
  _barcodeSetup: localStorage.getItem('cons_bc_setup') === '1',

  async init() {
    FirebaseConfig.forget();
    const ok = await DB.init(FirebaseConfig.get());
    if (!ok) { this.showSetup("Can't reach the database. Check the Wi-Fi, then tap Reload."); return; }
    DB.onDenied = () => Auth.denied();
    Auth.deviceName = ConsumablesDeviceName;
    Auth.start();
    this._baseConsumables = await Data.loadConsumables('./consumables.csv', list => this._setConsumables(list));
    this.consumables = this._baseConsumables;
    this.renderShell();
    Boot.ready('page');
    this._loadPhotos();
    this.startStockListening();
    this.startConnectionStatus();
    this.startVersionCheck();
  },

  // Only photos listed in photos.txt are asked for: a tile never makes a request that 404s.
  async _loadPhotos() {
    try {
      const r = await fetch('images/consumables/photos.txt?nocache=' + Date.now());
      if (!r.ok) return;
      const keys = (await r.text()).split(/\r?\n/).map(l => l.trim().toLowerCase())
        .filter(l => l && !l.startsWith('#')).map(l => l.replace(/\.jpe?g$/, ''));
      this._photos = new Set(keys);
      if (keys.length) this.renderList();
    } catch {}
  },

  // Firebase itself could not be reached (no network at first load, the SDK
  // blocked): a plain card and a Reload. The config is in the code (shared.js).
  showSetup(err) {
    Boot.gone();
    document.getElementById('root').innerHTML = `
      <div class="setup-screen"><div class="setup-card" style="text-align:center">
        <div class="auth-logo"></div>
        <p style="margin-bottom:16px">${esc(err || 'Could not connect.')}</p>
        <button class="btn btn-primary" style="width:100%" onclick="location.reload()"><i class="ti ti-refresh"></i> Reload</button>
      </div></div>`;
  },

  renderShell() {
    const deviceName = ConsumablesDeviceName.get();
    document.getElementById('root').innerHTML = `
      <div class="app-root" id="app-root">
        <div class="header">
          <div class="col"><div class="header-inner">
            <span class="header-logo"></span>
            <div class="header-left">
              <div class="header-title">Consumables</div>
              <div class="header-ref"><span class="live-dot connecting" id="live-dot"></span><span id="live-label">Connecting…</span><span class="hdr-extra"> &nbsp;·&nbsp; <span id="app-version" style="font-family:var(--mono)"></span></span></div>
            </div>
            <div class="header-actions">
              ${deviceName ? `<span class="device-chip"><i class="ti ti-device-ipad" style="font-size:12px"></i> ${esc(deviceName)}</span>` : ''}
              <span id="auth-pill"></span>
              <button class="icon-btn" id="btn-settings" aria-label="Settings"><i class="ti ti-settings"></i></button>
            </div>
          </div></div>
        </div>

        <div id="update-banner-wrap"></div>
        ${FirebaseConfig.isTestMode() ? '<div class="test-mode-banner"><i class="ti ti-flask"></i> Test mode — connected to test database</div>' : ''}
        <div class="bc-setup-banner" id="bc-setup-banner" style="display:${this._barcodeSetup ? 'flex' : 'none'}">
          <i class="ti ti-barcode"></i> Barcode setup mode — scans link barcodes to items. Nothing is signed out.
        </div>

        <!-- CATEGORY TABS -->
        <div id="cons-tabs-wrap"></div>

        <!-- SEARCH -->
        <div class="search-bar"><div class="col"><div class="search-wrap">
          <i class="ti ti-search"></i>
          <input type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="cons-search" placeholder="Search consumables…" autocomplete="off">
        </div></div></div>

        <!-- LIST -->
        <div class="app-scroll" id="cons-scroll">
          <div class="col"><div class="mat-list" id="cons-mat-list"></div></div>
        </div>

        <!-- ACTION BAR -->
        <div class="action-bar"><div class="action-bar-inner split">
          <button class="btn-text" id="btn-cons-clear-main" hidden>Clear selection</button>
          <button class="btn btn-primary" id="btn-cons-review">
            <i class="ti ti-clipboard-check"></i>Review and sign out
            <span class="sidebar-count zero" id="cons-badge" style="margin-left:4px">0</span>
          </button>
        </div></div>

        <div class="panel" id="settings-panel">
          <div class="panel-header">
            <button class="back-btn" id="btn-close-settings"><i class="ti ti-chevron-left"></i>Back</button>
            <div class="panel-title">Settings</div>
            <div class="panel-spacer"></div>
          </div>
          <div class="panel-scroll"><div class="panel-col" style="gap:20px" id="settings-body"></div></div>
        </div>
      </div>
      <div id="overlay-wrap"></div>`;

    // Listeners
    const tabs = document.getElementById('cons-tabs-wrap');
    tabs.addEventListener('click', e => {
      const c = e.target.closest('[data-cat-idx]');
      const s = e.target.closest('[data-sub-idx]');
      if (c) { const i=+c.dataset.catIdx; this.setCat(i===-1?null:this._cats[i]); }
      else if (s) { const i=+s.dataset.subIdx; this.setSub(i===-1?null:this._subs[i]); }
    });
    document.getElementById('cons-mat-list').addEventListener('click', e => {
      const dec=e.target.closest('[data-dec]'), inc=e.target.closest('[data-inc]');
      const box=e.target.closest('[data-box]');
      if (dec) { this.adj(+dec.dataset.dec, -1); return; }
      if (inc) { this.adj(+inc.dataset.inc,  1); return; }
      if (box) { this.addBox(+box.dataset.box); return; }
      if (e.target.closest('.cons-tile-foot')) return; // the controls' own area: a near miss does nothing
      // Tap the photo or the name to add one: the fast path for walking the shelf.
      const tile = e.target.closest('[data-tile]');
      if (tile) this.adj(+tile.dataset.tile, 1);
    });
    QtyField.attach(document.getElementById('cons-mat-list'), '[data-qid]', {
      zero: true,
      item: el => this.consumables.find(m => m.id == el.dataset.qid),
      get:  el => this.get(+el.dataset.qid),
      set:  (el, qty) => { this.set(+el.dataset.qid, qty); this._limit(+el.dataset.qid, qty, el); },
      live: el => {
        const tile = el.closest('.cons-tile'), qty = this.get(+el.dataset.qid);
        if (tile) {
          tile.classList.toggle('in-order', qty > 0);
          let bubble = tile.querySelector('.cons-tile-qty');
          if (qty > 0 && !bubble) { bubble = document.createElement('span'); bubble.className = 'cons-tile-qty'; tile.querySelector('.cons-tile-img').appendChild(bubble); }
          if (bubble) { if (qty > 0) bubble.textContent = qty; else bubble.remove(); }
        }
        this._updateBadge();
      },
    });
    // A tile photo that 404s: remember its key so it's not requested again, and drop the
    // <img> so the category icon beneath shows through. Error events don't bubble — capture.
    document.getElementById('cons-mat-list').addEventListener('error', e => {
      const img = e.target;
      if (img.tagName === 'IMG' && img.dataset.sid) { this._noImage.add(img.dataset.sid); img.closest('.cons-tile')?.classList.add('no-photo'); img.remove(); }
    }, true);
    document.getElementById('cons-search').addEventListener('input', e => {
      if (searchScope(this, e.target.value.trim(), '_activeCat', '_activeSub')) this.renderTabs();
      this.renderList();
    });
    document.getElementById('btn-cons-review').addEventListener('click', () => this.openSignOutOverlay());
    document.getElementById('btn-cons-clear-main').addEventListener('click', async () => {
      if (!await Ask.confirm({ title: 'Clear the selected items?', yes: 'Clear selection', no: 'Keep selection', danger: true })) return;
      this._items = {};
      this._changed();
    });
    document.getElementById('btn-settings')      .addEventListener('click', () => { this._populateSettings(); this.openPanel('settings-panel'); });
    document.getElementById('btn-close-settings').addEventListener('click', () => { this.closePanel('settings-panel'); Auth.lockAdmin(); });

    this._activeCat = null; this._activeSub = null;
    this._cats = []; this._subs = [];
    this.renderTabs();
    this.renderList();

    const verEl = document.getElementById('app-version');
    if (verEl) verEl.textContent = verLabel(APP_VERSION);

    // Scanner is a paired keyboard, so this listens page-wide — no need to tap into a
    // field first. Guarded because renderShell also runs after first-time setup.
    if (!this._scannerStarted) {
      this._scannerStarted = true;
      BarcodeScanner.start(code => this._onScan(code), {
        // A scan made while a name or a quantity is being typed is still a scan.
        through: el => el.id === 'overlay-tradesman-name' || el.classList.contains('qty-input'),
      });
    }
  },

  // ── LIVE STATUS DOT (3-state: Live / Update Available / Offline) ──
  // Single source of truth so the dot and the update banner never disagree.
  // connected starts null (= not yet known) — the sign-out guard must only block on
  // an explicit false, or signing out right after page load gets wrongly refused.
  _connState: { connected: null, latestVersion: null },

  _renderLiveStatus() { Live.render(this._connState); },

  // Live connection indicator — reflects actual Firestore connection state.
  startConnectionStatus() {
    DB.listenConnectionStatus(connected => {
      this._connState.connected = connected;
      this._renderLiveStatus();
    });
  },

  // Version staleness check — see firebase-sync.js announceVersionIfNewer
  // for the rollback caveat (manually edit meta/version in Firebase
  // console if you ever revert to an older build).
  startVersionCheck() {
    DB.announceVersionIfNewer(APP_VERSION, isVersionNewer);
    DB.listenAppVersion(latest => {
      this._connState.latestVersion = latest;
      this._renderLiveStatus();
      AutoUpdate.notifyVersion(latest);
    });
    // Idle auto-reload for the checkout iPad at the door — never while someone
    // has items selected mid-sign-out.
    AutoUpdate.start({
      onDiscover: v => { this._connState.latestVersion = v; this._renderLiveStatus(); },
      isBusy:     () => Object.keys(this._items).length > 0,
    });
  },

  // A changed list: the selection moves over by what each line is.
  _setConsumables(list) {
    const was = this.consumables;
    this._baseConsumables = list;
    this.consumables = GhostItems.merge(list, this._stock);
    this._items = Kept.move(this._items, was, this.consumables);
    if (!document.getElementById('app-root')) return;
    this.renderTabs(); this._changed();
  },

  startStockListening() {
    if (this._unsubStock) this._unsubStock();
    this._unsubStock = DB.listenStock((records, fromCache) => {
      this._stock = records;
      if (!fromCache || records.length) this._stockReady = true;
      // Fold in ghosts (items created during setup, CSV row pending) so tradesmen
      // can sign them out the same day they're shelved.
      this.consumables = GhostItems.merge(this._baseConsumables, records);
      if (this._stockReady) this._loadKept();
      // Tabs are computed from TRACKED items, which need stock data — the initial
      // renderShell ran before any stock arrived, so they must be re-rendered here
      // too or the category bar stays stuck on just "All".
      this.renderTabs();
      this.renderList();
      // Re-render the sign-out overlay if it's currently open, so live stock changes reflect there too
      if (document.getElementById('signout-item-list')) this._refreshSignOutItemsOnly();
    });
  },

  // A selection survives a reload for half an hour.
  _keep() {
    if (!this._keptLoaded) return;
    if (this.count()) Kept.save('signout', { lines: Kept.lines(this.items()) }); else Kept.drop('signout');
  },
  _loadKept() {
    if (this._keptLoaded) return;
    this._keptLoaded = true;
    const v = Kept.load('signout', 30 * 60000);
    if (v) { Kept.fill(v.lines, this.consumables, (m, l) => this.set(m.id, l.qty)); this._updateBadge(); }
  },

  _stockFor(sid)   { return this._stock.find(r => r._id === sid) || null; },
  _availableQty(m) {
    const rec = this._stockFor(stockId(m));
    if (!rec?.tracked) return null;   // null = not tracked
    return rec.qty || 0;
  },
  _stockStatus(m) {
    const rec = this._stockFor(stockId(m));
    if (!rec?.tracked) return 'untracked';
    const qty = rec.qty || 0;
    if (qty <= 0) return 'zero';
    if (rec.warningQty > 0 && qty <= rec.warningQty) return 'low';
    return 'ok';
  },

  // Cart helpers
  get(id)        { return this._items[id]||0; },
  set(id,qty)    {
    const m = this.consumables.find(x=>x.id==id);
    const avail = m ? this._availableQty(m) : null;
    if (avail !== null) qty = Math.min(qty, avail);
    if (qty <= 0) delete this._items[id]; else this._items[id]=qty;
  },
  // quiet: the caller says what happened itself (a scan).
  adj(id,d,quiet) { const want = round2(this.get(id)+d); this.set(id, want); if (!quiet) this._limit(id, want); this._changed(); },
  // Secondary "take a box" action for boxed items — adds a whole box's worth of
  // individual units (clamped to available stock by set()). Individual +/− stays primary.
  addBox(id,quiet){ const m = this.consumables.find(x=>x.id==id); if (!hasBoxTracking(m)) return; const want = this.get(id) + m.boxSize; this.set(id, want); if (!quiet) this._limit(id, want); this._changed(); },
  // Asked for more than there is: it was capped, and that is said.
  _limit(id, want, field) {
    if (this.get(id) >= want) return false;
    const m = this.consumables.find(x => x.id == id), a = m ? this._availableQty(m) : null;
    if (a === null) return false;
    const msg = a > 0 ? `Only ${a} left` : 'None left';
    if (field) QtyField._note(field, msg); else toast(msg, true);
    return true;
  },

  // ── BARCODE SCANNING ──────────────────────────────────────────────────
  // The scanner lives at the door, so people arrive holding the thing they're taking:
  // scanning the box adds a whole box (that's what's in their hand), while tapping a
  // grid tile adds one. Linking codes to items is a SETUP job (settings toggle), not
  // something tradesmen do mid-sign-out — an unknown scan just points them at the
  // manager, because a mislinked barcode silently signs out the wrong item forever.
  _onScan(code) {
    const m = this._findByBarcode(code);
    if (this._barcodeSetup) {
      // Setup mode: link unknown codes, verify known ones — never touch the cart.
      if (m) this._toast(`Already linked: ${m.description}`);
      else this._promptLinkBarcode(code);
      return;
    }
    if (this._checkoutBusy) { this._scanProblem('Signing out. Scan again in a moment.'); return; }
    if (!m) { this._scanProblem('Barcode not set up. See the manager.', code); return; }
    const isBoxed = hasBoxTracking(m);
    const before  = this.get(m.id);
    if (isBoxed) this.addBox(m.id, true); else this.adj(m.id, 1, true);
    const added = this.get(m.id) - before;
    if (added <= 0) {
      const avail = this._availableQty(m);
      this._scanProblem(avail === null ? `${m.description}: not set up for sign out. See the manager.` : `${m.description}: no more in stock.`);
      return;
    }
    this._toast(isBoxed
      ? `Added 1 ${m.boxUnit || 'Box'} (${added}) · ${m.description}`
      : `Added 1 · ${m.description}`);
  },

  _toggleBarcodeSetup() {
    this._barcodeSetup = !this._barcodeSetup;
    localStorage.setItem('cons_bc_setup', this._barcodeSetup ? '1' : '0');
    const banner = document.getElementById('bc-setup-banner');
    if (banner) banner.style.display = this._barcodeSetup ? 'flex' : 'none';
    this.renderList();          // tiles gain/lose their barcoded-yet badges
    this._populateSettings();   // refresh the toggle's own label
  },

  _findByBarcode(code) {
    const c = String(code).trim().toLowerCase();
    // Learned barcodes live on the stock record. A code matching a part code also
    // resolves, in case labels are ever printed with the part code on them.
    const rec = this._stock.find(r => (r.barcodes || []).some(b => String(b).toLowerCase() === c));
    if (rec) { const m = this.consumables.find(x => stockId(x) === rec._id); if (m) return m; }
    return this.consumables.find(x => (x.partCode || '').toLowerCase() === c) || null;
  },

  // Brief confirmation — the scanner gives no feedback of its own, so this is how you
  // know the scan landed (and on what) without looking away from what you're doing.
  _toast(msg, isWarning) { toast(msg, isWarning); },

  // A scan that didn't work has to be seen: it stays until it is closed, with the ones
  // before it, and a good scan doesn't hide it.
  _scanProblems: [],
  _scanProblem(msg, code) {
    this._scanProblems = [{ msg, code }, ...this._scanProblems].slice(0, 3);
    let el = document.getElementById('scan-problem');
    if (!el) {
      el = document.createElement('div'); el.id = 'scan-problem'; el.setAttribute('role', 'alert');
      el.addEventListener('click', () => { this._scanProblems = []; el.remove(); });
      document.body.appendChild(el);
    }
    el.innerHTML = `<i class="ti ti-alert-triangle"></i>
      <div class="scan-problem-lines">${this._scanProblems.map(p => `<div>${esc(p.msg)}${p.code ? `<small>${esc(p.code)}</small>` : ''}</div>`).join('')}</div>
      <button>Close</button>`;
  },

  // First time a barcode is seen: ask what it is, remember it, then add it. Builds the
  // barcode list by scanning instead of by typing codes into a spreadsheet.
  _promptLinkBarcode(code) {
    const tracked = this.consumables
      .filter(m => this._stockFor(stockId(m))?.tracked)
      .sort((a,b) => descCompare(a.description, b.description));
    const ow = document.getElementById('overlay-wrap');
    const rows = tracked.map(m =>
      `<button class="scan-link-row" data-link-id="${m.id}">${descHtml(m.description)}</button>`).join('');
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card signout-card">
          <div class="success-icon blue"><i class="ti ti-barcode"></i></div>
          <h3>New barcode</h3>
          <p style="margin-bottom:8px">Which item is this? It'll be remembered for next time.<br>
            <span style="font-family:var(--mono);font-size:12px">${esc(code)}</span></p>
          <input class="checkout-name-input" type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="scan-link-search" placeholder="Search items…" autocomplete="off" style="margin-bottom:8px">
          <div class="scan-link-list" id="scan-link-list">${rows}</div>
          <button class="btn btn-outline" id="btn-scan-link-cancel" data-esc style="width:100%;margin-top:10px">Not now</button>
        </div>
      </div>`;
    const search = document.getElementById('scan-link-search');
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      document.querySelectorAll('#scan-link-list .scan-link-row').forEach(r => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
    document.getElementById('scan-link-list').addEventListener('click', async e => {
      const row = e.target.closest('[data-link-id]'); if (!row) return;
      const m = this.consumables.find(x => x.id == row.dataset.linkId); if (!m) return;
      ow.innerHTML = '';
      try {
        const by = `${ConsumablesDeviceName.get() || 'Consumables iPad'} — setup`;
        await DB.linkBarcode(stockId(m), code, by);
        this._toast(`Linked to: ${m.description}`);
      } catch(err) {
        if (err.message === 'BARCODE_IN_USE') {
          const other = this.consumables.find(x => stockId(x) === err.existingId);
          this._toast(`Already linked to: ${other ? other.description : 'another item'}`, true);
        } else {
          const why = whyFailed(err);
          Ask.tell('Barcode not linked', `${why[0].toUpperCase()}${why.slice(1)}. Scan it again.`);
        }
      }
    });
    document.getElementById('btn-scan-link-cancel').addEventListener('click', () => { ow.innerHTML = ''; });
  },
  zero(id)       { delete this._items[id]; this._changed(); },
  count()        { return Object.keys(this._items).length; },
  items()        {
    return Object.keys(this._items).map(id => {
      const m = this.consumables.find(x=>x.id==id);
      return m ? {...m, qty:this._items[id]} : null;
    }).filter(Boolean);
  },

  _cartId: null,   // from the first try to sign this cart out until it is empty: a try that failed never counts twice
  _changed() {
    if (!this.count()) this._cartId = null;
    this._updateBadge(); this.renderList();
    // A scan with the sign-out dialog open lands in its list.
    if (document.getElementById('signout-item-list')) this._refreshSignOutItemsOnly();
  },
  _updateBadge() {
    const b = document.getElementById('cons-badge'); if (!b) return;
    const n = this.count(); setCount(b, n);
    document.getElementById('btn-cons-review')?.classList.toggle('is-idle', n === 0);
    const c = document.getElementById('btn-cons-clear-main'); if (c) c.hidden = n === 0;
    this._keep();
  },

  renderTabs() {
    const wrap = document.getElementById('cons-tabs-wrap'); if (!wrap) return;
    // Only show tracked items in tabs
    const tracked = this.consumables.filter(m => this._stockFor(stockId(m))?.tracked);
    this._cats = Data.categoriesBySize(tracked);
    this._subs = this._activeCat ? Data.subcategories(tracked, this._activeCat) : [];
    Strip.draw(wrap, { cats: this._cats, cat: this._activeCat, subs: this._subs, sub: this._activeSub });
  },

  setCat(cat) { this._activeCat=cat; this._activeSub=null; this.renderTabs(); this.renderList(); const s=document.getElementById('cons-scroll'); if(s)s.scrollTop=0; },
  setSub(sub) { this._activeSub=sub; this.renderTabs(); this.renderList(); },

  renderList() {
    const list = document.getElementById('cons-mat-list'); if (!list) return;
    const q = document.getElementById('cons-search')?.value || '';

    // Only show tracked consumables on the worker page
    const tracked = this.consumables.filter(m => this._stockFor(stockId(m))?.tracked);
    let filtered = Data.filter(tracked, this._activeCat, this._activeSub, q);
    const note = searchNote(filtered, q);

    // Sort: in-stock first (by status), then zero/out
    const order = {ok:0, low:1, zero:2};
    if (!q.trim()) filtered = [...filtered]; // the list is shared; a search result is its own
    filtered.sort((a,b)=>(order[this._stockStatus(a)]??0)-(order[this._stockStatus(b)]??0)||descCompare(a.description,b.description));

    if (!this.consumables.length && Data.consFailed) {
      list.innerHTML = `<div class="empty-state"><i class="ti ti-wifi-off"></i><p>Can't load the consumables list. Check the Wi-Fi, then tap Reload.</p><button class="btn btn-primary" style="width:auto;margin-top:14px" onclick="Live.reload(this)">Reload</button></div>`;
      return;
    }
    if (!this._stockReady) { list.innerHTML = skeleton(8, 'tiles'); return; }
    if (!filtered.length) {
      list.innerHTML = note || `<div class="empty-state"><i class="ti ti-package-off"></i><p>Nothing in stock in this category.</p></div>`;
      return;
    }

    const restoreFocus = captureInputFocus(); // stock updates re-render mid-typing
    const tiles = filtered.map(m => {
      const qty    = this.get(m.id);
      const inOrder= qty > 0;
      const avail  = this._availableQty(m);
      const status = this._stockStatus(m);
      const ci     = CAT_ICONS[m.category] || CAT_ICONS.default;
      const isZero = status === 'zero';
      const isBoxed = hasBoxTracking(m);
      const sid    = stockId(m);

      const stockBadgeClass = status==='low' ? 'low' : status==='zero' ? 'zero' : 'ok';
      const stockLabel = avail === null ? '' : isZero ? 'Out of stock' : status === 'low' ? `Only ${avail} left` : `${avail} in stock`;
      const stockBadge = avail !== null
        ? `<span class="cons-stock-badge ${stockBadgeClass} cons-tile-badge">${stockLabel}</span>`
        : '';

      // Photo if present (images/consumables/<key>.jpg); the category icon sits beneath
      // and shows through if the photo is missing. A failed photo is remembered for the
      // session (_noImage) so it isn't re-requested on every re-render.
      const hasPhoto = this._photos.has(sid) && !this._noImage.has(sid);
      const imgTag = hasPhoto ? `<img src="images/consumables/${esc(sid)}.jpg" alt="" loading="lazy" data-sid="${esc(sid)}">` : '';
      // The whole tile is the tap target — tap adds one, so you can walk the shelf and
      // tap what you need. The stepper/box controls below opt out of that (they stop the
      // click), and the count bubble shows what's picked at a glance.
      // In setup mode each tile also shows whether it's been barcoded yet.
      const bcCount = (this._stockFor(sid)?.barcodes || []).length;
      const bcBadge = this._barcodeSetup
        ? `<span class="cons-bc-flag ${bcCount ? 'has' : 'none'}"><i class="ti ti-barcode"></i>${bcCount ? ' ' + bcCount : ''}</span>` : '';
      return `<div class="cons-tile ${inOrder?'in-order':''} ${isZero?'out-of-stock':''} ${hasPhoto?'':'no-photo'}" data-tile="${m.id}">
        <div class="cons-tile-img">
          ${catTile(m.category, 'cons-tile-icon')}
          ${imgTag}
          ${stockBadge}
          ${qty > 0 ? `<span class="cons-tile-qty">${qty}</span>` : ''}
          ${bcBadge}
        </div>
        <div class="cons-tile-body">
          <div><div class="cons-tile-name">${descHtml(m.description)}</div><div class="cons-tile-unit">${isBoxed ? `Each · ${esc(m.boxUnit||'Box')} of ${m.boxSize}` : esc(m.qtyType||'')}</div></div>
          <div class="cons-tile-foot"><div class="cons-tile-controls">
            <button class="qty-btn" data-dec="${m.id}">−</button>
            <input class="qty-input" ${QtyField.attrs(m)} ${avail!==null?`max="${avail}"`:''} value="${qty || ''}" data-qid="${m.id}">
            <button class="qty-btn" data-inc="${m.id}">+</button>
          </div>
          ${isBoxed ? `<button class="cons-box-btn" data-box="${m.id}"><i class="ti ti-box-seam"></i> Take a ${esc(m.boxUnit||'Box')} (${m.boxSize})</button>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
    list.innerHTML = `${note}<div class="cons-grid">${tiles}</div>`;
    restoreFocus();
  },

  openPanel(id)  { document.getElementById(id)?.classList.add('open'); },
  closePanel(id) { document.getElementById(id)?.classList.remove('open'); },

  _populateSettings() {
    const s = Settings.get();
    const el = document.getElementById('settings-body'); if (!el) return;
    const isTest = FirebaseConfig.isTestMode();
    el.innerHTML = `
      <div class="settings-section">
        <div class="settings-label">Device</div>
        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">Device name</div></div>
            <input type="text" id="s-device-name" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(ConsumablesDeviceName.get())}" style="max-width:220px" data-admin-only ${Auth.adminOpen() ? '' : 'hidden'}>
            <span class="settings-value" data-admin-locked ${Auth.adminOpen() ? 'hidden' : ''}>${esc(ConsumablesDeviceName.get())}</span>
          </div>
        </div>
      </div>
      ${Auth.settingsSection()}
      <div class="settings-section">
        <div class="settings-label">Appearance</div>
        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">Theme</div><div class="settings-row-sub">Colours and logo for this device — applies to every page opened on it</div></div>
            <select id="s-theme">${THEMES.map(t => `<option value="${t.id}"${Theme.get() === t.id ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
          </div>
          <label class="settings-row">
            <div><div class="settings-row-label">Fractions as symbols</div><div class="settings-row-sub">Show 1 1/2" as 1½" — off keeps sizes large and easy to read on the iPads</div></div>
            <input type="checkbox" id="s-fraction-glyphs" ${s.fractionGlyphs ? 'checked' : ''} style="width:20px;height:20px">
          </label>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Search &amp; sort</div>
        <div class="settings-card">
          <label class="settings-row">
            <div><div class="settings-row-label">Numeric-aware sorting</div><div class="settings-row-sub">e.g. 8mm lists before 10mm; inch sizes slot in by their mm value (32mm sits between 1&quot; and 1 1/2&quot;)</div></div>
            <input type="checkbox" id="s-natural-sort" ${s.naturalSort!==false?'checked':''} style="width:20px;height:20px">
          </label>
          <label class="settings-row">
            <div><div class="settings-row-label">Unit-aware search</div><div class="settings-row-sub">"1 inch", "25.4mm", "1\"" etc. all find the same item</div></div>
            <input type="checkbox" id="s-unit-search" ${s.unitAwareSearch!==false?'checked':''} style="width:20px;height:20px">
          </label>
          <label class="settings-row">
            <div><div class="settings-row-label">Typo-tolerant search</div><div class="settings-row-sub">Finds close matches even with spelling mistakes</div></div>
            <input type="checkbox" id="s-fuzzy-search" ${s.fuzzySearch!==false?'checked':''} style="width:20px;height:20px">
          </label>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Barcodes</div>
        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">Barcode setup mode</div><div class="settings-row-sub">Scans link barcodes to items instead of signing out — for walking through initial setup. Turn off before normal use.</div></div>
            <button class="btn-sm ${this._barcodeSetup?'btn-sm-danger':''}" id="btn-toggle-bc-setup">${this._barcodeSetup?'On — tap to exit':'Off'}</button>
          </div>
        </div>
      </div>
      <div class="settings-section" data-master-only ${Auth.isMaster() ? "" : "hidden"}>
        <div class="settings-label">Database</div>
        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">Test mode</div><div class="settings-row-sub">Use a separate test Firebase database — shared across all pages on this server</div></div>
            <button class="btn-sm ${isTest?'btn-sm-danger':''}" id="btn-toggle-test-mode">${isTest?'On — tap to exit':'Off'}</button>
          </div>
        </div>
      </div>`;
    document.getElementById('btn-toggle-bc-setup').addEventListener('click', () => this._toggleBarcodeSetup());
    const dn = document.getElementById('s-device-name');
    dn.addEventListener('change', () => {
      const v = dn.value.trim();
      if (!v) { dn.value = ConsumablesDeviceName.get(); return; }
      ConsumablesDeviceName.save(v); dn.defaultValue = v;
      const chip = document.querySelector('.device-chip'); if (chip) chip.innerHTML = `<i class="ti ti-device-ipad" style="font-size:12px"></i> ${esc(v)}`;
      const shown = dn.nextElementSibling; if (shown) shown.textContent = v;
    });
    dn.addEventListener('keydown', e => { if (e.key === 'Enter') dn.blur(); });
    document.getElementById('s-theme').addEventListener('change', e => Theme.set(e.target.value));
    for (const [id, key] of [['s-natural-sort', 'naturalSort'], ['s-fraction-glyphs', 'fractionGlyphs'], ['s-unit-search', 'unitAwareSearch'], ['s-fuzzy-search', 'fuzzySearch']])
      document.getElementById(id).addEventListener('change', e => { Settings.save({ [key]: e.target.checked }); this.renderList(); });
    document.getElementById('btn-toggle-test-mode').addEventListener('click', () => {
      FirebaseConfig.setTestMode(!FirebaseConfig.isTestMode());
      location.reload();
    });
  },

  // Recently-used sign-out names (device-local) — tap a chip instead of retyping.
  // Most-recent first, deduped case-insensitively, capped so the row stays glanceable.
  _recentNames() {
    try { return JSON.parse(localStorage.getItem('cons_recent_names') || '[]'); } catch { return []; }
  },
  _saveRecentName(name) {
    const list = this._recentNames().filter(n => n.toLowerCase() !== name.toLowerCase());
    list.unshift(name);
    localStorage.setItem('cons_recent_names', JSON.stringify(list.slice(0, 8)));
  },

  // Combined sign-out overlay: name field + small editable item list, all in one step.
  // Replaces the old separate review panel — most sign-outs are a single line,
  // so this keeps it to one screen rather than review-panel → name-popup.
  openSignOutOverlay() {
    if (this.count() === 0) { toast('No items selected yet', true); return; }
    this._renderSignOutOverlay();
  },

  // The dialog's item rows, and the note above them. Drawn on their own so a scan, a
  // quantity change or a stock update never touches the name being typed.
  _signOutParts() {
    const items = this.items();
    const over  = items.some(i => { const a = this._availableQty(i); return a !== null && i.qty > a; });
    const rows  = items.map(i => {
      const avail     = this._availableQty(i);
      const overLimit = avail !== null && i.qty > avail;
      return `<div class="signout-item-row${overLimit?' over-limit':''}">
        <div class="signout-item-info">
          <div class="signout-item-name">${descHtml(i.description)}</div>
          <div class="signout-item-unit">${esc(i.qtyType||'')}${avail!==null?` · ${avail} in stock`:''}</div>
        </div>
        <div class="signout-item-controls">
          <button class="qty-btn" data-so-dec="${i.id}">−</button>
          <input class="qty-input" ${QtyField.attrs(i)} ${avail!==null?`max="${avail}"`:''} value="${i.qty}" data-so-qid="${i.id}">
          <button class="qty-btn" data-so-inc="${i.id}">+</button>
        </div>
        <button class="remove-btn" data-so-rem="${i.id}" aria-label="Take off"><i class="ti ti-x"></i></button>
      </div>`;
    }).join('');
    const warning = over ? `
            <div style="background:var(--amber-bg);border:1px solid var(--amber-text);border-radius:var(--radius);padding:8px 10px;font-size:12px;color:var(--amber-text);margin-bottom:8px;text-align:left">
              <i class="ti ti-alert-triangle"></i> Some quantities exceed current stock.
            </div>` : '';
    return { rows, warning };
  },

  _renderSignOutOverlay() {
    if (!this.count()) { document.getElementById('overlay-wrap').innerHTML = ''; return; }
    const { rows: itemRows, warning } = this._signOutParts();

    const ow = document.getElementById('overlay-wrap');
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card signout-card">
          <div class="success-icon blue"><i class="ti ti-user"></i></div>
          <h3>Sign out items</h3>
          <input class="checkout-name-input" type="text" id="overlay-tradesman-name" placeholder="Your name" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" style="margin:10px 0 6px">
          ${this._recentNames().length ? `<div class="recent-names" id="recent-names">
            ${this._recentNames().map(n => `<button class="recent-name-chip" data-name="${esc(n)}">${esc(n)}</button>`).join('')}
          </div>` : ''}
          <div class="inline-error" id="signout-error" role="alert" hidden style="margin-bottom:8px"></div>
          <div id="signout-warning">${warning}</div>
          <div class="signout-item-list" id="signout-item-list">${itemRows}</div>
          <button class="btn btn-primary" id="btn-overlay-confirm" style="width:100%;margin-top:12px">
            <i class="ti ti-check"></i> Confirm sign out
          </button>
          <button class="btn btn-outline" id="btn-overlay-cancel" data-esc style="width:100%;margin-top:8px">Back to items</button>
        </div>
      </div>`;

    const nameInput = document.getElementById('overlay-tradesman-name');
    nameInput.focus();

    document.getElementById('recent-names')?.addEventListener('click', e => {
      const chip = e.target.closest('[data-name]'); if (!chip) return;
      nameInput.value = chip.dataset.name;
      inlineError('signout-error', '');
    });
    nameInput.addEventListener('input', () => inlineError('signout-error', ''));

    document.getElementById('signout-item-list').addEventListener('click', e => {
      const dec = e.target.closest('[data-so-dec]');
      const inc = e.target.closest('[data-so-inc]');
      const rem = e.target.closest('[data-so-rem]');
      if (this._checkoutBusy) return;
      if (dec && this.get(+dec.dataset.soDec) > 1) this.adj(+dec.dataset.soDec, -1);   // at 1 it stops: ✕ takes a line off
      if (inc) this.adj(+inc.dataset.soInc,  1);
      if (rem) this.zero(+rem.dataset.soRem);
    });
    QtyField.attach(document.getElementById('signout-item-list'), '[data-so-qid]', {
      item: el => this.consumables.find(m => m.id == el.dataset.soQid),
      get:  el => this.get(+el.dataset.soQid),
      set:  (el, qty) => { this.set(+el.dataset.soQid, qty); this._limit(+el.dataset.soQid, qty, el); },
      live: () => { this._updateBadge(); this.renderList(); },
    });

    const confirm = () => this._doCheckout(nameInput.value.trim());
    document.getElementById('btn-overlay-confirm').addEventListener('click', confirm);
    document.getElementById('btn-overlay-cancel').addEventListener('click', () => { ow.innerHTML = ''; });
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirm(); });
  },

  // Redraw the dialog's items in place; taking the last one off closes it.
  _refreshSignOutItemsOnly() {
    if (this._checkoutBusy) return;
    const list = document.getElementById('signout-item-list'); if (!list) return;
    if (!this.count()) { document.getElementById('overlay-wrap').innerHTML = ''; return; }
    const { rows, warning } = this._signOutParts();
    const w = document.getElementById('signout-warning'); if (w) w.innerHTML = warning;
    // The same lines as before: change them where they are, so nothing under a finger moves.
    const items = this.items();
    if (items.map(i => String(i.id)).join() === [...list.querySelectorAll('[data-so-qid]')].map(el => el.dataset.soQid).join()) {
      for (const i of items) {
        const inp = list.querySelector(`[data-so-qid="${i.id}"]`), row = inp.closest('.signout-item-row');
        const avail = this._availableQty(i);
        row.classList.toggle('over-limit', avail !== null && i.qty > avail);
        if (inp !== document.activeElement) { inp.value = i.qty; inp.defaultValue = String(i.qty); }
        if (avail !== null) inp.max = avail;
        const u = row.querySelector('.signout-item-unit'); if (u) u.textContent = `${i.qtyType || ''}${avail !== null ? ` · ${avail} in stock` : ''}`;
      }
      return;
    }
    const restoreFocus = captureInputFocus();
    list.innerHTML = rows;
    restoreFocus();
  },

  // Writes the stock adjustments once a name has been entered
  async _doCheckout(tradesmanName) {
    // Double-submit guard: the confirm button gets disabled below, but the Enter key
    // on the name field calls this directly — without the flag, a second Enter during
    // the awaits would deduct every item's stock a second time.
    if (this._checkoutBusy) return;
    // A name has letters in it: a barcode or a blank is not one.
    if (!/\p{L}/u.test(tradesmanName)) {
      inlineError('signout-error', 'Enter your name first.');
      document.getElementById('overlay-tradesman-name')?.focus();
      return;
    }
    const items = this.items();
    if (!items.length) { document.getElementById('overlay-wrap').innerHTML=''; return; }
    if (this._connState.connected === false || navigator.onLine === false) {
      inlineError('signout-error', 'Offline. Connect, then tap Confirm sign out.');
      return;
    }
    for (const item of items) {
      const avail = this._availableQty(item);
      if (avail !== null && item.qty > avail) {
        inlineError('signout-error', `${item.description}: only ${avail} in stock.`);
        return;
      }
    }

    this._checkoutBusy = true;
    try {
      const deviceName = ConsumablesDeviceName.get();
      const by = deviceName ? `${deviceName} — ${tradesmanName}` : tradesmanName;
      const sessionId = genRef();
      this._cartId = this._cartId || `${genRef()}-${Date.now()}`;

      const btn = document.getElementById('btn-overlay-confirm');
      const cancel = document.getElementById('btn-overlay-cancel');
      if (cancel) cancel.disabled = true;
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Signing out…'; }

      const errors = [];
      const failedIds = new Set();
      for (const item of items) {
        try {
          const op = `signout:${item.id}`;
          await DB.adjustStock(stockId(item), item.description, -item.qty, 'checkout', by, sessionId, null,
            OpId.for(op, { cart: this._cartId, qty: item.qty, by }));
          OpId.done(op);
        } catch(e) {
          failedIds.add(item.id);
          errors.push(`${item.description}: ${e.message === 'INSUFFICIENT_STOCK' ? 'not enough in stock' : whyFailed(e)}`);
        }
      }

      // Clear only what went through — failed items stay selected so they can be
      // adjusted and retried instead of having to be found and re-added from scratch.
      for (const item of items) if (!failedIds.has(item.id)) delete this._items[item.id];
      this._changed();

      const ow = document.getElementById('overlay-wrap');
      if (errors.length) {
        this._checkoutBusy = false;
        this._renderSignOutOverlay();      // what is left, with the name still in it
        document.getElementById('overlay-tradesman-name').value = tradesmanName;
        inlineError('signout-error', `Not signed out. ${errors.join('. ')}. Tap Confirm sign out to try again.`);
        return;
      }

      this._saveRecentName(tradesmanName);
      doneMessage(ow, { title: 'Signed out', text: `${items.length} item${items.length !== 1 ? 's' : ''} signed out to ${tradesmanName}. Stock updated.` });
    } finally {
      this._checkoutBusy = false;
    }
  },
};

document.addEventListener('DOMContentLoaded', () => ConsApp.init());
</script>
</body>
</html>
