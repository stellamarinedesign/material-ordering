<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#282827">
  <script>/* Theme bootstrap — runs before first paint so a themed device never flashes the default look. Choice is per device; see Theme in js/shared.js */try{var t=localStorage.getItem("mo_theme");if(t&&t!=="stella")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Material Orders">
  <title>Material Orders</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="fonts/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=2026-11-27.3">
  <link rel="stylesheet" href="css/themes.css?v=2026-11-27.3">
  <style>
    /* Prominent header button — stocktakes are worker-run, no manager needed */
    .stocktake-btn {
      display:flex; align-items:center; justify-content:center; gap:7px; height:48px; padding:0 16px;
      border-radius:var(--radius); border:1px solid rgba(255,255,255,0.3);
      background:rgba(255,255,255,0.12); color:#fff; font-size:14px; font-weight:600;
      cursor:pointer; white-space:nowrap;
    }
    .stocktake-btn .ti { font-size:18px; }
    /* Stocktake MODE — the whole page switches (persisted until exited), so the
       environment carries the signal: amber header, banner, tinted background,
       accent stripe on every card. Nothing here can create an order. */
    .app-root.stocktake-mode .header { background:#b45309; }
    .app-root.stocktake-mode { background:var(--stocktake-tint); }
    .app-root.stocktake-mode .app-scroll { background:var(--stocktake-tint); }
    .app-root.stocktake-mode .mat-card { border-left:4px solid #d97706; }
    .st-mode-banner {
      display:none; align-items:center; gap:8px; padding:9px 16px;
      font-size:12.5px; font-weight:600; flex-shrink:0; letter-spacing:0.01em;
      background:var(--stocktake-banner-bg); color:var(--stocktake-banner-text); border-bottom:1px solid var(--stocktake-banner-line);
    }
    .st-mode-banner .ti { font-size:15px; }
    .success-ref { display:block; font-family:var(--mono); color:var(--text); margin-bottom:4px; font-variant-numeric:tabular-nums; }
    .st-progress { margin-left:auto; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .st-today { color:var(--green-text); font-family:var(--font); font-weight:600; white-space:nowrap; }
    .st-today .ti { font-size:13px; vertical-align:-2px; }
    /* Review overlay bits (same look as the consumables sign-out overlay) */
    .signout-card { max-width:380px; }
    .signout-item-list { display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto; text-align:left; }
    .signout-item-row {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px;
    }
    .signout-item-info { flex:1; min-width:0; text-align:left; }
    .signout-item-name { font-size:13px; font-weight:500; color:var(--text); line-height:1.3; }
    .signout-item-unit { font-size:11px; color:var(--text3); margin-top:1px; }
  </style>
</head>
<body class="floor">
<!-- Start-up cover: painted before any script; see Boot in js/shared.js -->
<div id="boot">
  <div class="header"><div class="col"><div class="header-inner">
    <span class="header-logo"></span>
    <div class="header-left"><div class="header-title">Material Orders</div><div class="header-ref"><span class="live-dot connecting"></span>Connecting…</div></div>
  </div></div></div>
  <div class="boot-tabs"></div>
  <div class="col boot-rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="boot-late"><p>Can't reach the app. Check the Wi-Fi, then tap Reload.</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div>
</div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b)b.classList.add('late');},12000);</script>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- APP CHECK: remove this line to disable App Check (also remove init block in firebase-sync.js) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/shared.js?v=2026-11-27.3"></script>
<script src="js/firebase-sync.js?v=2026-11-27.3"></script>
<script src="js/auth.js?v=2026-11-27.3"></script>
<script>
const WorkerApp = { // not "Worker" — that shadows the browser's Web Worker global
  activeCat:  null,
  activeSub:  null,
  orderRef:   genRef(),
  materials:  [],
  _cats:      [],
  _subs:      [],
  _orderNote: '',   // note to the manager, typed on the confirmation screen

  // Stocktake MODE state — the whole page switches between ordering and counting.
  // The flag persists in localStorage so a reload mid-count stays in stocktake mode.
  // Counts are a separate cart (decimals allowed: bar/pipe counted in metres) with a
  // per-item set/add/subtract mode; ticks record single items immediately.
  _stocktakeMode: localStorage.getItem('mo_stocktake_mode') === '1',
  _st:            { _items: {} },   // id -> counted qty (float)
  _stModes:       {},               // id -> 'add' | 'subtract' (absent = 'set')
  _matStock:      [],               // live material_stock records
  _unsubMatStock: null,
  _stBusy:        false,            // bulk-submit in-flight guard
  _stTickBusy:    new Set(),        // per-item tick in-flight guards

  async init() {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    FirebaseConfig.forget();
    const ok = await DB.init(FirebaseConfig.get());
    if (!ok) { this.showSetup("Can't reach the database. Check the Wi-Fi, then tap Reload."); return; }
    // Test mode has its own list, so a waiting order only ever goes to the database it was made for.
    Outbox.start(`mo_outbox${FirebaseConfig.isTestMode() ? '_test' : ''}`, () => this._renderOutbox(), en => this._announceSent(en));
    DB.onDenied = () => Auth.denied();
    Auth.deviceName = DeviceName;
    Auth.start(user => { if (user) Outbox.resume(); });
    this.materials = await Data.load('./materials.csv', list => this._setMaterials(list));
    this._loadKept();
    this.renderApp();
    Boot.ready('page');
    this._renderOutbox();
    this.startConnectionStatus();
    this.startVersionCheck();
    this.startMatStockListening();
    this.startCatalogueWatch();
  },

  // ── KEPT WORK: the order being built, its note, and counts not yet recorded ──
  _keep() {
    if (!this._keptLoaded) return;
    const lines = Kept.lines(Order.items(this.materials));
    const counts = Kept.lines(this.stItems().map(i => ({ ...i, mode: i.stMode })));
    if (!lines.length && !counts.length && !this._orderNote) { Kept.drop('worker'); return; }
    Kept.save('worker', { lines, counts, note: this._orderNote, ref: this.orderRef });
  },
  _loadKept() {
    const v = Kept.load('worker', 12 * 3600000);
    if (v) {
      Kept.fill(v.lines, this.materials, (m, l) => Order.set(m.id, l.qty));
      Kept.fill(v.counts, this.materials, (m, l) => { this._st._items[m.id] = l.qty; if (l.mode && l.mode !== 'set') this._stModes[m.id] = l.mode; });
      this._orderNote = v.note || '';
      if (v.lines && v.lines.length && v.ref) this.orderRef = v.ref;
    }
    this._keptLoaded = true;
  },

  // Firebase itself could not be reached (no network at first load, the SDK
  // blocked): a plain card and a Reload. The config is in the code (shared.js).
  showSetup(err) {
    Boot.gone();
    document.getElementById('root').innerHTML = `
      <div class="setup-screen"><div class="setup-card" style="text-align:center">
        <div class="auth-logo"></div>
        <p style="margin-bottom:16px">${esc(err || 'Could not connect.')}</p>
        <button class="btn btn-primary" style="width:100%" onclick="location.reload()"><i class="ti ti-refresh"></i> Reload</button>
      </div></div>`;
  },

  // ── APP SHELL ──
  renderApp() {
    const device = DeviceName.get();
    document.getElementById('root').innerHTML = `
      <div class="app-root" id="app-root">
        <div class="header">
          <div class="col"><div class="header-inner">
            <span class="header-logo"></span>
            <div class="header-left">
              <div class="header-title">Material Orders</div>
              <div class="header-ref" style="display:flex;gap:6px;align-items:center"><span class="live-dot connecting" id="live-dot"></span><span id="live-label">Connecting…</span><span class="hdr-extra" style="opacity:0.45">·</span><span class="hdr-extra" id="order-ref"></span><span class="hdr-extra" style="opacity:0.45">·</span><span class="hdr-extra" id="app-version" style="font-family:var(--mono)"></span></div>
            </div>
            <div class="header-actions">
              <span class="device-chip" id="device-chip">${esc(device)}</span>
              <button class="stocktake-btn" id="btn-stocktake" aria-label="Stocktake"><i class="ti ti-clipboard-list"></i> <span id="stocktake-btn-label">Stocktake</span></button>
              <span id="outbox-slot"></span><span id="auth-pill"></span>
              <button class="icon-btn" id="btn-settings" aria-label="Settings"><i class="ti ti-settings"></i></button>
            </div>
          </div></div>
        </div>

        <div id="update-banner-wrap"></div>
        ${FirebaseConfig.isTestMode() ? '<div class="test-mode-banner"><i class="ti ti-flask"></i> Test mode — connected to test database</div>' : ''}

        <div class="st-mode-banner" id="st-mode-banner"><i class="ti ti-clipboard-list"></i> <span>Stocktake mode: counting stock, not ordering. Nothing here creates an order.</span><span class="st-progress" id="st-progress"></span></div>

        <div id="tabs-wrap"></div>

        <div class="search-bar">
          <div class="col"><div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="search" placeholder="Search part code or description…" autocomplete="off">
          </div></div>
        </div>

        <div class="app-scroll" id="app-scroll">
          <div class="col">
            <div class="mat-list" id="mat-list"></div>
          </div>
        </div>

        <div class="action-bar" id="order-actionbar"><div class="action-bar-inner split">
          <button class="btn-text" id="btn-clear-main" hidden>Clear order</button>
          <button class="btn btn-primary" id="btn-review">
            <i class="ti ti-clipboard-list"></i>Review order
            <span class="sidebar-count zero" id="order-badge" style="margin-left:4px">0</span>
          </button>
        </div></div>

        <div class="action-bar" id="st-actionbar" style="display:none"><div class="action-bar-inner split">
          <button class="btn-text" id="btn-st-clear" hidden>Clear counts</button>
          <button class="btn btn-primary" id="btn-st-review">
            <i class="ti ti-clipboard-check"></i>Review counts
            <span class="sidebar-count zero" id="st-badge" style="margin-left:4px">0</span>
          </button>
        </div></div>

        <div class="panel" id="review-panel">
          <div class="panel-header">
            <button class="back-btn" id="btn-close-review">
              <i class="ti ti-chevron-left"></i> Back
            </button>
            <div class="panel-title">Review order</div>
            <div class="panel-spacer"></div>
          </div>
          <div class="panel-scroll">
            <div class="panel-col" id="review-contents"></div>
          </div>
          <div class="action-bar"><div class="action-bar-inner">
            <button class="btn btn-primary" id="btn-submit">
              <i class="ti ti-send"></i> Submit order
            </button>
          </div></div>
        </div>

        <div class="panel" id="settings-panel">
          <div class="panel-header">
            <button class="back-btn" id="btn-close-settings"><i class="ti ti-chevron-left"></i>Back</button>
            <div class="panel-title">Settings</div>
            <div class="panel-spacer"></div>
          </div>
          <div class="panel-scroll"><div class="panel-col" style="gap:20px" id="settings-body"></div></div>
        </div>

        <div class="panel" id="success-panel" style="background:var(--surface);z-index:30">
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
              flex:1;padding:40px 24px;text-align:center">
            <div class="success-icon green" style="margin-bottom:20px" id="success-icon">
              <i class="ti ti-circle-check"></i>
            </div>
            <h2 style="font-size:20px;font-weight:600;margin-bottom:10px" id="success-title">Order submitted!</h2>
            <p style="font-size:14px;color:var(--text2);line-height:1.6;max-width:300px;margin-bottom:28px" id="success-text">
              The production manager has been notified and will review your order.
            </p>
            <button class="btn btn-primary" style="max-width:280px;margin-bottom:8px" id="btn-success-retry" data-outbox-retry="" hidden>
              <i class="ti ti-refresh"></i> Retry
            </button>
            <button class="btn btn-primary" style="max-width:280px" id="btn-new-order">
              <i class="ti ti-plus"></i> Start new order
            </button>
          </div>
        </div>
      </div>
      <div id="overlay-wrap"></div>`;

    // ── ALL LISTENERS ATTACHED ONCE ──
    document.getElementById('btn-review')      .addEventListener('click', () => this.openReview());
    document.getElementById('btn-clear-main')  .addEventListener('click', () => this.clearOrder());
    document.getElementById('btn-close-review').addEventListener('click', () => this.closePanel('review-panel'));
    document.getElementById('btn-submit')      .addEventListener('click', () => this.confirmSubmit());
    document.getElementById('btn-settings')      .addEventListener('click', () => { this._populateSettings(); this.openPanel('settings-panel'); });
    document.getElementById('btn-close-settings').addEventListener('click', () => { this.closePanel('settings-panel'); Auth.lockAdmin(); });
    document.getElementById('btn-new-order')   .addEventListener('click', () => this.newOrder());
    document.getElementById('search')          .addEventListener('input', e => {
      if (searchScope(this, e.target.value.trim(), 'activeCat', 'activeSub')) this.renderTabs();
      this.renderList();
    });

    document.getElementById('mat-list').addEventListener('click', e => {
      // Order-mode controls
      const dec = e.target.closest('[data-dec]');
      const inc = e.target.closest('[data-inc]');
      const add = e.target.closest('[data-add]');
      const bin = e.target.closest('[data-bin]');
      if (dec) { e.stopPropagation(); this.adj(+dec.dataset.dec, -1); }
      if (inc) { e.stopPropagation(); this.adj(+inc.dataset.inc,  1); }
      if (add) { e.stopPropagation(); this.quickAdd(+add.dataset.add); }
      if (bin) { e.stopPropagation(); this.zeroItem(+bin.dataset.bin); }
      // Stocktake-mode controls (only present on stocktake cards)
      const sdec = e.target.closest('[data-st-dec]');
      const sinc = e.target.closest('[data-st-inc]');
      const seg  = e.target.closest('[data-st-modeopt]');
      const tick = e.target.closest('[data-st-tick]');
      if (sdec) { e.stopPropagation(); this.stAdj(+sdec.dataset.stDec, -1); }
      if (sinc) { e.stopPropagation(); this.stAdj(+sinc.dataset.stInc,  1); }
      if (seg)  { e.stopPropagation(); this.stSetMode(+seg.dataset.stModeopt, seg.dataset.mode); }
      if (tick) { e.stopPropagation(); this.stTickItem(+tick.dataset.stTick); }
    });
    document.getElementById('mat-list').addEventListener('input', e => {
      const sinp = e.target.closest('[data-st-qid]');
      if (sinp) this.stType(sinp);
    });
    // Typed order quantities (QtyField): the list takes 0 as "not on the order"; the
    // review has its own Remove.
    const itemOf = id => this.materials.find(m => m.id == id);
    QtyField.attach(document.getElementById('mat-list'), '[data-qid]', {
      zero: true,
      item: el => itemOf(el.dataset.qid),
      get:  el => Order.get(+el.dataset.qid),
      set:  (el, qty) => Order.set(+el.dataset.qid, qty),
      live: el => { this._cardState(el); this.updateBadge(); },
    });
    QtyField.attach(document.getElementById('review-contents'), '[data-rqid]', {
      item: el => itemOf(el.dataset.rqid),
      get:  el => Order.get(+el.dataset.rqid),
      set:  (el, qty) => Order.set(+el.dataset.rqid, qty),
      live: el => this._reviewState(el),
    });

    document.getElementById('review-contents').addEventListener('click', e => {
      const dec = e.target.closest('[data-rdec]');
      const inc = e.target.closest('[data-rinc]');
      const rem = e.target.closest('[data-rrem]');
      if (dec) this.revAdj(+dec.dataset.rdec, -1);
      if (inc) this.revAdj(+inc.dataset.rinc,  1);
      if (rem) this.removeItem(+rem.dataset.rrem);
    });
    // The review re-renders on every qty change, so the note is kept in state.
    document.getElementById('review-contents').addEventListener('input', e => {
      if (e.target.id === 'order-note') { this._orderNote = e.target.value; this._keep(); }
    });

    document.getElementById('tabs-wrap').addEventListener('click', e => {
      const catBtn = e.target.closest('[data-cat-idx]');
      const subBtn = e.target.closest('[data-sub-idx]');
      if (catBtn) { const i=+catBtn.dataset.catIdx; this.setCat(i===-2?this.RECENT:i===-1?null:this._cats[i]); }
      else if (subBtn) { const i=+subBtn.dataset.subIdx; this.setSub(i===-1?null:this._subs[i]); }
    });

    // ── Stocktake mode (per-row controls handled in the mat-list listener above) ──
    document.getElementById('btn-stocktake').addEventListener('click', () => this.toggleStocktakeMode());
    document.getElementById('btn-st-review').addEventListener('click', () => this.stOpenReview());
    document.getElementById('btn-st-clear').addEventListener('click', async () => {
      if (!await Ask.confirm({ title: 'Clear every count entered here?', body: 'Counts already recorded stay recorded.', yes: 'Clear counts', no: 'Keep counts', danger: true })) return;
      this._st._items = {}; this._stModes = {};
      this._updateStBadge(); this.renderList();
    });

    const _v=document.getElementById('app-version'); if(_v) _v.textContent=verLabel(APP_VERSION);
    const _r=document.getElementById('order-ref'); if(_r) _r.textContent=this.orderRef;
    this.applyStocktakeModeUI();   // restore stocktake mode if it was left on
    this.renderTabs();
    this.renderList();
    this.updateBadge();
    this._updateStBadge();
  },

  // ── LIVE STATUS DOT (3-state: Live / Update Available / Offline) ──
  // Single source of truth so the dot and the update banner never disagree.
  // connected starts null (= not yet known) — the submit guard must only block on an
  // explicit false, or submitting right after page load gets wrongly refused.
  _connState: { connected: null, latestVersion: null },

  _renderLiveStatus() { Live.render(this._connState); },

  _renderOutbox() {
    const el = document.getElementById('outbox-slot');
    if (el) el.innerHTML = Outbox.pillHtml();
    if (document.getElementById('success-panel')?.classList.contains('open')) this._renderSuccess();
  },

  startConnectionStatus() {
    DB.listenConnectionStatus(connected => {
      this._connState.connected = connected;
      this._renderLiveStatus();
      this._renderOutbox();
    });
  },

  // See firebase-sync.js announceVersionIfNewer for the rollback caveat —
  // if you ever revert to an older build, manually edit meta/version's
  // "latest" field down in the Firebase console.
  startVersionCheck() {
    DB.announceVersionIfNewer(APP_VERSION, isVersionNewer);
    DB.listenAppVersion(latest => {
      this._connState.latestVersion = latest;
      this._renderLiveStatus();
      AutoUpdate.notifyVersion(latest);
    });
    // Idle auto-reload for the home-screen iPads — never while an order or a stocktake
    // count is in progress. Orders waiting to send are kept on the device and don't hold it up.
    AutoUpdate.start({
      onDiscover: v => { this._connState.latestVersion = v; this._renderLiveStatus(); },
      isBusy:     () => !Order.isEmpty() || this.stCount() > 0,
    });
  },

  renderTabs() {
    const wrap = document.getElementById('tabs-wrap');
    if (!wrap) return;
    const recent = !this._stocktakeMode && this._recentItems().length > 0;
    if (!recent && this.activeCat === this.RECENT) this.activeCat = null;
    this._cats = Data.categoriesBySize(this.materials);
    this._subs = this.activeCat && this.activeCat !== this.RECENT ? Data.subcategories(this.materials, this.activeCat) : [];
    Strip.draw(wrap, { cats: this._cats, cat: this.activeCat, subs: this._subs, sub: this.activeSub,
      lead: recent ? { label: 'Recent', on: this.activeCat === this.RECENT } : null });
  },

  // ── RECENT: what this device orders, most often first ──
  RECENT: '__recent',
  _recentKey() { return `mo_recent${FirebaseConfig.isTestMode() ? '_test' : ''}`; },
  _recentLog() {
    try { const v = JSON.parse(localStorage.getItem(this._recentKey()) || '{}'); return v && typeof v === 'object' ? v : {}; } catch { return {}; }
  },
  _noteRecent(items) {
    const log = this._recentLog(), now = Date.now();
    for (const i of items) { const k = stockId(i), was = log[k] || { n: 0 }; log[k] = { n: was.n + 1, at: now }; }
    const keep = Object.entries(log).sort((a, b) => b[1].at - a[1].at).slice(0, 80);   // the oldest drop off
    try { localStorage.setItem(this._recentKey(), JSON.stringify(Object.fromEntries(keep))); } catch {}
  },
  _recentItems() {
    const log = this._recentLog(), at = m => log[stockId(m)];
    return this.materials.filter(at).sort((a, b) => (at(b).n - at(a).n) || (at(b).at - at(a).at)).slice(0, 24);
  },

  setCat(cat) { this.activeCat=cat; this.activeSub=null; this.renderTabs(); this.renderList(); const s=document.getElementById('app-scroll'); if(s)s.scrollTop=0; },
  setSub(sub) { this.activeSub=sub; this.renderTabs(); this.renderList(); const s=document.getElementById('app-scroll'); if(s)s.scrollTop=0; },

  renderList() {
    const q=document.getElementById('search')?.value||'';
    const recent = this.activeCat === this.RECENT && !this._stocktakeMode;
    const filtered = recent && !q.trim() ? this._recentItems() : Data.filter(this.materials, recent ? null : this.activeCat, this.activeSub, q);
    const list=document.getElementById('mat-list'); if(!list) return;
    if (!this.materials.length && Data.failed) {
      list.innerHTML = `<div class="empty-state"><i class="ti ti-wifi-off"></i><p>Can't load the materials list. Check the Wi-Fi, then tap Reload.</p><button class="btn btn-primary" style="width:auto;margin-top:14px" onclick="Live.reload(this)">Reload</button></div>`;
      return;
    }
    const note=searchNote(filtered,q);
    const stockMap = this._stocktakeMode ? new Map(this._matStock.map(r => [r._id, r])) : null;
    if (this._stocktakeMode) {
      const p = document.getElementById('st-progress');
      if (p) p.textContent = this._matStockReady && filtered.length ? `${filtered.filter(m => isToday((stockMap.get(stockId(m)) || {}).updatedAt)).length} of ${filtered.length} counted today` : '';
    }
    if(!filtered.length){list.innerHTML=note||`<div class="empty-state"><i class="ti ti-package-off"></i><p>No materials in this category.</p></div>`;return;}
    const restoreFocus = captureInputFocus(); // live data re-renders mid-typing
    if (this._stocktakeMode) {
      list.innerHTML = note + filtered.map(m => this._stCard(m, stockMap)).join('');
    } else {
      list.innerHTML=note+filtered.map(m=>this._matCard(m)).join('');
    }
    restoreFocus();
  },

  // A quantity typed on a card: mark the card in place. No redraw, so the field keeps
  // its caret and the next tap lands where it was aimed.
  _cardState(el) {
    const on = Order.get(+el.dataset.qid) > 0, card = el.closest('.mat-card'); if (!card) return;
    card.classList.toggle('in-order', on);
    const add = card.querySelector('.add-btn');
    if (add) { add.classList.toggle('in-order', on); add.innerHTML = `<i class="ti ${on ? 'ti-check' : 'ti-plus'}"></i>`; }
  },
  _reviewState(el) {
    const id = +el.dataset.rqid, q = el.closest('.order-item')?.querySelector('.order-item-qty');
    if (q) q.textContent = `× ${Order.get(id)}`;
    const t = document.querySelector('#review-contents .order-summary-row.total span:last-child');
    if (t) t.textContent = this._total();
    this.updateBadge(); this.renderList();
  },
  _total() {
    const items = Order.items(this.materials);
    return `${round2(items.reduce((s,i)=>s+i.qty,0))} across ${items.length} line${items.length!==1?'s':''}`;
  },

  _matCard(m) {
    const qty=Order.get(m.id),inOrder=qty>0;
    const ci=CAT_ICONS[m.category]||CAT_ICONS.default;
    return `<div class="mat-card ${inOrder?'in-order':''}">
      <button class="mat-bin" data-bin="${m.id}" aria-label="Remove"><i class="ti ti-trash"></i></button>
      ${catTile(m.category)}
      <div class="mat-info">
        <div class="mat-name">${descHtml(m.description)}</div>
        <div class="mat-partcode">${esc(m.partCode)}</div>
        <div class="mat-unit">${esc(m.qtyType||'')}</div>
      </div>
      <div class="mat-controls">
        <button class="qty-btn" data-dec="${m.id}">−</button>
        <input class="qty-input" ${QtyField.attrs(m)} value="${qty || ''}" data-qid="${m.id}">
        <button class="qty-btn" data-inc="${m.id}">+</button>
        <button class="add-btn ${inOrder?'in-order':''}" data-add="${m.id}">
          <i class="ti ${inOrder?'ti-check':'ti-plus'}"></i>
        </button>
      </div>
    </div>`;
  },

  // Stocktake card — same frame as an order card, but the controls submit counts (Count in
  // shared.js). The tick records that one item immediately (progressive counting).
  _stCard(m, stockMap) {
    const qty  = this.stGet(m.id), mode = this.stModeOf(m.id);
    const unit = stocktakeUnit(m);
    const rec  = stockMap.get(stockId(m));
    const ci   = CAT_ICONS[m.category] || CAT_ICONS.default;
    const showCode = m.partCode && !Data.isDummyCode(m.partCode);
    const today = !!rec && isToday(rec.updatedAt);
    return `<div class="mat-card st-card ${Count.ready(qty, mode)?'in-order':''}">
      ${catTile(m.category)}
      <div class="mat-info">
        <div class="mat-name">${descHtml(m.description)}</div>
        ${showCode ? `<div class="mat-partcode">${esc(m.partCode)}</div>` : '<div class="mat-partcode"></div>'}
        <div class="mat-unit">${today ? '<span class="st-today"><i class="ti ti-circle-check"></i> Counted today</span> · ' : ''}${esc(unit)} · <span class="st-recorded">${Count.line(rec, unit, qty, mode, this._matStockReady)}</span></div>
      </div>
      ${Count.controls('st', m.id, qty, mode)}
    </div>`;
  },

  adj(id,d)     { Order.adjust(id,d);           this._changed(); },
  quickAdd(id)  { if(!Order.get(id)) Order.set(id,1); this._changed(); },
  zeroItem(id)  { Order.remove(id); this._changed(); },
  // In the review "−" stops at 1: taking a line off is what Remove is for.
  revAdj(id,d)  { if (d < 0 && Order.get(id) <= 1) return; Order.adjust(id,d); this.updateBadge(); this._syncReview(); },
  removeItem(id){ Order.remove(id);              this.updateBadge(); this._syncReview(); },
  async clearOrder() {
    const n = Order.count();
    if (!await Ask.confirm({ title: 'Clear this order?', body: `${n} line${n !== 1 ? 's' : ''} will be taken off.`, yes: 'Clear order', no: 'Keep order', danger: true })) return;
    Order.clear(); this._orderNote=''; this.updateBadge(); this._syncReview(); this.closePanel('review-panel');
  },

  _changed()    { this.updateBadge(); this.renderList(); if(document.getElementById('review-panel')?.classList.contains('open')) this._renderReviewContents(); },
  _syncReview() { this._renderReviewContents(); this.renderList(); },

  updateBadge() {
    const b=document.getElementById('order-badge'); if(!b) return;
    const n=Order.count(); setCount(b, n);
    document.getElementById('btn-review')?.classList.toggle('is-idle', n === 0);
    const c=document.getElementById('btn-clear-main'); if(c) c.hidden = n===0;
    this._keep();
  },
  openPanel(id)  { document.getElementById(id)?.classList.add('open'); },
  closePanel(id) { document.getElementById(id)?.classList.remove('open'); },

  openReview()   { if (Order.isEmpty()) { toast('No items on this order yet', true); return; } this._renderReviewContents(); this.openPanel('review-panel'); },

  _renderReviewContents() {
    const wrap=document.getElementById('review-contents'); if(!wrap) return;
    const items=Order.items(this.materials);
    if(!items.length){ wrap.innerHTML=`<div class="empty-state"><i class="ti ti-clipboard"></i><p>No items on this order yet.</p></div>`; return; }
    wrap.innerHTML=items.map(i=>`
      <div class="order-item">
        <div class="order-item-row">
          <div>
            <div class="order-item-name">${descHtml(i.description)}</div>
            <div class="order-item-code">${esc(i.partCode)}</div>
            <div class="order-item-unit">${esc(i.qtyType||'')}</div>
          </div>
          <div class="order-item-qty">× ${i.qty}</div>
        </div>
        <div class="order-item-foot">
          <button class="qty-btn" data-rdec="${i.id}">−</button>
          <input class="qty-input" ${QtyField.attrs(i)} value="${i.qty}" data-rqid="${i.id}">
          <button class="qty-btn" data-rinc="${i.id}">+</button>

        </div>
      </div>`).join('')+`

          <span>Total items</span>

        <textarea class="order-note-input" id="order-note" rows="3" data-kept>${esc(this._orderNote)}</textarea>
      </div>`;
  },

  confirmSubmit() {
    if(Order.isEmpty()){ toast('No items on this order yet', true); return; }
    const items=Order.items(this.materials);
    // The full read-back is on purpose: a fresh look at every line before it goes.
    // Only the list scrolls; the question and the buttons stay where they are.
    const lines=items.map(i=>`<div class="confirm-line">
        <span class="confirm-qty">× ${esc(orderQtyDisplay(i, i.qty))}</span>
        <span class="confirm-desc">${descHtml(i.description)}${i.partCode && !Data.isDummyCode(i.partCode) ? `<span class="confirm-code">${esc(i.partCode)}</span>` : ''}</span>
      </div>`).join('');
    const ow=document.getElementById('overlay-wrap');
    ow.innerHTML=`
      <div class="overlay" id="submit-confirm">
        <div class="sheet sheet-pinned">
          <h3>Submit order?</h3>
          <div class="confirm-lines">${lines}</div>
          ${this._orderNote.trim() ? `<div class="order-note-preview"><i class="ti ti-message-2"></i> ${esc(this._orderNote.trim())}</div>` : ''}
          <p>The production manager will review and forward to purchasing.</p>
          <div class="inline-error" id="submit-error" role="alert" hidden style="margin-bottom:10px"></div>
          <div class="sheet-btns">
            <button class="btn btn-primary" id="btn-confirm-yes"><i class="ti ti-send"></i> Confirm and submit</button>
            <button class="btn btn-outline" id="btn-confirm-no" data-esc>Keep editing</button>
          </div>
        </div>
      </div>`;
    document.getElementById('btn-confirm-yes').addEventListener('click', ()=>this.doSubmit());
    document.getElementById('btn-confirm-no') .addEventListener('click', ()=>this.closeOverlay());
    requestAnimationFrame(()=>document.getElementById('submit-confirm')?.classList.add('show'));
  },

  closeOverlay() {
    const el=document.getElementById('submit-confirm'); if(!el) return;
    el.classList.remove('show');
    setTimeout(()=>{ document.getElementById('overlay-wrap').innerHTML=''; },260);
  },

  async doSubmit() {
    const items=Order.items(this.materials).map(i=>({
      id:i.id,partCode:i.partCode,description:i.description,
      category:i.category,subcategory:i.subcategory,qtyType:i.qtyType||'',qty:i.qty,
    }));
    // The order is written under an id made here and the sheet closes at
    // once: "submitted" if the server confirms within a few seconds, else
    // "queued" — the write waits on this device and goes when the connection
    // returns (Outbox keeps a copy and re-sends if that queue is ever lost).
    // Disabling the button blocks a double-tap from placing it twice.
    const yesBtn = document.getElementById('btn-confirm-yes');
    if (yesBtn && yesBtn.disabled) return;
    const noBtn = document.getElementById('btn-confirm-no');
    if (yesBtn) { yesBtn.disabled = true; yesBtn.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Submitting…'; }
    if (noBtn)  noBtn.disabled = true;   // it is on its way: there is nothing left to cancel
    const order = { ref:this.orderRef, deviceName:DeviceName.get(), items, note:this._orderNote.trim(), placedAt: Date.now() };
    let queued;
    try { queued = DB.queueOrder(order); }
    catch(e) {
      console.error('Order not placed:', e);
      if (yesBtn) { yesBtn.disabled = false; yesBtn.innerHTML = '<i class="ti ti-send"></i> Confirm and submit'; }
      if (noBtn)  noBtn.disabled = false;
      inlineError('submit-error', `Not submitted: ${whyFailed(e)}. Your order is still here. Tap Confirm and submit to try again.`);
      return;
    }
    Outbox.add({ id: queued.id, ref: this.orderRef, payload: order, done: queued.done });
    this._noteRecent(items);
    this._lastOrder = { ref: this.orderRef, n: items.length };
    await Promise.race([queued.done.catch(() => {}), new Promise(r => setTimeout(r, 3000))]);
    Order.clear(); this._orderNote = '';
    this.updateBadge(); this.renderList();
    this.closeOverlay();
    this.closePanel('review-panel');
    this._lastOrderId = queued.id;
    this._renderSuccess();
    this.openPanel('success-panel');
  },
  // What became of the order just placed. Three different outcomes, and it follows the
  // order while it is on screen: a queued one that goes through turns to submitted, one
  // the server refuses says so.
  _renderSuccess() {
    if (!this._lastOrderId) return;
    const st = Outbox.state(this._lastOrderId);
    const offline = this._connState.connected === false || navigator.onLine === false;
    const o = this._lastOrder || {}, what = `${o.ref || ''} · ${o.n} line${o.n !== 1 ? 's' : ''}`;
    const [cls, icon, title, text] =
      st === 'sent'   ? ['green', 'ti-circle-check', 'Order submitted', 'The production manager will review it.'] :
      st === 'failed' ? ['red', 'ti-alert-triangle', 'Order not submitted', 'The server refused it. It is saved on this device. Tap Retry.'] :
                        ['amber', 'ti-cloud-upload', 'Order queued', offline ? 'It will submit itself when this device is back online.' : 'The connection is slow. It will submit itself.'];
    // A sent order needs nothing more: the screen goes back to ordering by itself.
    clearTimeout(this._successTimer);
    if (st === 'sent') this._successTimer = setTimeout(() => {
      if (document.getElementById('success-panel')?.classList.contains('open')) this.newOrder();
    }, 10000);
    const set = (id, fn) => { const el = document.getElementById(id); if (el) fn(el); };
    set('success-title', el => { el.textContent = title; });
    set('success-text',  el => { el.innerHTML = `<span class="success-ref">${esc(what)}</span>${esc(text)}`; });
    set('success-icon',  el => { el.className = `success-icon ${cls}`; el.innerHTML = `<i class="ti ${icon}"></i>`; });
    set('btn-success-retry', el => { el.hidden = st !== 'failed'; el.dataset.outboxRetry = this._lastOrderId; });
    set('btn-new-order', el => { el.classList.toggle('btn-primary', st !== 'failed'); el.classList.toggle('btn-outline', st === 'failed'); });
  },

  // An order that waited on this device and has now reached the manager.
  _announceSent(en) {
    if (Date.now() - (en.placedAt || 0) < 15000) return;   // the success screen is saying so
    if (this._lastOrderId === en.id && document.getElementById('success-panel')?.classList.contains('open')) return;
    toast(`Order ${en.ref || ''} has reached the production manager.`);
  },

  // ══════════════════════════════════════════
  // STOCKTAKE MODE — the whole materials page switches into counting. Writes to
  // material_stock + a per-device-per-day material_stocktakes session, never to
  // orders. Bar/pipe (Length/Metre) counted in metres, sheets/plates per each.
  // ══════════════════════════════════════════
  startMatStockListening() {
    if (this._unsubMatStock) this._unsubMatStock();
    this._unsubMatStock = DB.listenMaterialStock((recs, fromCache) => {
      this._matStock = recs;
      if (!fromCache || recs.length) this._matStockReady = true;
      if (this._stocktakeMode) this.renderList();  // refresh "recorded" figures live
    });
  },

  // Live materials list (Data.watch): when the manager changes the catalogue
  // the tabs and list follow. A category tab that no longer exists falls back to All.
  startCatalogueWatch() {
    if (this._unsubCatalogue) this._unsubCatalogue();
    this._unsubCatalogue = Data.watch(list => this._setMaterials(list));
  },
  // A changed list: the order and the counts move over by what each line is.
  _setMaterials(list) {
    Order.replace(Kept.move(Order.all(), this.materials, list));
    this._st._items = Kept.move(this._st._items, this.materials, list);
    this._stModes   = Kept.move(this._stModes,   this.materials, list);
    this.materials = list;
    if (!document.getElementById('app-root')) return;   // not drawn yet
    if (this.activeCat && !Data.categories(list).includes(this.activeCat)) { this.activeCat = null; this.activeSub = null; }
    else if (this.activeSub && !Data.subcategories(list, this.activeCat).includes(this.activeSub)) this.activeSub = null;
    const restoreFocus = captureInputFocus();
    this.renderTabs(); this.renderList();
    restoreFocus();
    this.updateBadge(); this._updateStBadge();
    if (document.getElementById('review-panel')?.classList.contains('open')) this._renderReviewContents();
  },

  toggleStocktakeMode() {
    // Counts not recorded yet are kept, and are there again next time.
    this._stocktakeMode = !this._stocktakeMode;
    localStorage.setItem('mo_stocktake_mode', this._stocktakeMode ? '1' : '0');
    this.applyStocktakeModeUI();
    this.renderTabs(); this.renderList(); this._updateStBadge();
    const s = document.getElementById('app-scroll'); if (s) s.scrollTop = 0;
  },

  // Flips the shell chrome (header colour, banner, action bar, button label) to
  // match the current mode. Called on load too, so a persisted mode restores fully.
  applyStocktakeModeUI() {
    const on = this._stocktakeMode;
    document.getElementById('app-root')?.classList.toggle('stocktake-mode', on);
    const banner = document.getElementById('st-mode-banner'); if (banner) banner.style.display = on ? 'flex' : 'none';
    const oab = document.getElementById('order-actionbar'); if (oab) oab.style.display = on ? 'none' : '';
    const sab = document.getElementById('st-actionbar');    if (sab) sab.style.display = on ? '' : 'none';
    const btn = document.getElementById('btn-stocktake'); if (btn) btn.setAttribute('aria-label', on ? 'Exit stocktake' : 'Stocktake');
    const search = document.getElementById('search'); if (search) search.placeholder = on ? 'Search materials to count…' : 'Search part code or description…';
  },

  stGet(id)      { return this._st._items[id]; },        // undefined: nothing entered. 0 is a count.
  stModeOf(id)   { return this._stModes[id] || 'set'; },
  stSet(id, qty) {
    if (qty === undefined) { delete this._st._items[id]; return; }
    this._st._items[id] = Math.max(0, round2(qty));   // decimals allowed (metre counts like 2.4)
  },
  stAdj(id, d)   { const q = this.stGet(id); if (q === undefined && d < 0) return; this.stSet(id, (q || 0) + d); this._stChanged(); },
  stType(el) {
    const id = +el.dataset.stQid, m = this.materials.find(x => x.id == id); if (!m) return;
    this.stSet(id, Count.read(el));
    Count.typed(el, this._matStock.find(r => r._id === stockId(m)), stocktakeUnit(m), this.stGet(id), this.stModeOf(id), this._matStockReady);
    this._updateStBadge();
  },
  stSetMode(id, mode) {
    if (mode === 'set') delete this._stModes[id]; else this._stModes[id] = mode;
    this.renderList();
  },
  stCount()       { return this.stItems().length; },
  _stPayload(m) {
    return {
      sid: stockId(m), partCode: m.partCode || '', description: m.description,
      category: m.category, subcategory: m.subcategory,
      unit: stocktakeUnit(m), qty: this.stGet(m.id), mode: this.stModeOf(m.id),
    };
  },
  stItems() {
    return Object.keys(this._st._items).map(id => {
      const m = this.materials.find(x => x.id == id);
      return m && Count.ready(this.stGet(id), this.stModeOf(id)) ? { ...m, qty: this._st._items[id], stMode: this.stModeOf(id) } : null;
    }).filter(Boolean);
  },
  _stChanged() { this._updateStBadge(); this.renderList(); },
  _updateStBadge() {
    const b = document.getElementById('st-badge'); if (!b) return;
    const n = this.stCount(); setCount(b, n);
    document.getElementById('btn-st-review')?.classList.toggle('is-idle', n === 0);
    const c = document.getElementById('btn-st-clear'); if (c) c.hidden = n === 0;
    const l = document.getElementById('stocktake-btn-label'); if (l) l.textContent = this._stocktakeMode ? 'Exit stocktake' : n ? `Stocktake (${n})` : 'Stocktake';
    this._keep();
  },

  // Progressive tick — records ONE item immediately, then clears it from the cart.
  // The material_stock listener refreshes its "recorded" figure a moment later.
  async stTickItem(id) {
    if (this._stTickBusy.has(id)) return;
    if (!Count.ready(this.stGet(id), this.stModeOf(id))) return;
    if (this._connState.connected === false || navigator.onLine === false) {
      Ask.tell('Count not recorded', 'Offline. Connect, then tap the tick again.'); return;
    }
    const m = this.materials.find(x => x.id == id); if (!m) return;
    this._stTickBusy.add(id);
    const tick = document.querySelector(`[data-st-tick="${id}"]`);
    if (tick) { tick.disabled = true; tick.classList.add('busy'); tick.setAttribute('aria-label', 'Recording'); tick.innerHTML = '<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i>'; }
    try {
      const payload = [this._stPayload(m)];
      await DB.recordStocktake(payload, DeviceName.get(), OpId.for(`tick:${id}`, payload));
      OpId.done(`tick:${id}`);
      delete this._st._items[id]; delete this._stModes[id];
      this._updateStBadge(); this.renderList();
    } catch(e) {
      console.error('Count not recorded:', e);
      const why = whyFailed(e);
      this._stTickBusy.delete(id); this.renderList();
      Ask.tell('Count not recorded', `${why[0].toUpperCase()}${why.slice(1)}. Tap the tick to try again.`);
    } finally { this._stTickBusy.delete(id); }
  },

  stOpenReview() {
    if (this.stCount() === 0) { toast('No counts entered yet', true); return; }
    const items = this.stItems();
    const lines = items.map(i => {
      return `<div class="signout-item-row">
        <div class="signout-item-info">
          <div class="signout-item-name">${descHtml(i.description)}</div>
          <div class="signout-item-unit"><span style="color:${Count.colour(i.stMode)};font-weight:600">${esc(Count.words(i.stMode, i.qty, stocktakeUnit(i)))}</span></div>
        </div>
      </div>`;
    }).join('');
    const ow = document.getElementById('overlay-wrap');
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card signout-card">
          <div class="success-icon blue"><i class="ti ti-clipboard-check"></i></div>
          <h3>Submit stocktake</h3>
          <p style="margin-bottom:8px">${items.length} item${items.length!==1?'s':''} · recorded as <strong>${esc(DeviceName.get())}</strong></p>
          <div class="signout-item-list">${lines}</div>
          <div class="inline-error" id="st-error" role="alert" hidden style="margin-top:10px"></div>
          <button class="btn btn-primary" id="btn-st-confirm" style="width:100%;margin-top:12px"><i class="ti ti-check"></i> Confirm stocktake</button>
          <button class="btn btn-outline" id="btn-st-cancel" data-esc style="width:100%;margin-top:8px">Keep counting</button>
        </div>
      </div>`;
    document.getElementById('btn-st-confirm').addEventListener('click', () => this._doStSubmit());
    document.getElementById('btn-st-cancel').addEventListener('click', () => { ow.innerHTML=''; });
  },

  async _doStSubmit() {
    if (this._stBusy) return; // double-tap guard
    const items = this.stItems();
    if (!items.length) { document.getElementById('overlay-wrap').innerHTML=''; return; }
    if (this._connState.connected === false || navigator.onLine === false) {
      inlineError('st-error', 'Offline. Connect, then tap Confirm stocktake.'); return;
    }
    this._stBusy = true;
    inlineError('st-error', '');
    const btn = document.getElementById('btn-st-confirm'), cancel = document.getElementById('btn-st-cancel');
    if (cancel) cancel.disabled = true;
    if (btn) { btn.disabled = true; btn.innerHTML = `<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Saving ${items.length} count${items.length!==1?'s':''}…`; }
    try {
      const payload = items.map(m => this._stPayload(m));
      await DB.recordStocktake(payload, DeviceName.get(), OpId.for('stocktake', payload));
      OpId.done('stocktake');
      this._st._items = {}; this._stModes = {};
      this._updateStBadge(); this.renderList();
      doneMessage(document.getElementById('overlay-wrap'), { title: 'Counts recorded', text: `${items.length} item${items.length!==1?'s':''} recorded as ${DeviceName.get()}.` });
    } catch(e) {
      console.error('Stocktake not saved:', e);
      if (cancel) cancel.disabled = false;
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Confirm stocktake'; }
      inlineError('st-error', `Not saved: ${whyFailed(e)}.${nothingDone(e, 'Nothing was recorded.')} Tap Confirm stocktake to try again.`);
    } finally { this._stBusy = false; }
  },

  newOrder() {
    clearTimeout(this._successTimer);
    Order.clear(); this._orderNote=''; this._lastOrderId=null; this.orderRef=genRef(); this.activeCat=null; this.activeSub=null; this._wasactiveCat=null;
    this.closePanel('success-panel'); this.updateBadge();
    const ref=document.getElementById('order-ref'); if(ref) ref.textContent=this.orderRef;
    const srch=document.getElementById('search');   if(srch) srch.value='';
    this.renderTabs(); this.renderList();
  },
};

document.addEventListener('DOMContentLoaded', ()=>WorkerApp.init());
</script>
</body>
