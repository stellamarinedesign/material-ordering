<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#282827">
  <script>/* Theme bootstrap — runs before first paint so a themed device never flashes the default look. Choice is per device; see Theme in js/shared.js */try{var t=localStorage.getItem("mo_theme");if(t&&t!=="stella")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Material Orders — Manager</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="fonts/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css?v=2026-11-27.7">
  <link rel="stylesheet" href="css/themes.css?v=2026-11-27.7">
</head>
<body>
<!-- Start-up cover: painted before any script; see Boot in js/shared.js -->
<div id="boot">
  <div class="header manager-hdr"><div class="col"><div class="header-inner">
    <span class="header-logo"></span>
    <div class="header-left"><div class="header-title">Material Orders — Manager</div><div class="header-ref"><span class="live-dot connecting"></span>Connecting…</div></div>
  </div></div></div>
  <div class="boot-tabs"></div>
  <div class="col boot-rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="boot-late"><p>Can't reach the app. Check the Wi-Fi, then tap Reload.</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div>
</div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(b)b.classList.add('late');},12000);</script>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- APP CHECK: remove this line to disable App Check (also remove init block in firebase-sync.js) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="js/shared.js?v=2026-11-27.7"></script>
<script src="js/firebase-sync.js?v=2026-11-27.7"></script>
<script src="js/auth.js?v=2026-11-27.7"></script>
<script src="js/intake.js?v=2026-11-27.7"></script>
<script src="js/catalogue.js?v=2026-11-27.7"></script>
<script src="js/accounts.js?v=2026-11-27.7"></script>
<!-- Vendored xlsx-js-style (SheetJS fork with cell styling) — stocktake Excel exports -->
<script src="js/xlsx-style.min.js"></script>
<!-- Vendored ExcelJS — used only for the consumables export, which embeds drawn
     barcode images (xlsx-js-style can't embed images) -->
<script src="js/exceljs.min.js"></script>
<script>
// This PC's label — the "Manager name" in Settings — asked for at sign-in like
// the iPads' device names, and shown in the header pill.
const ManagerDeviceName = {
  get()  { return (Settings.get().managerName || '').trim(); },
  save(v) { Settings.save({ managerName: String(v || '').trim() }); const el = document.getElementById('role-pill'); if (el) el.textContent = this.get() || 'Manager'; },
};

const Manager = {
  orders:            [],
  activeView:        'pending',
  unsubscribe:       null,
  _openCards:        new Set(),
  _openCombinedCats: new Set(),
  _queueSortMode:    localStorage.getItem('mo_queue_sort') || 'delivery',
  _seenOrderIds:     null,   // null = not yet seeded; Set once first listener fires
  _myOrderIds:       new Set(),
  _newOrderCount:    0,
  // Lines left out of the next email: "category|partCode|orderId", and part codes shown
  // as one merged row: "category|partCode" (how they are shown; the quantity is always
  // added up from the live lines). Neither touches the database; both are kept on this
  // PC until the category is emailed (_keepStaged).
  _combExcluded: new Set(),
  _combMerged:   new Set(),

  mainTab:   'queue',
  materials:    [],
  consumables:  [],
  activeCat: null,
  activeSub: null,
  orderRef:  '',
  _cats:     [],
  _subs:     [],
  _no:       { _items: {} },  // materials cart (New Order tab)
  // The email on screen and what it covers. There is only ever one, and closing the panel
  // drops it — see _openEmail. Once it is opened in Outlook it becomes _emailOpen, which
  // waits (on this PC, through a reload) for "Email sent" or "Not sent": only the first
  // marks anything.
  _emailDraft: null,
  _emailOpen:  null,
  _cartWaiting: { no: [], co: [], receive: [] },   // kept cart lines whose item isn't in the list (yet)
  _receiveRef: '',                    // Receive Stock's reference, kept with its lines
  _cartSent: { no: [], co: [] },      // categories already emailed from a cart that still has lines
  _noNote:    '',           // note to self/other managers, typed on the New Order confirmation
  _noteEditing: new Set(),  // queue cards with the note editor open

  // Consumables Order panel state (launched from Stock tab)
  _co:              { _items: {} },
  _coActiveCat:     null,
  _coActiveSub:     null,
  _coCats:          [],
  _coSubs:          [],
  _coOrderRef:  null,   // one reference for everything emailed from the same cart

  // Intake tab state
  _intakeFilter:      { materials: 'outstanding', consumables: 'outstanding' },
  _intakeOpenOrders:  new Set(),
  // groupKey -> { "orderId::itemId": {status, qtyReceived, notes} } — staged intake
  // edits not yet saved to Firestore, kept on this PC (Intake.keepDrafts).
  _intakeDrafts:      new Map(),
  // Edit mode (combine/cancel deliveries) — manager.html only.
  _editMode:          { materials: false, consumables: false },
  _editSelected:      { materials: new Set(), consumables: new Set() },
  // Which filter tab was active when edit mode was entered ('outstanding', 'cancelled', etc.)
  _editModeFilter:    { materials: null, consumables: null },
  // In-flight keys for async buttons without a confirm dialog — a double-tap would
  // otherwise apply the action twice (e.g. add stock twice, submit a duplicate order).
  _opBusy:            new Set(),

  // Consumable barcodes panel filter ('all' | 'missing' | 'has')
  _bcFilter:          'all',
  // CSV-backed consumables only — this.consumables = _baseConsumables + ghosts
  // (items created on-device that don't have their CSV row yet), re-merged on
  // every stock snapshot. Ghost reconciliation runs once per session.
  _baseConsumables:   [],
  _ghostsReconciled:  false,

  // Materials stocktake tab state
  _stocktakeView:     'qty',   // 'qty' | 'count' | 'history'
  _stActiveCat:       null,    // category/subcategory tabs (shared by Quantities + Count)
  _stActiveSub:       null,
  _stCats:            [],
  _stSubs:            [],
  _matStock:          [],      // live material_stock records
  _unsubMatStockMgr:  null,
  _stSessions:        [],
  _stSessionsLoaded:  false,
  _stSessionsLoading: false,
  _openStSessions:    new Set(),
  // Manager-side counting cart (Count sub-tab) — mirrors the worker page's stocktake
  _mstCart:           {},      // id -> counted qty (float)
  _mstModes:          {},      // id -> 'add' | 'subtract' (absent = 'set')
  _mstBusy:           false,   // bulk-submit guard
  _mstTickBusy:       new Set(),

  // Receive Stock panel state
  _receive:           { _items: {} },
  _receiveActiveCat:  null,
  _receiveActiveSub:  null,
  _receiveCats:       [],
  _receiveSubs:       [],

  // Stock tab state
  _stock:           [],       // live array from Firestore onSnapshot
  _unsubStock:      null,
  _openStockCards:  new Set(),
  _stockActiveCat:  null,     // null = All, '__low__' = low stock virtual tab, or a category name
  _stockActiveSub:  null,
  _stockCats:       [],
  _stockSubs:       [],

  // History tab state
  _historyRecords:  [],
  _historyLastDoc:  null,
  _historyHasMore:  false,
  _historyFilter:   null,     // null = all, or { stockId, itemName }
  _historyLoading:  false,
  _openHistorySessions: new Set(),

  async init() {
    FirebaseConfig.forget();
    const ok = await DB.init(FirebaseConfig.get());
    if (!ok) { this.showSetup("Can't reach the database. Check the Wi-Fi, then tap Reload."); return; }
    DB.onDenied = () => Auth.denied();
    Auth.deviceName = ManagerDeviceName;
    Auth.start(() => Auth.guardManagerPage());
    [this.materials, this._baseConsumables] = await Promise.all([
      Data.load('./materials.csv', list => this._setMaterials(list)),
      Data.loadConsumables('./consumables.csv', list => this._setConsumables(list)),
    ]);
    this.consumables  = this._baseConsumables;
    this.orderRef  = genRef();
    this._intakeDrafts = Intake.loadDrafts('manager');
    Intake.page = 'manager';   // whose deliveries wait for the connection (Intake.waiting)
    this._loadStaged();
    this.renderShell();
    this._loadCarts();
    this._loadMst();
    this._loadOwed();
    this._loadEmailOpen();
    Boot.ready('page');
    const verEl = document.getElementById('app-version');
    if (verEl) verEl.textContent = verLabel(APP_VERSION);
    this.startListening();
    this.startStockListening();
    this.startMatStockListening();
    this.startCatalogueWatch();
    this.startConnectionStatus();
    this.startVersionCheck();
  },

  // ── LIVE STATUS DOT (3-state: Live / Update Available / Offline) ──
  // Single source of truth so the dot and the update banner never disagree.
  // connected starts null (= not yet known) — submit guards must only block on an
  // explicit false, or submitting right after page load gets wrongly refused.
  _connState: { connected: null, latestVersion: null },

  _renderLiveStatus() { Live.render(this._connState); },

  // Live connection indicator — reflects actual Firestore connection state,
  // not just a decorative pulse. Backed by DB.listenConnectionStatus.
  startConnectionStatus() {
    DB.listenConnectionStatus(connected => {
      this._connState.connected = connected;
      this._renderLiveStatus();
      if (connected) Intake.flushWaiting(this._intakeHost());   // deliveries saved here while offline
    });
  },

  // Version staleness check — listens to the shared meta/version doc and
  // announces this build if it's newer than what's currently recorded.
  // See firebase-sync.js announceVersionIfNewer for the rollback caveat:
  // if you ever revert to an older build, manually edit meta/version's
  // "latest" field down in the Firebase console, since clients won't do
  // this automatically (a numeric-newer check can't tell a rollback from
  // a stale client).
  startVersionCheck() {
    DB.announceVersionIfNewer(APP_VERSION, isVersionNewer);
    DB.listenAppVersion(latest => {
      this._connState.latestVersion = latest;
      this._renderLiveStatus();
      AutoUpdate.notifyVersion(latest);
    });
    // Idle auto-reload (matters when this page is opened on an iPad for barcode
    // setup; harmless on the PC). Never while anything is part-done: a draft
    // materials/consumables order, receive-stock entries, an in-progress
    // stocktake count, delivery edit mode selections, or a delivery being ticked off.
    AutoUpdate.start({
      onDiscover: v => { this._connState.latestVersion = v; this._renderLiveStatus(); },
      isBusy:     () => this.noCount() > 0 || this.coCount() > 0
        || Object.keys(this._receive._items).length > 0
        || Object.keys(this._mstCart).length > 0
        || this._editMode.materials || this._editMode.consumables
        || this._opBusy.size > 0 || Intake.draftsInHand('manager'),
    });
  },

  // Firebase itself could not be reached (no network at first load, the SDK
  // blocked): a plain card and a Reload. The config is in the code (shared.js).
  showSetup(err) {
    Boot.gone();
    document.getElementById('root').innerHTML = `
      <div class="setup-screen"><div class="setup-card" style="text-align:center">
        <div class="auth-logo"></div>
        <p style="margin-bottom:16px">${esc(err || 'Could not connect.')}</p>
        <button class="btn btn-primary" style="width:100%" onclick="location.reload()"><i class="ti ti-refresh"></i> Reload</button>
      </div></div>`;
  },

  // ══════════════════════════════════════════
  // SHELL
  // ══════════════════════════════════════════
  renderShell() {
    document.getElementById('root').innerHTML = `
      <div class="app-root manager-root" id="app-root">

        <div class="header manager-hdr">
          <div class="col"><div class="header-inner">
            <span class="header-logo"></span>
            <div class="header-left">
              <div class="header-title">Material Orders — Manager</div>
              <div class="header-ref"><span class="live-dot connecting" id="live-dot"></span><span id="live-label">Connecting…</span> &nbsp;·&nbsp; <span id="app-version" style="font-family:var(--mono)"></span></div>
            </div>
            <div class="header-actions">
              <span class="role-pill" id="role-pill">${esc(ManagerDeviceName.get() || 'Manager')}</span>
              <span id="auth-pill"></span>
              <button class="icon-btn" id="btn-settings" aria-label="Settings"><i class="ti ti-settings"></i></button>
            </div>
          </div></div>
        </div>

        <div id="update-banner-wrap"></div>
        ${FirebaseConfig.isTestMode() ? '<div class="test-mode-banner"><i class="ti ti-flask"></i> Test mode — connected to test database</div>' : ''}

        <!-- MAIN TABS -->
        <div style="background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0">
          <div class="col" style="padding:0">
            <div class="main-tabs" id="main-tabs">
              <div class="main-tab-group">
                <div class="main-tab-group-label">Materials</div>
                <div style="display:flex">
                  <button class="main-tab active" id="main-tab-queue">
                    <i class="ti ti-inbox"></i>Order queue
                    <span class="sidebar-count act zero" id="queue-pending-badge">0</span>
                    <span class="new-order-dot" id="new-order-dot"></span>
                  </button>
                  <button class="main-tab" id="main-tab-new">
                    <i class="ti ti-plus"></i>New order
                    <span class="sidebar-count zero" id="new-order-badge">0</span>
                  </button>
                  <button class="main-tab" id="main-tab-intake-mat">
                    <i class="ti ti-truck-delivery"></i>Deliveries
                    <span class="sidebar-count zero" id="deliveries-mat-badge">0</span>
                    <span class="followup-badge" id="followup-mat-badge" style="display:none" title="Short deliveries to check with purchasing">0</span>
                  </button>
                  <button class="main-tab" id="main-tab-stocktake">
                    <i class="ti ti-clipboard-list"></i>Stocktake
                  </button>
                </div>
              </div>
              <div class="main-tab-divider"></div>
              <div class="main-tab-group">
                <div class="main-tab-group-label">Consumables</div>
                <div style="display:flex">
                  <button class="main-tab" id="main-tab-stock">
                    <i class="ti ti-package"></i>Stock
                    <span class="sidebar-count act zero" id="stock-low-badge">0</span>
                  </button>
                  <button class="main-tab" id="main-tab-history">
                    <i class="ti ti-history"></i>History
                  </button>
                  <button class="main-tab" id="main-tab-intake-cons">
                    <i class="ti ti-truck-delivery"></i>Deliveries
                    <span class="sidebar-count zero" id="deliveries-cons-badge">0</span>
                    <span class="followup-badge" id="followup-cons-badge" style="display:none" title="Short deliveries to check with purchasing">0</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- QUEUE VIEW: flex column → mobile-tabs (optional) + manager-columns -->
        <div id="view-queue" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;height:0">
          <!-- Mobile sub-tabs -->
          <div class="mobile-tabs" id="mobile-tabs">
            <button class="tab active" data-view="pending">Pending <span class="sidebar-count act zero" id="mob-pending-count" style="margin-left:4px">0</span></button>
            <button class="tab" data-view="sent">Sent</button>
            <button class="tab" data-view="rejected">Rejected</button>
            <button class="tab" data-view="all">All</button>
          </div>
          <!-- Two-column area: sidebar + scrollable main -->
          <div class="manager-columns" style="flex:1;display:flex;overflow:hidden;min-height:0">
            <div class="manager-sidebar">
              <div class="sidebar-section">
                <div class="sidebar-title">Orders</div>
                <button class="sidebar-btn active" data-sb="pending"><i class="ti ti-clock"></i>Pending<span class="sidebar-count act zero" id="pending-count">0</span></button>
                <button class="sidebar-btn" data-sb="sent"><i class="ti ti-mail-check"></i>Sent</button>
                <button class="sidebar-btn" data-sb="rejected"><i class="ti ti-ban"></i>Rejected</button>
                <button class="sidebar-btn" data-sb="all"><i class="ti ti-list"></i>All</button>
              </div>
              <div class="sidebar-section">
                <button class="sidebar-btn" id="sb-settings"><i class="ti ti-settings"></i>Settings</button>
              </div>
            </div>
            <div class="manager-main">
              <div class="order-queue" id="order-queue"></div>
            </div>
          </div>
        </div>

        <!-- NEW ORDER VIEW (materials only) -->
        <div id="view-new-order" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0">
          <div id="no-tabs-wrap"></div>
          <div class="search-bar"><div class="col"><div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="no-search" placeholder="Search part code or description…" autocomplete="off">
          </div></div></div>
          <div class="app-scroll" id="no-scroll"><div class="col"><div class="mat-list" id="no-mat-list"></div></div></div>
          <div class="action-bar"><div class="action-bar-inner split">
            <button class="btn-text" id="btn-no-clear-main" hidden>Clear order</button>
            <button class="btn btn-primary" id="btn-no-review"><i class="ti ti-clipboard-list"></i>Review &amp; compose email</button>
          </div></div>
        </div>

        <!-- STOCK VIEW -->
        <div id="view-stock" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0">
          <div class="stock-action-buttons">
            <button class="btn-sm btn-sm-save" id="btn-receive-stock"><i class="ti ti-truck-delivery"></i> Receive stock</button>
            <button class="btn-sm" id="btn-new-cons-order"><i class="ti ti-plus"></i> New consumables order</button>
            <button class="btn-sm" id="btn-cons-barcodes"><i class="ti ti-barcode"></i> Barcodes</button>
            <button class="btn-sm" id="btn-export-cons"><i class="ti ti-file-spreadsheet"></i> Export consumables</button>
            <button class="btn-sm" id="btn-reorder-all" style="display:none"><i class="ti ti-refresh"></i> Reorder all</button>
          </div>
          <button type="button" id="stock-low-banner" style="display:none" class="low-stock-banner">
            <i class="ti ti-alert-triangle"></i>
            <span id="stock-low-text"></span>
            <span class="low-stock-go">Show <i class="ti ti-chevron-right"></i></span>
          </button>
          <div id="stock-tabs-wrap"></div>
          <div class="search-bar"><div class="col"><div class="search-wrap">
            <i class="ti ti-search"></i>
            <input type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="stock-search" placeholder="Search consumables…" autocomplete="off">
          </div></div></div>
          <div class="app-scroll" id="stock-scroll">
            <div id="stock-list" class="stock-list"></div>
          </div>
        </div>

        <!-- HISTORY VIEW -->
        <div id="view-history" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0">
          <div class="history-filter-bar" id="history-filter-bar">
            <button type="button" class="history-filter-chip" id="history-clear-filter" style="display:none" aria-label="Show every item">
              <i class="ti ti-x"></i><span id="history-filter-label">All items</span>
            </button>
            <input type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="history-item-search" placeholder="Filter by item…" autocomplete="off"
              style="width:150px;height:36px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);padding:0 10px;font-size:12px;color:var(--text);outline:none">
            <input type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="history-person-search" placeholder="Filter by name…" autocomplete="off"
              style="width:210px;height:36px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);padding:0 10px;font-size:12px;color:var(--text);outline:none">
          </div>
          <div class="app-scroll" id="history-scroll">
            <div id="history-list" class="history-list"></div>
          </div>
        </div>

        <!-- MATERIALS DELIVERIES VIEW -->
        <div id="view-intake-mat" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0">
          <div class="col" style="padding-top:10px;padding-bottom:0;flex-shrink:0">
            <div style="display:flex;align-items:center;gap:8px">
              <div class="intake-filter-bar" id="intake-filter-mat" style="flex:1">
                <button type="button" aria-pressed="false" class="intake-filter-chip" data-filter="all">All</button>
                <button type="button" aria-pressed="true" class="intake-filter-chip active" data-filter="outstanding"><i class="ti ti-clock"></i> Outstanding</button>
                <button type="button" aria-pressed="false" class="intake-filter-chip" data-filter="backorder"><i class="ti ti-clock-pause"></i> Back orders</button>
                <button type="button" aria-pressed="false" class="intake-filter-chip" data-filter="completed"><i class="ti ti-circle-check"></i> Completed</button>
                <button type="button" aria-pressed="false" class="intake-filter-chip" data-filter="cancelled"><i class="ti ti-ban"></i> Cancelled</button>
              </div>
              <button class="btn-sm" id="btn-intake-edit-mat"><i class="ti ti-pencil"></i> Edit deliveries</button>
            </div>
          </div>
          <div class="intake-scroll app-scroll">
            <div class="col">
              <div class="intake-list" id="intake-list-mat"></div>
              <div class="intake-edit-list" id="intake-edit-list-mat" style="display:none"></div>
            </div>
          </div>
          <div class="action-bar" id="intake-editbar-mat" style="display:none">
            <div class="action-bar-inner" style="flex-direction:row">
              <button class="btn btn-danger" id="btn-intake-cancel-mat" disabled><i class="ti ti-ban"></i> Cancel selected</button>
              <button class="btn btn-primary" id="btn-intake-combine-mat" disabled><i class="ti ti-git-merge"></i> Combine selected</button>
              <button class="btn btn-danger" id="btn-intake-delete-mat" disabled style="display:none"><i class="ti ti-trash"></i> Delete selected</button>
              <button class="btn btn-outline" id="btn-intake-editdone-mat"><i class="ti ti-check"></i> Finish editing</button>
            </div>
          </div>
        </div>

        <!-- MATERIALS STOCKTAKE VIEW -->
        <div id="view-stocktake" style="display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0">
          <div class="col" style="padding-top:10px;padding-bottom:0;flex-shrink:0">
            <div class="intake-filter-bar" id="stocktake-filter">
              <button type="button" aria-pressed="true" class="intake-filter-chip active" data-st-view="qty"><i class="ti ti-list-numbers"></i> Quantities</button>
              <button type="button" aria-pressed="false" class="intake-filter-chip" data-st-view="count"><i class="ti ti-clipboard-check"></i> Count</button>

  // ══════════════════════════════════════════
  // INTAKE TABS (Deliveries)
  // ══════════════════════════════════════════
  renderIntakeMat() {
    if (this._editMode.materials) { this.renderEditList('materials'); return; }
    const el = document.getElementById('intake-list-mat'); if (!el) return;
    if (!this._ordersReady) { el.innerHTML = skeleton(4, 'tall'); return; }
    const restoreFocus = captureInputFocus(); // live snapshots re-render mid-typing
    el.innerHTML = Intake.renderCategoryList(this.orders, 'materials', this._intakeFilter.materials, this._intakeOpenOrders, this._intakeDrafts, true);
    restoreFocus();
  },

  renderIntakeCons() {
    if (this._editMode.consumables) { this.renderEditList('consumables'); return; }
    const el = document.getElementById('intake-list-cons'); if (!el) return;
    if (!this._ordersReady) { el.innerHTML = skeleton(4, 'tall'); return; }
    const restoreFocus = captureInputFocus();
    el.innerHTML = Intake.renderCategoryList(this.orders, 'consumables', this._intakeFilter.consumables, this._intakeOpenOrders, this._intakeDrafts, true);
    restoreFocus();
  },

  // Looks up a delivery group by groupKey across both types (a card doesn't know its own
  // type ahead of time from the key alone).
  _intakeFindGroup(groupKey) {
    const matGroups  = Intake.buildCategoryGroups(this.orders, 'materials');
    const consGroups = Intake.buildCategoryGroups(this.orders, 'consumables');
    return [...matGroups, ...consGroups].find(g => g.groupKey === groupKey);
  },

  // Toggles a card's open/closed state and re-renders it in place. cardKey may be a
  // plain orderId (notes-toggle path — falls back to a full list re-render) or a
  // delivery groupKey (optionally suffixed "|||bo" for the derived back-order-only
  // card) — groupKeys are always DLV-... or legacy:orderId:category, never a bare doc
  // id, which is what lets a bare orderId fall through to the full-rerender branch below.
  intakeRerenderCard(cardKey, type) {
    if (this._intakeOpenOrders.has(cardKey)) this._intakeOpenOrders.delete(cardKey);
    else this._intakeOpenOrders.add(cardKey);

    let isDerived = false, groupKey = cardKey;
    if (groupKey.endsWith('|||bo')) { isDerived = true; groupKey = groupKey.slice(0, -5); }

    const group = this._intakeFindGroup(groupKey);
    if (!group) { if (type === 'materials') this.renderIntakeMat(); else this.renderIntakeCons(); return; }

    const isMat = !group.entries[0].order.type || group.entries[0].order.type === 'materials';
    const t     = type || (isMat ? 'materials' : 'consumables');
    let entries = group.entries;
    if (isDerived) entries = entries.filter(({ order, item }) => Intake.outstandingOf(order, item) > 0);

    const safeId = cardKey.replace(/[^a-zA-Z0-9]/g, '_');
    const cardEl = document.getElementById(`intake-card-${safeId}`);
    const draftForCard = this._intakeDrafts.get(groupKey);
    const isCancelled = entries.every(({ order }) => !!order.intakeCancelled);
    const opts = { isDerived, readOnly: isCancelled, isCancelledCard: isCancelled, showRestore: isCancelled, draftForCard };
    if (cardEl) cardEl.outerHTML = Intake.renderCategoryCard(groupKey, group.category, entries, t, this._intakeOpenOrders, opts);
    else { if (isMat) this.renderIntakeMat(); else this.renderIntakeCons(); }
  },

  // ── INTAKE MUTATIONS (staged in _intakeDrafts — nothing is saved until Confirm) ──
  // _intakeDrafts is keyed by groupKey; each draft's own entries use composite
  // "orderId::itemId" keys since a delivery can span multiple orders (see intake.js).

  intakeSetStatus(orderId, itemId, action) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._intakeDrafts.has(groupKey)) this._intakeDrafts.set(groupKey, {});
    const draft = this._intakeDrafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    const saved = ((order.intake && order.intake.items) || {})[String(itemId)] || {};
    const draftItem = draft[key] || {};
    const currentStatus = draftItem.status !== undefined ? draftItem.status : (saved.status || null);
    if (currentStatus === action) {
      draft[key] = { ...draftItem, status: null, qtyReceived: null, outstandingQty: null };
    } else {
      // "Still to come" defaults: B/O means the supplier is sending the whole line later;
      // Partial keeps whatever's already recorded (0 until someone says the rest is coming);
      // OK / Missing leave nothing outstanding.
      const prevOut = draftItem.outstandingQty ?? saved.outstandingQty;
      let outstandingQty = 0;
      if (action === 'backorder')    outstandingQty = (prevOut > 0) ? prevOut : (item.qty || 0);
      else if (action === 'partial') outstandingQty = prevOut || 0;
      draft[key] = {
        ...draftItem,
        status: action,
        qtyReceived: action === 'partial' ? (draftItem.qtyReceived ?? saved.qtyReceived ?? null) : null,
        outstandingQty,
      };
    }
    this._intakeRerenderCardOnly(orderId, item.category, groupKey);
  },

  intakeSetPartialQty(orderId, itemId, qty) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._intakeDrafts.has(groupKey)) this._intakeDrafts.set(groupKey, {});
    const draft = this._intakeDrafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    draft[key] = { ...(draft[key] || {}), qtyReceived: qty };
    this._intakeRerenderCardOnly(orderId, item.category, groupKey);
  },

  // How many of this line the supplier is still sending (a known future shipment).
  intakeSetOutstanding(orderId, itemId, qty) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._intakeDrafts.has(groupKey)) this._intakeDrafts.set(groupKey, {});
    const draft = this._intakeDrafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    draft[key] = { ...(draft[key] || {}), outstandingQty: qty };
    this._intakeRerenderCardOnly(orderId, item.category, groupKey);
  },

  // Resolving a short-delivery follow-up. 'coming' = purchasing confirmed the rest is on
  // its way, so it becomes a tracked back order; 'dismiss' = nothing more is coming, close
  // the line. Staged like any other edit — still needs Confirm.
  intakeResolveFollowUp(orderId, itemId, action) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._intakeDrafts.has(groupKey)) this._intakeDrafts.set(groupKey, {});
    const draft = this._intakeDrafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    const saved = ((order.intake && order.intake.items) || {})[String(itemId)] || {};
    const cur = { ...saved, ...(draft[key] || {}) };
    if (action === 'coming') {
      draft[key] = { ...(draft[key] || {}), outstandingQty: Math.max(0, (item.qty || 0) - (cur.qtyReceived || 0)) };
    } else {
      draft[key] = { ...(draft[key] || {}), followUpDone: true };
    }
    this._intakeRerenderCardOnly(orderId, item.category, groupKey);
  },

  // "Arrived" on a back-ordered line — books the outstanding amount as received in one
  // tap: adds it to what came before, fills the line to OK if that completes it, and
  // clears the outstanding so it drops off the Back Orders tab. Staged like any other
  // edit, so it still needs Confirm (and consumables stock follows via the stock tag).
  intakeMarkArrived(orderId, itemId) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._intakeDrafts.has(groupKey)) this._intakeDrafts.set(groupKey, {});
    const draft = this._intakeDrafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    const saved = ((order.intake && order.intake.items) || {})[String(itemId)] || {};
    const cur   = { ...saved, ...(draft[key] || {}) };
    const outstanding = Intake.outstandingOf(order, item, { [key]: cur });
    if (outstanding <= 0) return;
    const already   = cur.status === 'ok' ? (item.qty || 0) : (cur.qtyReceived || 0);
    const nowRecv   = already + outstanding;
    const isComplete = nowRecv >= (item.qty || 0);
    draft[key] = {
      ...(draft[key] || {}),
      status: isComplete ? 'ok' : 'partial',
      qtyReceived: isComplete ? null : nowRecv,
      outstandingQty: 0,
    };
    this._intakeRerenderCardOnly(orderId, item.category, groupKey);
  },

  intakeSetNote(orderId, itemId, text) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const item = (order.items || []).find(i => String(i.id) === String(itemId)); if (!item) return;
    const groupKey = item.deliveryId || `legacy:${orderId}:${item.category}`;
    if (!this._intakeDrafts.has(groupKey)) this._intakeDrafts.set(groupKey, {});
    const draft = this._intakeDrafts.get(groupKey);
    const key = `${orderId}::${itemId}`;
    draft[key] = { ...(draft[key] || {}), notes: text };
    this._intakeRerenderCardOnly(orderId, item.category, groupKey);
  },

  // Re-renders just the open card showing staged draft edits — no Firestore write,
  // so tab placement never changes until the user hits Confirm.
  _intakeRerenderCardOnly(orderId, category, groupKey) {
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const isMat = !order.type || order.type === 'materials';
    const type  = isMat ? 'materials' : 'consumables';
    const group = this._intakeFindGroup(groupKey);
    if (!group) return;
    const draftForCard = this._intakeDrafts.get(groupKey);
    Intake.keepDrafts('manager', this._intakeDrafts);
    const restoreFocus = captureInputFocus(); // notes debounce re-renders while typing

    const fullSafe = groupKey.replace(/[^a-zA-Z0-9]/g, '_');
    const fullEl   = document.getElementById(`intake-card-${fullSafe}`);
    if (fullEl) {
      fullEl.outerHTML = Intake.renderCategoryCard(groupKey, category, group.entries, type, this._intakeOpenOrders, { draftForCard });
      restoreFocus();
      return;
    }

    const boEntries = group.entries.filter(({ order: o, item }) => Intake.outstandingOf(o, item) > 0);
    const boSafe  = `${groupKey}|||bo`.replace(/[^a-zA-Z0-9]/g, '_');
    const boEl    = document.getElementById(`intake-card-${boSafe}`);
    if (boEl) {
      boEl.outerHTML = Intake.renderCategoryCard(groupKey, category, boEntries, type, this._intakeOpenOrders, { isDerived: true, draftForCard });
      restoreFocus();
    }
  },

  // What the shared save code (Intake.saveCard and friends) needs from this page.
  _intakeHost() {
    return {
      page: 'manager', drafts: this._intakeDrafts, device: 'PC',
      by:     () => (Settings.get().managerName || 'Manager').trim() || 'Manager',
      find:   groupKey => this._intakeFindGroup(groupKey),
      redraw: group => { if (!group.entries[0].order.type || group.entries[0].order.type === 'materials') this.renderIntakeMat(); else this.renderIntakeCons(); },
      connected: () => this._connState.connected,
      ready:     () => !!this._ordersReady,   // the save itself checks against the server
    };
  },
  intakeConfirm(cardKey)    { return Intake.saveCard(this._intakeHost(), cardKey, true); },
  intakeSave(cardKey)       { return Intake.saveCard(this._intakeHost(), cardKey, false); },
  intakeDiscard(cardKey)    { return Intake.discard(this._intakeHost(), cardKey); },
  intakeApplyStock(cardKey) { return Intake.applyStock(this._intakeHost(), cardKey); },

  // Restores a cancelled DELIVERY (by groupKey) — clears the cancelled marker on every
  // contributing order, not just the first one, so multi-order deliveries restore whole.
  async intakeRestore(groupKey) {
    const groups = [
      ...Intake.buildCategoryGroups(this.orders, 'materials', true),
      ...Intake.buildCategoryGroups(this.orders, 'consumables', true),
    ];
    const group = groups.find(g => g.groupKey === groupKey);
    if (!group) return;
    const orderIds = [...new Set(group.entries.map(e => e.order._id))];
    try {
      await Promise.all(orderIds.map(id => DB.setDeliveryCancelled(id, groupKey, false)));
    } catch (e) {
      tellFailed('Delivery not reopened', e);
    }
  },

  // ── EDIT MODE (combine/cancel/delete deliveries) — manager.html only ─────────────
  toggleEditMode(type) {
    this._editMode[type] = !this._editMode[type];
    this._editSelected[type].clear();
    const id         = type === 'materials' ? 'mat' : 'cons';
    const listEl     = document.getElementById(`intake-list-${id}`);
    const editEl     = document.getElementById(`intake-edit-list-${id}`);
    const filterBar  = document.getElementById(`intake-filter-${id}`);
    const editBar    = document.getElementById(`intake-editbar-${id}`);
    const active     = this._editMode[type];
    if (active) {
      this._editModeFilter[type] = this._intakeFilter[type];
    } else {
      this._editModeFilter[type] = null;
    }
    if (listEl)   listEl.style.display              = active ? 'none' : '';
    if (editEl)   editEl.style.display              = active ? '' : 'none';
    if (filterBar)filterBar.style.opacity           = active ? '0.4' : '1';
    if (filterBar)filterBar.style.pointerEvents     = active ? 'none' : '';
    if (editBar)  editBar.style.display             = active ? '' : 'none';
    if (active) { this.renderEditList(type); this._updateEditActionBar(type); }
    else { if (type === 'materials') this.renderIntakeMat(); else this.renderIntakeCons(); }
  },

  // Edit mode lists DELIVERIES (grouped the same way as the normal Deliveries cards —
  // now by deliveryId, so a delivery spanning multiple orders shows as ONE row here
  // too), not raw orders — that's what the manager actually looks at and wants to fix.
  // Combine/Cancel still act on the underlying order document(s) (a delivery has no
  // separate existence in Firestore, it's just a view over items across one or more
  // orders), so a selection is keyed by groupKey and resolved down to distinct order ids
  // on action via _editSelectedOrderIds.
  renderEditList(type) {
    const id = type === 'materials' ? 'mat' : 'cons';
    const el = document.getElementById(`intake-edit-list-${id}`); if (!el) return;
    const isCancelledMode = this._editModeFilter[type] === 'cancelled';
    const groups = Intake.buildCategoryGroups(this.orders, type, isCancelledMode);
    const opt = (v, label) => `<button type="button" class="${(v === 'cancelled') === isCancelledMode ? 'on' : ''}" data-edit-scope="${v}" aria-pressed="${(v === 'cancelled') === isCancelledMode}">${label}</button>`;
    const head = `<div class="seg edit-scope" role="group" aria-label="Deliveries to edit">${opt('active', 'Active deliveries')}${opt('cancelled', 'Cancelled deliveries')}</div>`;
    if (!groups.length) {
      const noun = isCancelledMode ? 'cancelled' : '';
      el.innerHTML = head + `<div class="empty-state"><i class="ti ti-inbox-off"></i><p>No ${noun ? noun + ' ' : ''}${type} deliveries${isCancelledMode ? ' to delete' : ' to edit'}.</p></div>`;
      return;
    }
    el.innerHTML = head + groups.map(g => {
      const distinctOrderIds = [...new Set(g.entries.map(e => e.order._id))];
      const submittedDates = g.entries
        .map(e => e.order.submittedAt && e.order.submittedAt.toDate ? e.order.submittedAt.toDate() : null)
        .filter(Boolean);
      const ts = submittedDates.length
        ? new Date(Math.min(...submittedDates.map(d => d.getTime()))).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' })
        : '';
      const refLabel = distinctOrderIds.length === 1
        ? (g.entries[0].order.ref || g.entries[0].order._id)
        : `${distinctOrderIds.length} orders`;
      const checked = this._editSelected[type].has(g.groupKey);
      return `
        <label class="edit-delivery-row">
          <input type="checkbox" data-edit-order="${esc(g.groupKey)}" ${checked ? 'checked' : ''}>
          <div class="edit-delivery-info">
            <div class="edit-delivery-ref">${esc(g.category)}</div>
            <div class="edit-delivery-meta">${esc(ts)} &middot; ${g.entries.length} item${g.entries.length !== 1 ? 's' : ''} &middot; from ${esc(refLabel)}</div>
          </div>
        </label>`;
    }).join('');
  },

  toggleEditSelect(type, groupKey) {
    const s = this._editSelected[type];
    if (s.has(groupKey)) s.delete(groupKey); else s.add(groupKey);
    this._updateEditActionBar(type);
  },

  // Resolves the current selection to delivery groups (cancelled groups when in
  // cancelled edit mode, active groups otherwise).
  _editSelectedGroups(type) {
    const isCancelledMode = this._editModeFilter[type] === 'cancelled';
    const groups = Intake.buildCategoryGroups(this.orders, type, isCancelledMode);
    return groups.filter(g => this._editSelected[type].has(g.groupKey));
  },

  // Distinct underlying order ids across the selected deliveries (Combine needs these —
  // combining is inherently an order-document operation).
  _editSelectedOrderIds(type) {
    const orderIds = new Set();
    for (const g of this._editSelectedGroups(type)) {
      for (const { order } of g.entries) orderIds.add(order._id);
    }
    return [...orderIds];
  },

  _updateEditActionBar(type) {
    const id = type === 'materials' ? 'mat' : 'cons';
    const nGroups = this._editSelectedGroups(type).length;
    const nOrders = this._editSelectedOrderIds(type).length;
    const isCancelledMode = this._editModeFilter[type] === 'cancelled';
    const cancelBtn  = document.getElementById(`btn-intake-cancel-${id}`);
    const combineBtn = document.getElementById(`btn-intake-combine-${id}`);
    const deleteBtn  = document.getElementById(`btn-intake-delete-${id}`);
    if (cancelBtn)  { cancelBtn.style.display  = isCancelledMode ? 'none' : ''; cancelBtn.disabled  = nGroups < 1; }
    if (combineBtn) { combineBtn.style.display = isCancelledMode ? 'none' : ''; combineBtn.disabled = nOrders < 2; }
    if (deleteBtn)  { deleteBtn.style.display  = isCancelledMode ? '' : 'none'; deleteBtn.disabled  = nGroups < 1; }
  },

  // Cancels the selected DELIVERIES individually — an order's other deliveries keep
  // being tracked (cancellation is per-groupKey, see Intake.buildCategoryGroups).
  async cancelSelectedDeliveries(type) {
    const groups = this._editSelectedGroups(type);
    if (!groups.length) return;
    // Warn if any selected delivery has already had its received quantities added to
    // stock — cancelling won't pull that stock back out.
    const nStocked = groups.filter(g => Intake.appliedStockTotal(g.entries) > 0).length;
    const n = groups.length, many = n !== 1;
    if (!await Ask.confirm({
      title: many ? `Cancel ${n} deliveries?` : `Cancel the ${groups[0].category} delivery?`,
      body: `${many ? 'They move' : 'It moves'} to Cancelled, and can be reopened from there.${nStocked ? ' What was added to stock stays in stock.' : ''}`,
      yes: many ? 'Cancel deliveries' : 'Cancel delivery', no: many ? 'Keep deliveries' : 'Keep delivery', danger: true,
    })) return;
    const results = await Promise.allSettled(groups.map(g =>
      Promise.all([...new Set(g.entries.map(e => e.order._id))].map(id => DB.setDeliveryCancelled(id, g.groupKey, true)))));
    if (this._batchFailed(type, groups, results, 'cancelled')) return;
    this._editSelected[type].clear();
    this.toggleEditMode(type);
  },

  async combineSelectedOrders(type) {
    const orderIds = this._editSelectedOrderIds(type);
    if (orderIds.length < 2) return;
    const [target, ...sources] = orderIds;
    const targetOrder = this.orders.find(o => o._id === target);
    if (!await Ask.confirm({
      title: `Combine ${orderIds.length} orders into one?`,
      body: `Everything moves to ${targetOrder?.ref || target} and the other ${sources.length === 1 ? 'order is' : sources.length + ' orders are'} deleted. This cannot be undone.`,
      yes: 'Combine orders', no: 'Keep separate', danger: true,
    })) return;
    try {
      await DB.combineOrders(target, sources);
      this._editSelected[type].clear();
      this.toggleEditMode(type);
    } catch (e) {
      tellFailed('Not combined', e);
    }
  },

  // Permanently deletes the selected cancelled DELIVERIES — removes just those items
  // from each contributing order (the order doc itself is only deleted once nothing
  // else remains on it), so other deliveries and queue history survive.
  async deleteSelectedDeliveries(type) {
    const groups = this._editSelectedGroups(type);
    if (!groups.length) return;
    const n = groups.length, many = n !== 1;
    if (!await Ask.confirm({
      title: many ? `Delete ${n} cancelled deliveries?` : `Delete the cancelled ${groups[0].category} delivery?`,
      body: 'This cannot be undone.', rows: groups.map(g => [g.category, `${g.entries.length} line${g.entries.length !== 1 ? 's' : ''}`]),
      yes: many ? 'Delete deliveries' : 'Delete delivery', no: many ? 'Keep deliveries' : 'Keep delivery', danger: true,
    })) return;
    const results = await Promise.allSettled(groups.map(g => {
      const byOrder = new Map();
      for (const { item, order } of g.entries) {
        if (!byOrder.has(order._id)) byOrder.set(order._id, []);
        byOrder.get(order._id).push(String(item.id));
      }
      return Promise.all([...byOrder].map(([orderId, itemIds]) => DB.deleteDeliveryItems(orderId, itemIds, g.groupKey)));
    }));
    if (this._batchFailed(type, groups, results, 'deleted')) return;
    this._editSelected[type].clear();
    this.toggleEditMode(type);
  },

  // Some of a batch failed: say which, and leave just those ticked to try again.
  _batchFailed(type, groups, results, done) {
    const failed = groups.filter((g, i) => results[i].status === 'rejected');
    if (!failed.length) return false;
    this._editSelected[type] = new Set(failed.map(g => g.groupKey));
    this.renderEditList(type); this._updateEditActionBar(type);
    const e = results.find(r => r.status === 'rejected').reason;
    tellFailed(`${failed.length} of ${groups.length} not ${done}`, e, `Still ticked: ${failed.map(g => g.category).join(', ')}. Try again.`);
    return true;
  },

  // ══════════════════════════════════════════
  // MATERIALS STOCKTAKE — Quantities / Count / History sub-tabs + Excel exports.
  // Quantities + Count come from material_stock (Count also writes it, like the
  // worker page); History lists material_stocktakes sessions.
  // ══════════════════════════════════════════
  startMatStockListening() {
    if (this._unsubMatStockMgr) this._unsubMatStockMgr();
    this._unsubMatStockMgr = DB.listenMaterialStock((recs, fromCache) => {
      this._matStock = recs;
      if (!fromCache || recs.length) this._matStockReady = true;
      if (this.mainTab === 'stocktake' && this._stocktakeView !== 'history') this._renderStActiveList();
    });
  },

  // Live materials list (Data.watch): a catalogue change re-renders the New
  // Order and Stocktake material lists; the full document feeds the catalogue
  // screen in Settings. A category tab that no longer exists falls back to All.
  startCatalogueWatch() {
    if (this._unsubCatalogue) this._unsubCatalogue();
    this._unsubCatalogue = Data.watch(list => this._setMaterials(list), doc => Catalogue.onDoc(doc));
  },
  _setMaterials(list) {
    this._no._items = Kept.move(this._no._items, this.materials, list);
    this._mstCart   = Kept.move(this._mstCart,   this.materials, list);
    this._mstModes  = Kept.move(this._mstModes,  this.materials, list);
    this.materials = list;
    if (!document.getElementById('app-root')) return;   // not drawn yet
    const cats = Data.categories(list);
    if (this.activeCat && !cats.includes(this.activeCat)) { this.activeCat = null; this.activeSub = null; }
    else if (this.activeSub && !Data.subcategories(list, this.activeCat).includes(this.activeSub)) this.activeSub = null;
    if (this._stActiveCat && !cats.includes(this._stActiveCat)) { this._stActiveCat = null; this._stActiveSub = null; }
    else if (this._stActiveSub && !Data.subcategories(list, this._stActiveCat).includes(this._stActiveSub)) this._stActiveSub = null;
    const restoreFocus = captureInputFocus();
    this._fillCarts();
    this.renderNoTabs(); this.renderNoList();
    this.renderStocktakeTabs(); this._renderStActiveList();
    restoreFocus();
  },
  _setConsumables(list) {
    const was = this.consumables;
    this._baseConsumables = list;
    this.consumables = GhostItems.merge(list, this._stock);
    this._co._items      = Kept.move(this._co._items,      was, this.consumables);
    this._receive._items = Kept.move(this._receive._items, was, this.consumables);
    if (!document.getElementById('app-root')) return;
    this._fillCarts();
    this.renderStockTabs(); this.renderStockList();
    this.renderCoTabs(); this.renderCoList(); this.renderReceiveTabs(); this.renderReceiveList();
  },

  renderStocktakeView() {
    const view = this._stocktakeView;
    const isQty = view === 'qty', isCount = view === 'count', isHist = view === 'history';
    const set = (id, show, disp='') => { const el = document.getElementById(id); if (el) el.style.display = show ? disp : 'none'; };
    set('stocktake-qty-list',     isQty);
    set('stocktake-count-list',   isCount);
    set('stocktake-history-list', isHist);
    set('stocktake-export-bar',   isQty, 'flex');
    set('stocktake-count-bar',    isCount, 'flex');
    set('stocktake-search-bar',   !isHist);   // tabs + search on both Quantities and Count
    set('stocktake-tabs-wrap',    !isHist);
    if (isHist) { this.renderStocktakeHistory(); }
    else { this.renderStocktakeTabs(); this._renderStActiveList(); }
  },

  // Renders whichever list (Quantities or Count) is active — shared by tabs, search
  // and the live material_stock listener so all three stay in sync.
  _renderStActiveList() {
    if (this._stocktakeView === 'count') this.renderStocktakeCount();
    else this.renderStocktakeQty();
  },

  _stStockMap() { return new Map(this._matStock.map(r => [r._id, r])); },

  // Category tabs + subcategory subtabs, exactly like the ordering menus.
  renderStocktakeTabs() {
    const wrap = document.getElementById('stocktake-tabs-wrap'); if (!wrap) return;
    this._stCats = Data.categoriesBySize(this.materials);
    this._stSubs = this._stActiveCat ? Data.subcategories(this.materials, this._stActiveCat) : [];
    Strip.draw(wrap, { cats: this._stCats, cat: this._stActiveCat, subs: this._stSubs, sub: this._stActiveSub, catAttr: 'st-cat-idx', subAttr: 'st-sub-idx' });
  },

  stqSetCat(cat) { this._stActiveCat=cat; this._stActiveSub=null; this.renderStocktakeTabs(); this._renderStActiveList(); },
  stqSetSub(sub) { this._stActiveSub=sub; this.renderStocktakeTabs(); this._renderStActiveList(); },

  renderStocktakeQty() {
    const el = document.getElementById('stocktake-qty-list'); if (!el) return;
    const q = document.getElementById('stocktake-search')?.value || '';
    const stockMap = this._stStockMap();
    // Same filtering/sorting engine as the ordering pages — active category/subcategory
    // tabs + search, items sorted by description. No section headers; the tabs organise.
    const filtered = Data.filter(this.materials, this._stActiveCat, this._stActiveSub, q), note = searchNote(filtered, q);
    if (!filtered.length) { el.innerHTML = note || `<div class="empty-state"><i class="ti ti-package-off"></i><p>No materials in this category.</p></div>`; return; }
    el.innerHTML = note + filtered.map(m => {
      const rec = stockMap.get(stockId(m));
      const unit = stocktakeUnit(m);
      const showCode = m.partCode && !Data.isDummyCode(m.partCode);
      const counted = rec && rec.qty != null, known = this._matStockReady;
      const at = countedWhen(rec), when = at && at.toDate ? fmtTime(at.toDate()) : '';
      return `<div class="stocktake-row">
        <div class="stocktake-row-info">
          <div class="stocktake-row-name">${descHtml(m.description)}</div>
          <div class="stocktake-row-meta">${showCode ? esc(m.partCode) + ' · ' : ''}${esc(unit)}${counted && when ? ` · counted ${when}${rec.updatedBy ? ' by ' + esc(rec.updatedBy) : ''}` : ''}</div>
        </div>
        <div class="stocktake-qty${counted ? '' : ' uncounted'}">${counted ? rec.qty + ' ' + esc(unit) : known ? '—' : '…'}</div>
      </div>`;
    }).join('');
  },

  // ── COUNT sub-tab (manager does the counting, same as the worker page) ──
  // Recorded against the manager name; per-item set/add/subtract; a green tick
  // records one item immediately, Review & submit posts several at once.
  _mstCountedBy() { const s = Settings.get(); return (s.managerName || 'Manager').trim() || 'Manager'; },
  mstGet(id)    { return this._mstCart[id]; },        // undefined: nothing entered. 0 is a count.
  mstModeOf(id) { return this._mstModes[id] || 'set'; },
  mstSet(id, qty) {
    if (qty === undefined) { delete this._mstCart[id]; return; }
    this._mstCart[id] = Math.max(0, round2(qty)); // decimals allowed (metres)
  },
  mstAdj(id, d)    { const q = this.mstGet(id); if (q === undefined && d < 0) return; this.mstSet(id, (q || 0) + d); this._mstChanged(); },
  mstType(el) {
    const id = +el.dataset.mstQid, m = this.materials.find(x => x.id == id); if (!m) return;
    this.mstSet(id, Count.read(el));
    Count.typed(el, this._stStockMap().get(stockId(m)), stocktakeUnit(m), this.mstGet(id), this.mstModeOf(id), this._matStockReady);
    this._updateMstBadge();
  },
  mstSetMode(id, mode) { if (mode === 'set') delete this._mstModes[id]; else this._mstModes[id] = mode; this.renderStocktakeCount(); },
  mstCount()    { return this.mstItems().length; },
  _mstPayload(m) {
    return {
      sid: stockId(m), partCode: m.partCode || '', description: m.description,
      category: m.category, subcategory: m.subcategory,
      unit: stocktakeUnit(m), qty: this.mstGet(m.id), mode: this.mstModeOf(m.id),
    };
  },
  mstItems() {
    return Object.keys(this._mstCart).map(id => {
      const m = this.materials.find(x => x.id == id);
      return m && Count.ready(this.mstGet(id), this.mstModeOf(id)) ? { ...m, qty: this._mstCart[id], stMode: this.mstModeOf(id) } : null;
    }).filter(Boolean);
  },
  _mstChanged() { this._updateMstBadge(); this.renderStocktakeCount(); },
  _updateMstBadge() {
    this._keepMst();
    const b = document.getElementById('mst-badge'); if (!b) return;
    const n = this.mstCount(); setCount(b, n);
  },
  // Counts not recorded yet are kept on this PC through a reload, like the worker page's.
  _keepMst() {
    if (!this._mstLoaded) return;
    const counts = Kept.lines(this.mstItems().map(i => ({ ...i, mode: i.stMode })));
    if (counts.length) Kept.save('mst', { counts }); else Kept.drop('mst');
  },
  _loadMst() {
    const v = Kept.load('mst', 14 * 86400000);
    if (v) Kept.fill(v.counts, this.materials, (m, l) => { this._mstCart[m.id] = l.qty; if (l.mode && l.mode !== 'set') this._mstModes[m.id] = l.mode; });
    this._mstLoaded = true;
    this._updateMstBadge();
  },

  renderStocktakeCount() {
    const el = document.getElementById('stocktake-count-list'); if (!el) return;
    const q = document.getElementById('stocktake-search')?.value || '';
    const stockMap = this._stStockMap();
    const filtered = Data.filter(this.materials, this._stActiveCat, this._stActiveSub, q), note = searchNote(filtered, q);
    if (!filtered.length) { el.innerHTML = note || `<div class="empty-state"><i class="ti ti-package-off"></i><p>No materials in this category.</p></div>`; return; }
    const restoreFocus = captureInputFocus(); // live stock updates re-render mid-typing
    el.innerHTML = note + filtered.map(m => {
      const qty = this.mstGet(m.id), mode = this.mstModeOf(m.id);
      const unit = stocktakeUnit(m);
      const rec = stockMap.get(stockId(m));
      const showCode = m.partCode && !Data.isDummyCode(m.partCode);
      return `<div class="mat-card st-card ${Count.ready(qty, mode)?'in-order':''}">
        ${catTile(m.category)}
        <div class="mat-info">
          <div class="mat-name">${descHtml(m.description)}</div>
          ${showCode ? `<div class="mat-partcode">${esc(m.partCode)}</div>` : '<div class="mat-partcode"></div>'}
          <div class="mat-unit">${esc(unit)} · <span class="st-recorded">${Count.line(rec, unit, qty, mode, this._matStockReady)}</span></div>
        </div>
        ${Count.controls('mst', m.id, qty, mode)}
      </div>`;
    }).join('');
    restoreFocus();
  },

  // Counts go as waiting writes (Count.queue), like the iPads'. This PC is normally
  // online, so it waits for the server's answer; offline, or when the answer is slow,
  // the counts stay saved on this PC and are recorded when the connection is back.
  // 'sent' or 'kept'; throws if the server refused them (nothing recorded).
  _mstRecorded(sid) { return (this._matStock.find(r => r._id === sid) || {}).qty; },
  async _mstSend(lines) {
    const parts = Count.queue(lines, this._mstCountedBy(), sid => this._mstRecorded(sid));
    if (this._connState.connected === false || navigator.onLine === false) return 'kept';
    try { await Promise.all(parts.map(p => DB.settle(p.id, p.done))); return 'sent'; }
    catch (e) { if (e && e.code === 'deadline-exceeded') return 'kept'; throw e; }
  },

  async mstTickItem(id) {
    if (this._mstTickBusy.has(id)) return;
    if (!Count.ready(this.mstGet(id), this.mstModeOf(id))) return;
    const m = this.materials.find(x => x.id == id); if (!m) return;
    this._mstTickBusy.add(id);
    try {
      const how = await this._mstSend([this._mstPayload(m)]);
      delete this._mstCart[id]; delete this._mstModes[id];
      this._updateMstBadge(); this.renderStocktakeCount();
      if (how === 'kept') toast('Count saved on this PC. It is recorded when the connection is back.');
    } catch(e) {
      console.error('Count not recorded:', e);
      const why = whyFailed(e);
      Ask.tell('Count not recorded', `${why[0].toUpperCase()}${why.slice(1)}. Tap the tick to try again.`);
    } finally { this._mstTickBusy.delete(id); }
  },

  mstOpenReview() {
    if (this.mstCount() === 0) { toast('No counts entered yet', true); return; }
    const items = this.mstItems();
    const lines = items.map(i => {
      return `<div class="stocktake-row"><div class="stocktake-row-info"><div class="stocktake-row-name">${descHtml(i.description)}</div></div>
        <div class="stocktake-qty" style="color:${Count.colour(i.stMode)}">${esc(Count.words(i.stMode, i.qty, stocktakeUnit(i)))}</div></div>`;
    }).join('');
    const ow = document.getElementById('overlay-wrap');
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card" style="max-width:420px">
          <div class="success-icon blue"><i class="ti ti-clipboard-check"></i></div>
          <h3>Submit stocktake</h3>
          <p style="margin-bottom:8px">${items.length} item${items.length!==1?'s':''} · recorded as <strong>${esc(this._mstCountedBy())}</strong></p>
          <div style="display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;text-align:left;margin-bottom:12px">${lines}</div>
          <div class="inline-error" id="mst-error" role="alert" hidden style="margin-bottom:10px"></div>
          <button class="btn btn-primary" id="btn-mst-confirm" style="width:100%"><i class="ti ti-check"></i> Confirm stocktake</button>
          <button class="btn btn-outline" id="btn-mst-cancel" style="width:100%;margin-top:8px">Cancel</button>
        </div>
      </div>`;
    document.getElementById('btn-mst-confirm').addEventListener('click', () => this._mstSubmit());
    document.getElementById('btn-mst-cancel').addEventListener('click', () => { ow.innerHTML=''; });
  },

  async _mstSubmit() {
    if (this._mstBusy) return;
    const items = this.mstItems();
    if (!items.length) { document.getElementById('overlay-wrap').innerHTML=''; return; }
    this._mstBusy = true;
    inlineError('mst-error', '');
    const btn = document.getElementById('btn-mst-confirm'), cancel = document.getElementById('btn-mst-cancel');
    if (cancel) cancel.disabled = true;
    if (btn) { btn.disabled = true; btn.innerHTML = `<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Saving ${items.length} count${items.length !== 1 ? 's' : ''}…`; }
    try {
      const how = await this._mstSend(items.map(m => this._mstPayload(m)));
      this._mstCart = {}; this._mstModes = {};
      this._updateMstBadge(); this.renderStocktakeCount();
      const ow = document.getElementById('overlay-wrap'), n = `${items.length} item${items.length!==1?'s':''}`;
      ow.innerHTML = `
        <div class="success-overlay">
          <div class="success-card">
            <div class="success-icon green"><i class="ti ti-circle-check"></i></div>
            <h3>${how === 'sent' ? 'Stocktake submitted' : 'Stocktake saved'}</h3>
            <p>${how === 'sent' ? `${n} recorded.` : `${n} saved on this PC. They are recorded when the connection is back.`}</p>
            <button class="btn btn-primary" id="btn-mst-done">Back to stocktake</button>
          </div>
        </div>`;
      document.getElementById('btn-mst-done').addEventListener('click', () => { ow.innerHTML=''; });
    } catch(e) {
      console.error('Stocktake not saved:', e);
      if (cancel) cancel.disabled = false;
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Confirm stocktake'; }
      inlineError('mst-error', `Not saved: ${whyFailed(e)}.${nothingDone(e, 'Nothing was recorded.')} Tap Confirm stocktake to try again.`);
    } finally { this._mstBusy = false; }
  },

  async renderStocktakeHistory() {
    const el = document.getElementById('stocktake-history-list'); if (!el) return;
    if (!this._stSessionsLoaded && !this._stSessionsLoading) {
      this._stSessionsLoading = true;
      el.innerHTML = `<div class="empty-state"><i class="ti ti-loader" style="animation:spin 1s linear infinite"></i><p>Loading…</p></div>`;
      try {
        this._stSessions = await DB.fetchStocktakeSessions(100);
        this._stSessionsLoaded = true;
      } catch(e) {
        el.innerHTML = `<div class="empty-state"><i class="ti ti-alert-circle"></i><p>Stocktake history not loaded: ${esc(whyFailed(e))}. Open History again to retry.</p></div>`;
        this._stSessionsLoading = false;
        return;
      }
      this._stSessionsLoading = false;
    }
    if (!this._stSessions.length) { el.innerHTML = `<div class="empty-state"><i class="ti ti-clipboard-off"></i><p>No stocktakes submitted yet.</p></div>`; return; }
    // Sessions are one-per-device-per-day and can mix modes (a day of ticks +
    // submits), so the mode indicator lives on each line, not the session header.
    // A session's lines: the older `items` list, then `counts` (one per item, latest wins).
    const linesOf = s => {
      const by = new Map((s.items || []).map(i => [i.sid, i]));
      Object.values(s.counts || {}).sort((a, b) => (a.at || 0) - (b.at || 0)).forEach(c => { by.delete(c.sid); by.set(c.sid, c); });
      return [...by.values()];
    };
    el.innerHTML = this._stSessions.map(s => {
      const ts = s.submittedAt?.toDate ? fmtTime(s.submittedAt.toDate()) : '';
      const isOpen = this._openStSessions.has(s._id);
      const lines = linesOf(s), n = lines.length;
      return `<div class="stocktake-row" data-st-session="${esc(s._id)}" style="cursor:pointer;flex-wrap:wrap">
        <span class="intake-status-badge" style="color:var(--text2);background:var(--bg2)"><i class="ti ti-clipboard-list"></i> Stocktake</span>
        <div class="stocktake-row-info">
          <div class="stocktake-row-name">${esc(s.deviceName || 'Unknown device')}</div>
          <div class="stocktake-row-meta">${ts} · ${n} item${n !== 1 ? 's' : ''}</div>
        </div>
        <i class="ti ${isOpen ? 'ti-chevron-up' : 'ti-chevron-down'}" style="color:var(--text3)"></i>
        ${isOpen ? `<div style="flex-basis:100%;padding-top:8px;border-top:1px solid var(--border);margin-top:6px">
          ${lines.map(i => `<div class="stocktake-row-meta" style="padding:2px 0">${descHtml(i.description)} — <strong style="color:${Count.colour(i.mode)}">${esc(Count.words(i.mode, i.qty, i.unit || ''))}</strong></div>`).join('')}
        </div>` : ''}
      </div>`;
    }).join('');
  },

  // Builds and downloads the stocktake Excel file. blank=true → empty QTY cells for
  // printing off and writing on by hand. Formatting mirrors the accounting system's
  // stocktake template: navy header band with white bold text, bold Calibri data
  // cells, Tahoma 9 QTY column, thin borders, wide description column.
  // Grouping checkbox ON → category/subcategory section rows; OFF → flat, sorted by code.
  // Both export buttons open the same options first: which categories go in
  // the sheet. The unticked ones are remembered on this device.
  _stExportSkipped() {
    try { const a = JSON.parse(localStorage.getItem('mo_st_export_skip') || '[]'); return new Set(Array.isArray(a) ? a : []); }
    catch { return new Set(); }
  },
  openStocktakeExport(blank) {
    if (typeof XLSX === 'undefined') { Ask.tell('Not exported', 'The export part of this page did not load. Refresh the page, then try again.'); return; }
    const cats = Data.categories(this.materials);
    const skipped = this._stExportSkipped();
    const ow = document.getElementById('overlay-wrap');
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card st-export-card" style="max-width:380px;text-align:left">
          <h3 style="text-align:center">${blank ? 'Export blank count sheet' : 'Export stocktake'}</h3>
          <div class="st-export-tools"><span>Categories</span><button class="btn-sm" id="st-exp-all">All</button><button class="btn-sm" id="st-exp-none">None</button></div>
          <div class="st-export-cats">
            ${cats.map((c, i) => `<label class="cat-check"><input type="checkbox" data-st-exp-cat="${i}"${skipped.has(c) ? '' : ' checked'}><span>${esc(c)} <em>· ${this.materials.filter(m => m.category === c).length}</em></span></label>`).join('')}
          </div>
          <button class="btn btn-primary" id="st-exp-go" style="width:100%;margin-top:16px"><i class="ti ti-file-spreadsheet"></i> Export</button>
          <button class="btn btn-outline" id="st-exp-cancel" style="width:100%;margin-top:8px">Cancel</button>
        </div>
      </div>`;
    const boxes = () => [...ow.querySelectorAll('[data-st-exp-cat]')];
    const sync  = () => { document.getElementById('st-exp-go').disabled = !boxes().some(b => b.checked); };
    const setAll = on => { boxes().forEach(b => { b.checked = on; }); sync(); };
    ow.querySelector('.st-export-cats').addEventListener('change', sync);
    document.getElementById('st-exp-all').addEventListener('click', () => setAll(true));
    document.getElementById('st-exp-none').addEventListener('click', () => setAll(false));
    document.getElementById('st-exp-cancel').addEventListener('click', () => { ow.innerHTML = ''; });
    document.getElementById('st-exp-go').addEventListener('click', () => {
      const skip = new Set(boxes().filter(b => !b.checked).map(b => cats[+b.dataset.stExpCat]));
      try { localStorage.setItem('mo_st_export_skip', JSON.stringify([...skip])); } catch {}
      ow.innerHTML = '';
      this.exportStocktake(blank, skip);
    });
    sync();
  },

  exportStocktake(blank, skip) {
    if (typeof XLSX === 'undefined') { Ask.tell('Not exported', 'The export part of this page did not load. Refresh the page, then try again.'); return; }
    const grouped = document.getElementById('st-export-grouped')?.checked !== false;
    const wb = this._stocktakeWorkbook(blank, grouped, skip || new Set());
    const d = new Date(), date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    XLSX.writeFile(wb, `Stocktake${blank ? '_blank' : ''}_${date}.xlsx`);
  },
  // The sheet: Code · Description · Base Unit · QTY and — on the filled export
  // only — the date each quantity was last updated, written as a real Excel
  // date (dd/mm/yyyy) so the column sorts and filters. skip: Set of category
  // names left out.
  _stocktakeWorkbook(blank, grouped, skip) {
    const stockMap = this._stStockMap();
    const items = this.materials.filter(m => !skip.has(m.category));
    if (grouped) {
      items.sort((a,b) => naturalCompare(a.category,b.category) || naturalCompare(a.subcategory,b.subcategory) || descCompare(a.description,b.description));
    } else {
      items.sort((a,b) => naturalCompare(a.partCode || '', b.partCode || ''));
    }

    const thin = { style: 'thin', color: { rgb: '000000' } };
    const BORDER    = { top: thin, bottom: thin, left: thin, right: thin };
    const S_HEADER  = { font: { name: 'Calibri', sz: 11, bold: true, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: '000080' } }, border: BORDER };
    const S_SECTION = { font: { name: 'Calibri', sz: 11, bold: true }, fill: { patternType: 'solid', fgColor: { rgb: 'D9D9D9' } }, border: BORDER };
    const S_CELL    = { font: { name: 'Calibri', sz: 11, bold: true }, border: BORDER };
    const S_QTY     = { font: { name: 'Tahoma', sz: 9 }, border: BORDER };
    const DATE_FMT  = 'dd/mm/yyyy';
    const S_DATE    = { ...S_QTY, numFmt: DATE_FMT };
    // Excel's day number for a local calendar date (no time of day).
    const excelDay  = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000);

    const head = blank ? ['Code', 'Description', 'Base Unit', 'QTY'] : ['Code', 'Description', 'Base Unit', 'QTY', 'Last Updated'];
    const last = head.length - 1;
    const rows = [], merges = [];
    rows.push(head.map(v => ({ v, t: 's', s: S_HEADER })));
    let lastSection = null;
    for (const m of items) {
      if (grouped) {
        const section = `${m.category}${m.subcategory && m.subcategory !== 'General' ? ' — ' + m.subcategory : ''}`;
        if (section !== lastSection) {
          merges.push({ s: { r: rows.length, c: 0 }, e: { r: rows.length, c: last } });
          rows.push(head.map((_, c) => ({ v: c === 0 ? section : '', t: 's', s: S_SECTION })));
          lastSection = section;
        }
      }
      const rec = stockMap.get(stockId(m));
      const code = m.partCode && !Data.isDummyCode(m.partCode) ? m.partCode : '';
      const qty = blank ? '' : (rec && rec.qty != null ? rec.qty : '');
      const row = [
        { v: code, t: 's', s: S_CELL },
        { v: m.description, t: 's', s: S_CELL },
        { v: stocktakeUnit(m), t: 's', s: S_CELL },
        qty === '' ? { v: '', t: 's', s: S_QTY } : { v: qty, t: 'n', s: S_QTY },
      ];
      if (!blank) {
        const at = countedWhen(rec), when = qty !== '' && at && at.toDate ? at.toDate() : null;
        row.push(when ? { v: excelDay(when), t: 'n', z: DATE_FMT, s: S_DATE } : { v: '', t: 's', s: S_QTY });
      }
      rows.push(row);
    }
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, { wch: 40 }, { wch: 10 }, { wch: 9 }, ...(blank ? [] : [{ wch: 13 }])];
    ws['!merges'] = merges;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Stocktake');
    return wb;
  },

  // ══════════════════════════════════════════
  // QUEUE
  // ══════════════════════════════════════════
  // An "order" is a submission from the materials/consumables ordering pages — it
  // belongs in Pending as long as it still has at least one item that hasn't been
  // turned into a delivery (emailed) or rejected. Computed live from item state
  // rather than the stored `status` field, since `status` is only ever updated by
  // the specific action that changes it (e.g. markLinesEmailed) — the Sent tab's
  // per-delivery grouping already works this way; this keeps the order-card list
  // and the pending-count badge consistent with it instead of trusting a field that
  // can go stale (e.g. legacy orders from before category-based sending existed).
  _orderHasPendingItems(o) {
    if (o.status === 'rejected') return false;
    return (o.items || []).some(i => !i.emailed && !i.rejected);
  },
  _orderIsFullySent(o) {
    if (o.status === 'rejected') return false;
    const items = o.items || [];
    if (!items.length) return false;
    return items.some(i => i.emailed) && !items.some(i => !i.emailed && !i.rejected);
  },
  // The Order Queue is a MATERIALS view — consumables orders (saved by the CO panel,
  // possibly with un-emailed categories) must never appear here or they'd get emailed
  // through the materials flow with a "Material Order" subject.
  _materialsOrders() {
    return this.orders.filter(o => !o.type || o.type === 'materials');
  },

  setView(v) {
    this.activeView = v;
    document.querySelectorAll('[data-sb]').forEach(b => b.classList.toggle('active', b.dataset.sb === v));
    document.querySelectorAll('#mobile-tabs [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    this.renderQueue();
  },

  startListening() {
    if (this.unsubscribe) this.unsubscribe();
    this.unsubscribe = DB.listenOrders((orders, fromCache) => {
      this.orders = orders;
      this._ordersFromCache = !!fromCache;
      if (!fromCache || orders.length) this._ordersReady = true;
      setTimeout(() => Intake.flushWaiting(this._intakeHost()));   // anything saved here offline, once connected
      this._tidyStaged();
      this._settleOwed();
      const n = this._materialsOrders().filter(o => this._orderHasPendingItems(o)).length;
      ['pending-count','mob-pending-count','queue-pending-badge'].forEach(id => {
        const el = document.getElementById(id);
        if (el) { setCount(el, n); }
      });

      // New order notification — seed on first call, then detect arrivals.
      // _pendingWrite means the doc was just written by THIS device (latency-
      // compensated local snapshot, pre server-ack) — i.e. the manager created it
      // themselves, so it never counts as "new". It still gets added to _seenOrderIds
      // here, which also covers the later server-ack snapshot for the same doc.
      if (this._seenOrderIds === null) {
        this._seenOrderIds = new Set(orders.map(o => o._id));
      } else {
        let newInBatch = 0;
        for (const order of orders) {
          if (!this._seenOrderIds.has(order._id) && !this._myOrderIds.has(order._id) && !order._pendingWrite) {
            newInBatch++;
            if (this.mainTab !== 'queue') this._newOrderCount++;
          }
          this._seenOrderIds.add(order._id);
        }
        if (newInBatch > 0 && 'Notification' in window && Notification.permission === 'granted') {
          new Notification(newInBatch === 1 ? 'New order received' : `${newInBatch} new orders received`, {
            body: 'Open the queue to review.',
            icon: './icons/icon-192.png',
          });
        }
        this._updateNewOrderDot();
      }

      this._updateDeliveryBadges();
      this.renderQueue();
      if (this.mainTab === 'intake-mat')  this.renderIntakeMat();
      if (this.mainTab === 'intake-cons') this.renderIntakeCons();
    });
  },

  _updateNewOrderDot() {
    const dot = document.getElementById('new-order-dot');
    const tab = document.getElementById('main-tab-queue');
    if (dot) dot.style.display = this._newOrderCount > 0 ? 'block' : 'none';
    if (tab) tab.classList.toggle('has-new-order', this._newOrderCount > 0);
  },

  _updateDeliveryBadges() {
    const countOutstanding = type => {
      const groups = Intake.buildCategoryGroups(this.orders, type);
      let count = 0;
      for (const g of groups) {
        const status = Intake.computeCategoryStatusEntries(g.entries);
        if (!Intake.TAB_RESOLVED.has(status)) { count++; continue; }
        const hasBO = g.entries.some(({ order, item }) => Intake.outstandingOf(order, item) > 0);
        if (hasBO) count++;
      }
      return count;
    };
    const matN = countOutstanding('materials');
    const consN = countOutstanding('consumables');
    const mb = document.getElementById('deliveries-mat-badge');
    const cb = document.getElementById('deliveries-cons-badge');
    setCount(mb, matN);
    setCount(cb, consN);

    // Short deliveries with no explanation — surfaced separately from the outstanding
    // count, since they're a "chase purchasing" job rather than something to receive.
    const countFollowUp = type => Intake.buildCategoryGroups(this.orders, type)
      .filter(g => Intake.deliveryNeedsFollowUp(g.entries)).length;
    [['materials', 'followup-mat-badge'], ['consumables', 'followup-cons-badge']].forEach(([type, id]) => {
      const el = document.getElementById(id); if (!el) return;
      const n = countFollowUp(type);
      el.innerHTML = `<i class="ti ti-alert-triangle"></i>${n > 99 ? '99+' : n}`;
      el.style.display = n > 0 ? '' : 'none';
    });
  },

  // Nothing left to send. The tick draws once, when the queue empties in front of the
  // manager; opened empty, it is simply there. Behind the email question it waits, so it
  // draws as the question closes. A redraw never restarts or cuts a tick already drawing.
  _renderQueueClear(wrap) {
    const state = !this._queueHadPending ? 'still' : this._emailOpen ? 'wait' : 'play';
    const cur = wrap.querySelector(':scope > .queue-clear');
    if (cur && state !== 'play' && (state === 'wait' || cur.dataset.state !== 'wait')) return;
    if (state === 'play') this._queueHadPending = false;
    wrap.innerHTML = `<div class="empty-queue queue-clear" data-state="${state}">
      <div class="success-icon green clear-tick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9" pathLength="1"/></svg></div>
      <p>No more pending orders.</p></div>`;
  },

  renderQueue() {
