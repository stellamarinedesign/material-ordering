        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">To (purchasing)</div><div class="settings-row-sub">Auto-filled in To: field</div></div>
            <input type="email" id="s-supplier" value="${esc(s.supplierEmail)}">
          </div>
          <div class="settings-row">
            <div><div class="settings-row-label">CC email</div><div class="settings-row-sub">Always CC'd</div></div>
            <input type="email" id="s-cc" value="${esc(s.ccEmail)}">
          </div>
          <div class="settings-row">
            <div><div class="settings-row-label">Subject template</div><div class="settings-row-sub">{category} {date} available</div></div>
            <input type="text" id="s-subject" value="${esc(s.emailSubject||DEFAULT_SETTINGS.emailSubject)}">
          </div>
          <div class="settings-row">
            <div><div class="settings-row-label">Bulk consumables subject</div><div class="settings-row-sub">Used when emailing all consumables at once</div></div>
            <input type="text" id="s-bulk-subject" value="${esc(s.bulkConsumablesSubject||DEFAULT_SETTINGS.bulkConsumablesSubject)}">
          </div>
          <div class="settings-row">
            <div><div class="settings-row-label">Closing note</div><div class="settings-row-sub">Added after items</div></div>
            <input type="text" id="s-delivery" value="${esc(s.deliveryNote)}">
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Email signature</div>
        <div class="settings-card">
          <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
            <div class="settings-row-sub">
              Appended to every email body. Use this to include your sign-off since Outlook Classic does not auto-insert signatures into mailto-generated emails.
            </div>
            <textarea id="s-signature" rows="5"
              style="width:100%;border:1px solid var(--border);background:var(--bg);border-radius:var(--radius);
              padding:8px 10px;font-size:13px;color:var(--text);font-family:var(--font);line-height:1.6;
              resize:vertical;outline:none" placeholder="Kind regards,&#10;Your Name&#10;Your Company">${esc(s.emailSignature||'')}</textarea>
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Email template</div>
        <div class="settings-card">
          <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
            <div class="settings-row-sub">
              Placeholders:
              <code style="font-family:var(--mono);font-size:11px;background:var(--bg2);padding:1px 4px;border-radius:3px">{orderType}</code>
              <code style="font-family:var(--mono);font-size:11px;background:var(--bg2);padding:1px 4px;border-radius:3px">{date}</code>
              <code style="font-family:var(--mono);font-size:11px;background:var(--bg2);padding:1px 4px;border-radius:3px">{category}</code>
              <code style="font-family:var(--mono);font-size:11px;background:var(--bg2);padding:1px 4px;border-radius:3px">{items}</code>
              <code style="font-family:var(--mono);font-size:11px;background:var(--bg2);padding:1px 4px;border-radius:3px">{closingNote}</code>
              — all work in subject and body. <code style="font-family:var(--mono);font-size:11px;background:var(--bg2);padding:1px 4px;border-radius:3px">{orderType}</code> resolves to "Material Order" or "Consumables Order" automatically.
            </div>
            <textarea id="s-template" rows="10"
              style="width:100%;border:1px solid var(--border);background:var(--bg);border-radius:var(--radius);
              padding:8px 10px;font-size:12px;color:var(--text);font-family:var(--mono);line-height:1.6;
              resize:vertical;outline:none">${esc(s.emailTemplate||DEFAULT_SETTINGS.emailTemplate)}</textarea>
            <button class="btn-sm" id="btn-reset-template" style="align-self:flex-end">Reset to default</button>
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Materials catalogue</div>
        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">Materials the workshop can order</div><div class="settings-row-sub" id="cat-settings-sub">${esc(Catalogue.summary())}</div></div>
            <button class="btn-sm" id="btn-open-catalogue">Open catalogue</button>
          </div>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Notifications</div>
        <div class="settings-card">
          ${(() => {
            if (!('Notification' in window)) {
              return `<div class="settings-row"><div><div class="settings-row-label">System notifications</div><div class="settings-row-sub">Not supported in this browser.</div></div></div>`;
            }
            const perm = Notification.permission;
            if (perm === 'granted') {
              return `<div class="settings-row">
                <div><div class="settings-row-label">System notifications</div><div class="settings-row-sub" style="color:var(--green-text)">Enabled — you'll receive alerts for new orders.</div></div>
                <button class="btn-sm" id="btn-test-notif">Send a test</button>
              </div>`;
            }
            if (perm === 'denied') {
              return `<div class="settings-row"><div><div class="settings-row-label">System notifications</div><div class="settings-row-sub" style="color:var(--red-text)">Blocked — open browser site settings to allow notifications for this page.</div></div></div>`;
            }
            return `<div class="settings-row">
              <div><div class="settings-row-label">System notifications</div><div class="settings-row-sub">Not yet enabled. Allow to receive alerts when new orders arrive.</div></div>
              <button class="btn-sm btn-sm-save" id="btn-enable-notif">Turn on notifications</button>
            </div>`;
          })()}
        </div>
      </div>
      <div class="settings-section" data-master-only ${Auth.isMaster() ? "" : "hidden"}>
        <div class="settings-label">Database</div>
        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">Test mode</div><div class="settings-row-sub">${FirebaseConfig.isTestMode() ? 'Connected to test database — click to return to production.' : 'Switch to a separate test Firebase project.'}</div></div>
            <button class="btn-sm ${FirebaseConfig.isTestMode() ? 'btn-sm-danger' : ''}" id="btn-mgr-toggle-test">${FirebaseConfig.isTestMode() ? 'Exit test mode' : 'Enter test mode'}</button>
          </div>
        </div>
      </div>
      ${FirebaseConfig.isTestMode() ? `<div class="settings-section" data-master-only ${Auth.isMaster() ? "" : "hidden"}>
        <div class="settings-label">Testing</div>
        <div class="settings-card">
          <div class="settings-row">
            <div><div class="settings-row-label">Delete all orders</div><div class="settings-row-sub">Test database only</div></div>
            <button class="btn-sm btn-sm-danger" id="btn-clear-orders">Delete all orders</button>
          </div>
        </div>
      </div>` : ''}`;

    document.getElementById('btn-open-catalogue').addEventListener('click', () => Catalogue.open());
    document.getElementById('btn-enable-notif')?.addEventListener('click', async () => {
      const result = await Notification.requestPermission();
      if (result === 'granted') this._populateSettings();
      else Ask.tell('Notifications are blocked', 'Allow them for this site in the browser settings.');
    });
    document.getElementById('btn-test-notif')?.addEventListener('click', () => {
      try { new Notification('Test notification', { body: 'System notifications are working.', icon: './icons/icon-192.png' }); }
      catch(e) { console.error(e); Ask.tell('Not shown', 'This browser refused the notification.'); }
    });
    document.getElementById('btn-mgr-toggle-test').addEventListener('click', () => { FirebaseConfig.setTestMode(!FirebaseConfig.isTestMode()); location.reload(); });
    document.getElementById('btn-reset-template').addEventListener('click', () => {
      const ta = document.getElementById('s-template'); if (!ta) return;
      ta.value = DEFAULT_SETTINGS.emailTemplate; ta.dispatchEvent(new Event('change', { bubbles: true }));
    });
    // Each setting applies as it is changed: nothing to save, and Back loses nothing.
    const text = { 's-supplier': 'supplierEmail', 's-cc': 'ccEmail', 's-subject': 'emailSubject', 's-bulk-subject': 'bulkConsumablesSubject',
                   's-delivery': 'deliveryNote', 's-signature': 'emailSignature', 's-template': 'emailTemplate' };
    for (const [id, key] of Object.entries(text)) {
      const f = document.getElementById(id); if (!f) continue;
      f.addEventListener('change', () => { Settings.save({ [key]: f.tagName === 'TEXTAREA' ? f.value : f.value.trim() }); f.defaultValue = f.value; });
    }
    const mn = document.getElementById('s-manager-name');
    mn.addEventListener('change', () => { ManagerDeviceName.save(mn.value); mn.defaultValue = mn.value; });
    document.getElementById('s-theme').addEventListener('change', e => Theme.set(e.target.value));
    for (const [id, key] of [['s-natural-sort', 'naturalSort'], ['s-fraction-glyphs', 'fractionGlyphs'], ['s-unit-search', 'unitAwareSearch'], ['s-fuzzy-search', 'fuzzySearch']])
      document.getElementById(id).addEventListener('change', e => {
        Settings.save({ [key]: e.target.checked });
        this.renderQueue(); this.renderNoList(); this.renderCoList(); this.renderReceiveList(); this.renderStockList();
      });
    document.querySelectorAll('#settings-body input[type=text], #settings-body input[type=email]').forEach(f =>
      f.addEventListener('keydown', e => { if (e.key === 'Enter' && !f.id.startsWith('acct-')) f.blur(); }));
    document.getElementById('btn-clear-orders')?.addEventListener('click', async () => {
      if (!await Ask.confirm({ title: 'Delete every order in the test database?', body: 'This cannot be undone.', yes: 'Delete all orders', no: 'Keep orders', danger: true })) return;
      try { await DB.deleteAllOrders(); this._toast('All test orders deleted'); }
      catch(e) { console.error(e); this._toast(`Not deleted: ${whyFailed(e)}`, true); }
    });
  },

};

document.addEventListener('DOMContentLoaded', () => Manager.init());
</script>
</body>
</html>
