  startStockListening() {
    if (this._unsubStock) this._unsubStock();
    this._unsubStock = DB.listenStock((records, fromCache) => {
      this._stock = records;
      if (!fromCache || records.length) this._stockReady = true;
      // Fold in ghosts (items created on-device, CSV row pending) so every panel
      // — stock, ordering, barcodes — treats them as real consumables.
      this.consumables = GhostItems.merge(this._baseConsumables, records);
      this._fillCarts();
      this._reconcileGhosts(records);
      this.renderStockTabs();
      this.renderStockList();
      this._updateStockBadge();
      // These panels grey/sort items by tracked status, so they need to refresh
      // whenever stock data changes too — not just the Stock tab itself.
      this.renderCoList();
      this.renderReceiveList();
      if (document.getElementById('barcodes-panel')?.classList.contains('open')) this.renderBarcodesPanel();
    });
  },

  // One-shot per session: any ghost whose consumables.csv row has since been added
  // gets folded into the catalog — matched by SC code first (survives a description
  // edit in the CSV), then by doc id (description kept verbatim) — clearing the
  // ghost marker and, where the description or code changed, migrating the stock
  // doc so quantity/barcodes/log follow the item. If BOTH the code and the
  // description were changed in the CSV, the ghost can't be matched automatically
  // and stays listed until cleaned up by hand.
  async _reconcileGhosts(records) {
    if (this._ghostsReconciled) return;
    const jobs = [];
    for (const rec of records) {
      const g = rec.ghost; if (!g) continue;
      const byCode = g.partCode
        ? this._baseConsumables.find(m => (m.partCode || '').toLowerCase() === g.partCode.toLowerCase())
        : null;
      const match = byCode || this._baseConsumables.find(m => stockId(m) === rec._id);
      if (match) jobs.push({ oldSid: rec._id, newSid: stockId(match) });
    }
    if (!jobs.length) return;
    this._ghostsReconciled = true;
    try {
      for (const j of jobs) await DB.resolveGhost(j.oldSid, j.newSid);
      this._toast(`${jobs.length} new item${jobs.length > 1 ? 's' : ''} merged into the catalog`);
    } catch (e) {
      console.warn('Ghost reconcile failed:', e);
      this._ghostsReconciled = false; // retry on the next snapshot
    }
  },

  // Returns the stock record for a given stockId, or null
  _stockFor(sid) { return this._stock.find(r => r._id === sid) || null; },

  // Classify a tracked item: 'count' | 'zero' | 'critical' | 'warning' | 'ok'.
  // 'count': below zero. The door iPad signs out what people are holding, so more went
  // out than was recorded: the shelf needs counting (Set stock clears it).
  _stockStatus(rec) {
    if (!rec || !rec.tracked) return 'untracked';
    const qty = rec.qty || 0;
    if (qty < 0) return 'count';
    if (qty === 0) return 'zero';
    if (rec.warningQty > 0 && qty <= rec.warningQty) return qty <= (rec.reorderQty||0) ? 'critical' : 'warning';
    return 'ok';
  },
  // Wants the manager: low on stock, or needing a count. The Low stock tab, its count and the banner.
  _stockNeedsYou(rec) {
    return !!rec && rec.tracked && ((rec.qty || 0) < 0 || (rec.warningQty > 0 && (rec.qty || 0) <= rec.warningQty));
  },

  _updateStockBadge() {
    const recs = this.consumables.map(m => this._stockFor(stockId(m))).filter(r => this._stockNeedsYou(r));
    const all = recs.length, count = recs.filter(r => (r.qty || 0) < 0).length, low = all - count;
    const badge = document.getElementById('stock-low-badge');
    if (badge) { setCount(badge, all); }
    const banner = document.getElementById('stock-low-banner');
    const bannerText = document.getElementById('stock-low-text');
    if (banner && bannerText) {
      banner.style.display = all > 0 && this._stockActiveCat !== '__low__' ? 'flex' : 'none';
      bannerText.textContent = [
        count ? `${count} item${count !== 1 ? 's' : ''} need${count === 1 ? 's' : ''} a count` : '',
        low ? `${low} item${low !== 1 ? 's' : ''} low on stock` : '',
      ].filter(Boolean).join(' · ');
    }
  },

  renderStockTabs() {
    const wrap = document.getElementById('stock-tabs-wrap'); if (!wrap) return;
    const cats = Data.categories(this.consumables);
    const lowItems = this.consumables.filter(m => this._stockNeedsYou(this._stockFor(stockId(m))));
    const lowCount = lowItems.length;
    const catBtns = cats.map(c => `<button class="tab ${this._stockActiveCat===c?'active':''}" data-stock-cat="${esc(c)}">${esc(c)}</button>`).join('');
    wrap.innerHTML = `<div class="tabs-bar"><div class="tabs-inner">
      <button class="tab ${!this._stockActiveCat?'active':''}" data-stock-cat="__all__">All</button>
      <button class="tab ${this._stockActiveCat==='__low__'?'active':''}" data-stock-cat="__low__" style="${lowCount>0?'color:var(--amber-text)':''}">
        <i class="ti ti-alert-triangle" style="font-size:12px"></i> Low stock${lowCount>0?` (${lowCount})`:''}
      </button>
      ${catBtns}
    </div></div>`;

    // Subcategory tabs — only when a real category (not All/Low Stock) is selected
    let subHtml = '';
    if (this._stockActiveCat && this._stockActiveCat !== '__low__') {
      this._stockSubs = Data.subcategories(this.consumables, this._stockActiveCat);
      if (this._stockSubs.length) {
        const subBtns = this._stockSubs.map(s => `<button class="tab ${this._stockActiveSub===s?'active':''}" data-stock-sub="${esc(s)}">${esc(s)}</button>`).join('');
        subHtml = `<div class="tabs-bar sub-bar"><div class="tabs-inner"><button class="tab ${!this._stockActiveSub?'active':''}" data-stock-sub="__all__">All</button>${subBtns}</div></div>`;
      }
    } else {
      this._stockSubs = [];
    }
    wrap.innerHTML += subHtml;
    wrap.querySelectorAll('.tabs-inner').forEach((el, i) => Strip.watch(el, `stock:${i ? this._stockActiveCat : ''}`));
    this._updateStockBadge();   // the banner leads to Low stock, so it goes while that is shown

    // Reorder All button — only visible on the Low Stock tab, and only when at least one item has a reorder qty set
    const reorderBtn = document.getElementById('btn-reorder-all');
    if (reorderBtn) {
      const canReorder = this._stockActiveCat === '__low__' && lowItems.some(m => (this._stockFor(stockId(m))?.reorderQty||0) > 0);
      reorderBtn.style.display = canReorder ? '' : 'none';
    }
  },

  renderStockList() {
    const list = document.getElementById('stock-list'); if (!list) return;
    if (!this._stockReady) { list.innerHTML = skeleton(8); return; }
    const q = document.getElementById('stock-search')?.value || '';
    let items = [...this.consumables];

    if (this._stockActiveCat === '__low__') {
      items = items.filter(m => this._stockNeedsYou(this._stockFor(stockId(m))));
    } else if (this._stockActiveCat) {
      items = items.filter(m => m.category === this._stockActiveCat);
      if (this._stockActiveSub) items = items.filter(m => m.subcategory === this._stockActiveSub);
    }
    let note = '';
    if (q.trim()) { const found = Data.filter(items, null, null, q); note = searchNote(found, q); items = [...found]; }

    // Sort: count needed → out → reorder → low → ok → untracked
    const order = { count:0, zero:1, critical:2, warning:3, ok:4, untracked:5 };   // what needs you first
    items.sort((a, b) => {
      const ra = this._stockFor(stockId(a)), rb = this._stockFor(stockId(b));
      const sa = this._stockStatus(ra), sb = this._stockStatus(rb);
      return (order[sa]??5) - (order[sb]??5) || descCompare(a.description, b.description);
    });

    if (!items.length) { list.innerHTML = note || `<div class="empty-state"><i class="ti ti-package-off"></i><p>${this._stockActiveCat === '__low__' ? 'Nothing is low on stock.' : 'No consumables in this category.'}</p></div>`; return; }

    // Group by tracked / untracked with section headers (skip grouping on the Low Stock tab — already filtered)
    let html = '';
    if (this._stockActiveCat === '__low__') {
      html = items.map(m => this._stockCard(m)).join('');
    } else {
      const tracked   = items.filter(m => { const r=this._stockFor(stockId(m)); return r?.tracked; });
      const untracked = items.filter(m => { const r=this._stockFor(stockId(m)); return !r?.tracked; });
      if (tracked.length) {
        html += `<div class="stock-section-header">Tracked (${tracked.length})</div>`;
        html += tracked.map(m => this._stockCard(m)).join('');
      }
      if (untracked.length) {
        html += `<div class="stock-section-header" style="margin-top:8px">Not yet tracked (${untracked.length})</div>`;
        html += untracked.map(m => this._stockCard(m)).join('');
      }
    }
    const restoreFocus = captureInputFocus(); // stock updates re-render mid-typing
    list.innerHTML = note + html;

    // Re-apply open state
    for (const sid of this._openStockCards) {
      const body = document.getElementById(`stock-body-${sid}`);
      const chev = document.getElementById(`stock-chev-${sid}`);
      if (body) { body.classList.add('open'); chev?.classList.add('open'); }
    }
    restoreFocus();
    this._showMovedCard(list);
  },
  // After a change re-sorts the list: bring the card into view and mark it once.
  _showMovedCard(list) {
    const t = this._stockTouched;
    if (!t || Date.now() - t.at > 6000) return;
    const card = document.getElementById(t.id);
    if (!card) return;
    const at = [...list.querySelectorAll('.stock-card')].indexOf(card);
    if (at === t.index) return;
    this._stockTouched = null;
    card.scrollIntoView({ block: 'nearest' });
    card.classList.add('moved');
  },

  // Empties a stock card's field once its amount has been used. By id, after the write:
  // the list may have been redrawn (and the typed amount put back) while it was going,
  // and an amount left in the box invites a second tap.
  _usedField(...ids) { ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; }); },

  _stockCard(m) {
    const sid  = stockId(m);
    const rec  = this._stockFor(sid);
    const tracked = rec?.tracked || false;
    const status  = this._stockStatus(rec);
    const qty     = rec?.qty ?? 0;
    const ci      = CAT_ICONS[m.category] || CAT_ICONS.default;
    const showCode = m.partCode && !Data.isDummyCode(m.partCode);
    const isOpen  = this._openStockCards.has(sid);
    const isBoxed = hasBoxTracking(m);

    const badgeClass = status === 'ok' ? '' : status === 'zero' ? ' zero' : status === 'warning' ? ' warning' : status === 'critical' || status === 'count' ? ' critical' : ' zero';
    const cardClass  = status === 'untracked' ? ' untracked' : status === 'warning' ? ' warning' : status === 'critical' || status === 'count' ? ' critical' : status === 'zero' ? ' zero' : '';

    const word = { count: `Count needed · −${round2(-qty)}`, zero: 'Out of stock', critical: `Reorder · ${boxDisplay(m, qty)}`, warning: `Low · ${boxDisplay(m, qty)}` }[status];
    const qtyBadge = tracked
      ? `<span class="stock-qty-badge${badgeClass}">${esc(word || boxDisplay(m, qty))}</span>`
      : `<span style="font-size:11px;color:var(--text3);font-family:var(--mono)">Not tracked</span>`;

    // Boxed items get a box-centric workflow (add whole boxes, override by boxes+loose,
    // and a quick "open new box" stocktake action) since that's how warehouse stock is
    // actually handled — tracking individual units one at a time is rare in practice.
    const wholeBoxes  = isBoxed ? Math.floor(Math.max(0, qty) / m.boxSize) : 0;
    const looseUnits  = isBoxed ? Math.max(0, qty) % m.boxSize : 0;

    const boxedIntakeRow = `
          <div class="stock-action-row">
            <span class="stock-action-label">Add stock</span>
            <input class="stock-delta-input" type="number" min="1" step="1" inputmode="numeric" placeholder="${esc(m.boxUnit||'Box')}es" id="si-intake-box-${esc(sid)}">
            <span style="font-size:11px;color:var(--text3)">${esc(m.boxUnit||'Box')}(es)</span>
            <button class="btn-sm" data-stock-intake-boxn="${esc(sid)}"><i class="ti ti-plus"></i> Add</button>
            <button class="btn-sm" data-stock-hist="${esc(sid)}" data-stock-name="${descHtml(m.description)}" style="margin-left:auto"><i class="ti ti-history"></i> History</button>
          </div>
          <div class="stock-action-row">
            <span class="stock-action-label">Remove stock</span>
            <input class="stock-delta-input" type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" id="si-remove-${esc(sid)}">
            <button class="btn-sm btn-sm-danger" data-stock-remove="${esc(sid)}"><i class="ti ti-minus"></i> Remove</button>
            <span style="font-size:10px;color:var(--text3)">individual units</span>
          </div>
          <div class="stock-action-row">
            <button class="btn-sm" data-stock-open-box="${esc(sid)}" title="Round down to whole boxes — use when a box runs low and you're opening a fresh one, or take away a full box if already at a whole number">
              <i class="ti ti-box-seam"></i> Open new box / remove full ${esc((m.boxUnit||'Box').toLowerCase())}
            </button>
          </div>
          <div class="stock-action-row">
            <span class="stock-action-label">Set absolute</span>
            <input class="stock-delta-input" type="number" min="0" step="1" inputmode="numeric" placeholder="${esc(m.boxUnit||'Box')}es" id="si-set-boxes-${esc(sid)}" style="width:56px">
            <span style="font-size:10px;color:var(--text3)">${esc(m.boxUnit||'Box')}(es) +</span>
            <input class="stock-delta-input" type="number" min="0" step="1" inputmode="numeric" placeholder="loose" id="si-set-loose-${esc(sid)}" style="width:56px">
            <span style="font-size:10px;color:var(--text3)">loose</span>
            <button class="btn-sm" data-stock-set-boxed="${esc(sid)}">Set stock</button>
          </div>`;

    const simpleIntakeRow = `
          <div class="stock-action-row">
            <span class="stock-action-label">Add stock</span>
            <input class="stock-delta-input" type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" id="si-intake-${esc(sid)}">
            <button class="btn-sm" data-stock-intake="${esc(sid)}"><i class="ti ti-plus"></i> Add</button>
            <button class="btn-sm" data-stock-hist="${esc(sid)}" data-stock-name="${descHtml(m.description)}" style="margin-left:auto"><i class="ti ti-history"></i> History</button>
          </div>
          <div class="stock-action-row">
            <span class="stock-action-label">Remove stock</span>
            <input class="stock-delta-input" type="number" min="1" step="1" inputmode="numeric" placeholder="Qty" id="si-remove-${esc(sid)}">
            <button class="btn-sm btn-sm-danger" data-stock-remove="${esc(sid)}"><i class="ti ti-minus"></i> Remove</button>
          </div>
          <div class="stock-action-row">
            <span class="stock-action-label">Set absolute</span>
            <input class="stock-delta-input" type="number" min="0" step="1" inputmode="numeric" placeholder="Qty" id="si-set-${esc(sid)}">
            <button class="btn-sm" data-stock-set="${esc(sid)}"><i class="ti ti-pencil"></i> Set stock</button>
          </div>`;

    const body = tracked ? `
      <div class="stock-card-body" id="stock-body-${esc(sid)}">
        <div class="stock-actions">
          ${isBoxed ? `<div style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:2px">${wholeBoxes} whole ${esc((m.boxUnit||'Box').toLowerCase())}${wholeBoxes!==1?'es':''}${looseUnits?` + ${looseUnits} loose`:''} · 1 ${esc(m.boxUnit||'Box')} = ${m.boxSize} ${esc(m.qtyType||'Each')}</div>` : ''}
          ${isBoxed ? boxedIntakeRow : simpleIntakeRow}
          <div class="stock-threshold-row">
            <span class="stock-threshold-label">Warning ≤</span>
            <input class="stock-threshold-input" type="number" min="0" step="1" inputmode="numeric" value="${rec?.warningQty||0}" id="si-warn-${esc(sid)}">
            <span class="stock-threshold-label" style="margin-left:8px">Reorder:</span>
            <input class="stock-threshold-input" type="number" min="0" step="1" inputmode="numeric" value="${rec?.reorderQty||0}" id="si-reorder-${esc(sid)}">
            <button class="btn-sm" data-stock-thresh="${esc(sid)}" style="margin-left:auto">Save levels</button>
          </div>
          <div class="stock-action-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:2px">
            <button class="btn-sm btn-sm-danger" data-stock-disable="${esc(sid)}" style="margin-left:auto">Stop tracking</button>
          </div>
        </div>
      </div>` : `
      <div class="stock-card-body" id="stock-body-${esc(sid)}">
        <div class="stock-actions">
          <div class="stock-action-row">
            <span style="font-size:12px;color:var(--text2);flex:1">Enable tracking to manage stock levels for this item.</span>
            <input class="stock-delta-input" type="number" min="0" step="1" inputmode="numeric" placeholder="Initial qty" id="si-init-${esc(sid)}" style="width:80px">
            <button class="btn-sm" data-stock-enable="${esc(sid)}"><i class="ti ti-check"></i> Start tracking</button>
          </div>
        </div>
      </div>`;

    return `<div class="stock-card${cardClass}" id="stock-card-${esc(sid)}">
      <div class="stock-card-header" role="button" tabindex="0" data-stock-hdr="${esc(sid)}">
        ${catTile(m.category, 'stock-card-icon')}
        <div class="stock-card-info">
          <div class="stock-card-name">${descHtml(m.description)}${m._ghost ? ' <span class="ghost-chip"><i class="ti ti-sparkles" style="font-size:10px"></i> New — not in CSV yet</span>' : ''}</div>
          <div class="stock-card-meta">${showCode ? esc(m.partCode)+' · ' : ''}${esc(m.category)} · ${esc(m.subcategory)}</div>
        </div>
        ${qtyBadge}
        <i class="ti ti-chevron-right chevron ${isOpen?'open':''}" id="stock-chev-${esc(sid)}"></i>
      </div>
      ${body}
    </div>`;
  },

  toggleStockCard(sid) {
    const body = document.getElementById(`stock-body-${sid}`);
    const chev = document.getElementById(`stock-chev-${sid}`);
    if (!body) return;
    const opening = !Fold.isOpen(body);
    Fold.toggle(body, opening);
    chev?.classList.toggle('open', opening);
    if (opening) this._openStockCards.add(sid); else this._openStockCards.delete(sid);
  },

  _stockName(sid) { const i = this.consumables.find(m => stockId(m) === sid); return (i && i.description) || sid; },
  _stockBusy(what, sid, label) { return busyBtn(document.querySelector(`[data-stock-${what}="${CSS.escape(sid)}"]`), label); },

  async stockEnable(sid) {
    if (this._opBusy.has(`enable:${sid}`)) return;
    this._opBusy.add(`enable:${sid}`);
    const back = this._stockBusy('enable', sid, 'Starting…');
    try {
      const initEl = document.getElementById(`si-init-${sid}`);
      const initQty = parseInt(initEl?.value || '0') || 0;
      await DB.enableTracking(sid);
      if (initQty > 0) {
        const item = this.consumables.find(m => stockId(m) === sid);
        const s = Settings.get();
        const by = (s.managerName || 'Manager').trim() || 'Manager';
        await DB.adjustStock(sid, item?.description || sid, initQty, 'adjustment', by, genRef(), 'initial_qty');
      }
    } catch(e) { tellFailed('Tracking not enabled', e); }
    finally { back(); this._opBusy.delete(`enable:${sid}`); }
  },

  async stockDisable(sid) {
    if (!await Ask.confirm({ title: `Stop tracking ${this._stockName(sid)}?`, body: 'It leaves the sign-out page. Its history is kept.', yes: 'Stop tracking', no: 'Keep tracking', danger: true })) return;
    try { await DB.disableTracking(sid); } catch(e) { tellFailed('Still tracked', e); }
  },

  async stockIntake(sid) {
    if (this._opBusy.has(`intake:${sid}`)) return;
    const el = document.getElementById(`si-intake-${sid}`);
    const delta = parseInt(el?.value || '0');
    if (!delta || delta <= 0) { toast('Enter a quantity to add', true); el?.focus(); return; }
    const item = this.consumables.find(m => stockId(m) === sid);
    const s = Settings.get();
    const by = (s.managerName || 'Manager').trim() || 'Manager';
    this._opBusy.add(`intake:${sid}`);
    const back = this._stockBusy('intake', sid, 'Adding…');
    try {
      await DB.adjustStock(sid, item?.description || sid, delta, 'adjustment', by, genRef(), 'panel_intake');
      this._usedField(`si-intake-${sid}`);
    } catch(e) { tellFailed('Stock not added', e, 'Check the quantity, then try again.'); }
    finally { back(); this._opBusy.delete(`intake:${sid}`); }
  },

  // Take inventory out from the manager side — e.g. damaged/wasted stock, or
  // manager personally using something, separate from the worker sign-out flow.
  // Always entered in individual units (even for boxed items) since removals
  // for these reasons are rarely a clean whole-box quantity.
  async stockRemove(sid) {
    const el = document.getElementById(`si-remove-${sid}`);
    const delta = parseInt(el?.value || '0');
    if (!delta || delta <= 0) { toast('Enter a quantity to remove', true); el?.focus(); return; }
    const item = this.consumables.find(m => stockId(m) === sid);
    const rec = this._stockFor(sid);
    if (delta > (rec?.qty || 0)) { toast(`Only ${rec?.qty||0} in stock`, true); el?.focus(); return; }
    if (!await Ask.confirm({ title: `Remove ${delta} ${item?.qtyType||'units'}?`, body: `${this._stockName(sid)}: ${rec?.qty||0} now, ${round2((rec?.qty||0) - delta)} after.`, yes: 'Remove stock', no: 'Keep stock', danger: true })) return;
    const s = Settings.get();
    const by = (s.managerName || 'Manager').trim() || 'Manager';
    try {
      await DB.adjustStock(sid, item?.description || sid, -delta, 'adjustment', by, genRef(), 'remove');
      this._usedField(`si-remove-${sid}`);
    } catch(e) { tellFailed('Stock not removed', e, 'Check the quantity, then try again.'); }
  },

  // Intake N whole boxes (default workflow for boxed items — adds boxSize * N units)
  async stockIntakeBoxes(sid) {
    if (this._opBusy.has(`intakebox:${sid}`)) return;
    const el = document.getElementById(`si-intake-box-${sid}`);
    const numBoxes = parseInt(el?.value || '0');
    if (!numBoxes || numBoxes <= 0) { toast('Enter a number of boxes', true); el?.focus(); return; }
    const item = this.consumables.find(m => stockId(m) === sid);
    if (!hasBoxTracking(item)) return;
    const delta = numBoxes * item.boxSize;
    const s = Settings.get();
    const by = (s.managerName || 'Manager').trim() || 'Manager';
    this._opBusy.add(`intakebox:${sid}`);
    const back = this._stockBusy('intake-boxn', sid, 'Adding…');
    try {
      await DB.adjustStock(sid, item?.description || sid, delta, 'adjustment', by, genRef(), 'panel_intake_box');
      this._usedField(`si-intake-box-${sid}`);
    } catch(e) { tellFailed('Stock not added', e, 'Check the quantity, then try again.'); }
    finally { back(); this._opBusy.delete(`intakebox:${sid}`); }
  },

  // Stocktake-style correction: rounds the recorded qty down to the nearest whole box.
  // Use when a box runs low/out and a fresh one is opened — corrects drift from
  // not tracking every individual unit taken out day to day.
  async stockOpenNewBox(sid) {
    const item = this.consumables.find(m => stockId(m) === sid);
    if (!hasBoxTracking(item)) return;
    const rec = this._stockFor(sid);
    const currentQty = rec?.qty || 0;
    const roundedQty = Math.floor(currentQty / item.boxSize) * item.boxSize;
    const unit = (item.boxUnit||'Box').toLowerCase();
    const s = Settings.get();
    const by = (s.managerName || 'Manager').trim() || 'Manager';

    if (roundedQty === currentQty) {
      // Already a whole number of boxes — there's no loose remainder to round down.
      // This usually means a box was opened without anyone recording usage from
      // the previous one. Offer to take away one full box to correct for that.
      if (currentQty < item.boxSize) { toast(`Less than one ${unit} in stock`, true); return; }
      const newQty = currentQty - item.boxSize;
      if (!await Ask.confirm({ title: `Take off one full ${unit}?`, body: `${this._stockName(sid)} is already at whole ${unit}es: ${currentQty} now, ${newQty} after.`, yes: `Take off one ${unit}`, no: 'Keep stock', danger: true })) return;
      try {
        await DB.setStock(sid, item?.description || sid, newQty, by, genRef(), 'open_box');
      } catch(e) { tellFailed('Stock not changed', e); }
      return;
    }

    if (!await Ask.confirm({ title: `Round down to whole ${unit}es?`, body: `${this._stockName(sid)}: ${currentQty} now, ${roundedQty} after (${roundedQty / item.boxSize} ${unit}${roundedQty / item.boxSize !== 1 ? 'es' : ''}).`, yes: 'Round down', no: 'Keep stock' })) return;
    try {
      await DB.setStock(sid, item?.description || sid, roundedQty, by, genRef(), 'open_box');
    } catch(e) { tellFailed('Stock not changed', e); }
  },

  // Boxed-item override: whole boxes + optional loose units in an opened box
  async stockSetAbsoluteBoxed(sid) {
    const item = this.consumables.find(m => stockId(m) === sid);
    if (!hasBoxTracking(item)) return;
    const boxesEl = document.getElementById(`si-set-boxes-${sid}`);
    const looseEl = document.getElementById(`si-set-loose-${sid}`);
    const boxes = parseInt(boxesEl?.value || '0') || 0;
    const loose = looseEl?.value ? (parseInt(looseEl.value) || 0) : 0;
    if (!boxesEl?.value && !looseEl?.value) { toast('Enter a number of boxes', true); boxesEl?.focus(); return; }
    const newQty = boxes * item.boxSize + loose;
    if (!await Ask.confirm({ title: `Set stock to ${newQty}?`, body: `${this._stockName(sid)}: ${boxes} ${(item.boxUnit||'Box').toLowerCase()}${boxes !== 1 ? 'es' : ''}${loose?` and ${loose} loose`:''}. ${this._stockFor(sid)?.qty || 0} now.`, yes: 'Set stock', no: 'Keep stock' })) return;
    const s = Settings.get();
    const by = (s.managerName || 'Manager').trim() || 'Manager';
    try {
      await DB.setStock(sid, item?.description || sid, newQty, by, genRef());
      this._usedField(`si-set-boxes-${sid}`, `si-set-loose-${sid}`);
      toast(`${this._stockName(sid)}: stock set to ${newQty}`);
    } catch(e) { tellFailed('Stock not changed', e); }
  },

  async stockSetAbsolute(sid) {
    const el = document.getElementById(`si-set-${sid}`);
    const newQty = parseInt(el?.value ?? '');
    if (isNaN(newQty) || newQty < 0) { toast('Enter a quantity', true); el?.focus(); return; }
    if (!await Ask.confirm({ title: `Set stock to ${newQty}?`, body: `${this._stockName(sid)}: ${this._stockFor(sid)?.qty || 0} now.`, yes: 'Set stock', no: 'Keep stock' })) return;
    const item = this.consumables.find(m => stockId(m) === sid);
    const s = Settings.get();
    const by = (s.managerName || 'Manager').trim() || 'Manager';
    try {
      await DB.setStock(sid, item?.description || sid, newQty, by, genRef());
      this._usedField(`si-set-${sid}`);
      toast(`${this._stockName(sid)}: stock set to ${newQty}`);
    } catch(e) { tellFailed('Stock not changed', e); }
  },

  async stockSaveThresholds(sid) {
    const warnEl   = document.getElementById(`si-warn-${sid}`);
    const reordEl  = document.getElementById(`si-reorder-${sid}`);
    const warnQty  = parseInt(warnEl?.value  || '0') || 0;
    const reordQty = parseInt(reordEl?.value || '0') || 0;
    const back = this._stockBusy('thresh', sid, 'Saving…');
    try {
      await DB.updateThresholds(sid, reordQty, warnQty);
      toast(`Levels saved for ${this._stockName(sid)}`);
    } catch(e) { tellFailed('Levels not saved', e); }
    finally { back(); }
  },

  stockOpenHistory(sid, itemName) {
    this._historyFilter = { stockId: sid, itemName };
    this._historyRecords = [];
    this._historyLastDoc = null;
    this.renderHistoryFilter();
    this.setMainTab('history');
    this._loadHistory();
  },

  // Loads every low-stock item (that has a reorder qty set) into the Consumables Order
  // cart at its configured reorder quantity, then opens the order panel for review.
  stockReorderAll() {
    const lowItems = this.consumables.filter(m => {
      const rec = this._stockFor(stockId(m));
      return rec?.tracked && rec.warningQty > 0 && (rec.qty||0) <= rec.warningQty && (rec.reorderQty||0) > 0;
    });
    if (!lowItems.length) { toast('No low-stock item has a reorder quantity', true); return; }
    for (const m of lowItems) {
      const rec = this._stockFor(stockId(m));
      // reorderQty is a stock threshold in individual units; boxed items are ordered
      // in boxes, so round the shortfall UP to whole boxes (never under-order).
      const qty = hasBoxTracking(m) ? Math.max(1, Math.ceil(rec.reorderQty / m.boxSize)) : rec.reorderQty;
      this.coSet(m.id, Math.max(this.coGet(m.id), qty));   // never lowers what is already in the cart
    }
    this._updateCoBadge();
    this.renderCoList();
    this.openPanel('cons-order-panel');
    this.coOpenReview();
  },

  // ══════════════════════════════════════════
  // CONSUMABLE BARCODES — oversight panel + Excel export with drawn barcodes.
  // Linking happens on the consumables iPad (setup mode) where the scanner lives;
  // this panel is for keeping track: coverage, who linked what and when, unlinking
  // mistakes, and typing a code in manually as a fallback.
  // ══════════════════════════════════════════
  // Scans only matter here while the Barcodes panel is open (this page is normally on
  // the PC with no scanner; on the consumables iPad it turns the panel into the setup
  // tool). Known code → flash its row so you can verify the link; unknown → pick the
  // item it belongs to and it's linked on the spot.
  _onScanMgr(code) {
    if (!document.getElementById('barcodes-panel')?.classList.contains('open')) return;
    const rec = this._stock.find(r => (r.barcodes || []).some(b => String(b).toLowerCase() === String(code).trim().toLowerCase()));
    if (rec) {
      const m = this.consumables.find(x => stockId(x) === rec._id);
      this._toast(`Linked to: ${m ? m.description : rec._id}`);
      const row = document.getElementById(`bc-row-${rec._id}`);
      if (row) {
        row.scrollIntoView({ block: 'center', behavior: 'smooth' });
        row.classList.remove('bc-hit'); void row.offsetWidth; // restart the flash animation
        row.classList.add('bc-hit');
      }
      // Setup loop: a known item that's never been counted rolls straight into the
      // starting-count prompt, so scan → count → next scan covers the whole shelf.
      if (m && (!rec.tracked || (rec.qty || 0) === 0)) this._bcCountPrompt(rec._id);
      return;
    }
    this._bcPromptLink(code);
  },

  _toast(msg, isWarning, action) { toast(msg, isWarning, action); },

  // Unknown barcode scanned with the panel open: choose which item it belongs to —
  // or create the item on the spot if it doesn't have a CSV row yet (ghost).
  _bcPromptLink(code) {
    const items = [...this.consumables].sort((a,b) => descCompare(a.description, b.description));
    const ow = document.getElementById('overlay-wrap');
    const rows = items.map(m => `<button class="scan-link-row" data-link-sid="${esc(stockId(m))}">${descHtml(m.description)}</button>`).join('');
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card" style="max-width:420px">
          <div class="success-icon blue"><i class="ti ti-barcode"></i></div>
          <h3>New barcode</h3>
          <p style="margin-bottom:8px">Which item is this? It'll be remembered for next time.<br>
            <span style="font-family:var(--mono);font-size:12px">${esc(code)}</span></p>
          <input class="checkout-name-input" type="search" autocorrect="off" autocapitalize="off" spellcheck="false" id="bc-link-search" placeholder="Search items…" autocomplete="off"
            style="width:100%;border:1px solid var(--border);background:var(--bg);border-radius:var(--radius);padding:8px 12px;font-size:14px;outline:none;margin-bottom:8px">
          <div class="scan-link-list" id="bc-link-list">${rows}</div>
          <button class="btn btn-outline" id="btn-bc-link-new" style="width:100%;margin-top:10px"><i class="ti ti-plus"></i> It's not in the list — create new item</button>
          <button class="btn btn-outline" id="btn-bc-link-cancel" style="width:100%;margin-top:8px">Cancel</button>
        </div>
      </div>`;
    const search = document.getElementById('bc-link-search');
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      document.querySelectorAll('#bc-link-list .scan-link-row').forEach(r => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
    document.getElementById('bc-link-list').addEventListener('click', async e => {
      const row = e.target.closest('[data-link-sid]'); if (!row) return;
      const sid = row.dataset.linkSid;
      const m = this.consumables.find(x => stockId(x) === sid);
      ow.innerHTML = '';
      const s = Settings.get();
      try {
        await DB.linkBarcode(sid, code, `${(s.managerName || 'Manager').trim() || 'Manager'} — setup`);
        this._toast(`Linked to: ${m ? m.description : sid}`);
        setTimeout(() => this.renderBarcodesPanel(), 300);
        // Roll into the starting count if this item's never been counted.
        const rec = this._stockFor(sid);
        if (!rec?.tracked || (rec?.qty || 0) === 0) this._bcCountPrompt(sid, m);
      } catch (err) {
        if (err.message === 'BARCODE_IN_USE') {
          const other = this.consumables.find(x => stockId(x) === err.existingId);
          this._toast(`Already linked to: ${other ? other.description : 'another item'}`, true);
        } else tellFailed('Barcode not linked', err, 'Scan it again.');
      }
    });
    document.getElementById('btn-bc-link-new').addEventListener('click', () => this._bcNewItemPrompt(code));
    document.getElementById('btn-bc-link-cancel').addEventListener('click', () => { ow.innerHTML = ''; });
  },

  // Starting-count overlay: what's actually on the shelf right now. Boxed items are
  // counted the way shelves are counted — full boxes plus loose units. Writes an
  // absolute set with its own 'setup' history subtype (reads as "initial count",
  // not a fake delivery), and turns tracking on. Skip leaves everything untouched.
  _bcCountPrompt(sid, fallbackItem) {
    // fallbackItem covers the just-created ghost: the merged catalog only picks it
    // up when the stock snapshot lands, which may be a beat after this opens.
    const m = this.consumables.find(x => stockId(x) === sid) || fallbackItem;
    if (!m) return;
    const rec   = this._stockFor(sid);
    const boxed = hasBoxTracking(m);
    const ow = document.getElementById('overlay-wrap');
    const fields = boxed ? `
          <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px">
            <input class="qty-input" type="number" min="0" step="1" inputmode="numeric" id="bc-count-boxes" placeholder="0" style="width:80px;height:40px;font-size:16px">
            <span style="font-size:12px;color:var(--text3)">full ${esc((m.boxUnit||'Box').toLowerCase())}es +</span>
            <input class="qty-input" type="number" min="0" step="1" inputmode="numeric" id="bc-count-loose" placeholder="0" style="width:80px;height:40px;font-size:16px">
            <span style="font-size:12px;color:var(--text3)">loose</span>
          </div>
          <div style="font-size:12px;color:var(--text2);margin-bottom:10px" id="bc-count-total">= 0 ${esc(m.qtyType||'Each')} (1 ${esc(m.boxUnit||'Box')} = ${m.boxSize} ${esc(m.qtyType||'Each')})</div>`
      : `
          <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:10px">
            <input class="qty-input" type="number" min="0" step="1" inputmode="numeric" id="bc-count-qty" placeholder="0" style="width:110px;height:40px;font-size:16px">
            <span style="font-size:12px;color:var(--text3)">${esc(m.qtyType||'Each')}</span>
          </div>`;
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card" style="max-width:400px">
          <div class="success-icon blue"><i class="ti ti-list-numbers"></i></div>
          <h3>Starting count</h3>
          <p style="margin-bottom:10px">${descHtml(m.description)}${rec?.tracked ? `<br><span style="font-size:12px;color:var(--text3)">currently recorded: ${rec.qty||0} ${esc(m.qtyType||'Each')}</span>` : ''}</p>
          ${fields}
          <div class="inline-error" id="bc-count-error" role="alert" hidden style="margin-bottom:10px"></div>
          <button class="btn btn-primary" id="btn-bc-count-save" style="width:100%">Save count</button>
          <button class="btn btn-outline" id="btn-bc-count-skip" style="width:100%;margin-top:8px">Skip — count later</button>
        </div>
      </div>`;
    const total = () => {
      if (!boxed) return Math.max(0, parseInt(document.getElementById('bc-count-qty')?.value) || 0);
      const b = Math.max(0, parseInt(document.getElementById('bc-count-boxes')?.value) || 0);
      const l = Math.max(0, parseInt(document.getElementById('bc-count-loose')?.value) || 0);
      return b * m.boxSize + l;
    };
    if (boxed) {
      const upd = () => { document.getElementById('bc-count-total').textContent =
        `= ${total()} ${m.qtyType||'Each'} (1 ${m.boxUnit||'Box'} = ${m.boxSize} ${m.qtyType||'Each'})`; };
      document.getElementById('bc-count-boxes').addEventListener('input', upd);
      document.getElementById('bc-count-loose').addEventListener('input', upd);
    }
    const save = async () => {
      const qty = total();
      // A scan landing in the focused field types the barcode digits — a shelf
      // count can't realistically be a 10+ digit number, so refuse it.
      if (qty > 99999) { inlineError('bc-count-error', 'That looks like a barcode. Type the quantity.'); return; }
      inlineError('bc-count-error', '');
      const back = busyBtn(document.getElementById('btn-bc-count-save'), 'Saving…');
      const s = Settings.get();
      try {
        await DB.setInitialStock(sid, m.description, qty, `${(s.managerName || 'Manager').trim() || 'Manager'} — setup`);
        ow.innerHTML = '';
        this._toast(`${m.description}: counted ${boxed ? boxDisplay(m, qty) : qty + ' ' + (m.qtyType||'Each')}`);
        setTimeout(() => this.renderBarcodesPanel(), 300);
      } catch (e) { console.error(e); back(); inlineError('bc-count-error', `Not saved: ${whyFailed(e)}. Click Save count to try again.`); }
    };
    ow.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(); }));
    document.getElementById('btn-bc-count-save').addEventListener('click', save);
    document.getElementById('btn-bc-count-skip').addEventListener('click', () => { ow.innerHTML = ''; });
    (document.getElementById(boxed ? 'bc-count-boxes' : 'bc-count-qty'))?.focus();
  },

  // Highest SC placeholder number currently visible (catalog + ghosts) — the floor
  // for claiming the next code, so the shared counter can never re-issue a number
  // that was ever hand-assigned in the CSV.
  _ghostFloorNum() {
    let max = 0;
    for (const m of this.consumables) {
      const match = /^SC(\d+)$/i.exec((m.partCode || '').trim());
      if (match) max = Math.max(max, parseInt(match[1], 10));
    }
    return max + 1;
  },

  // Create a consumable that has no CSV row yet (a "ghost"): name it, optionally
  // categorise it, and it becomes a real item everywhere immediately — checkout
  // grid, stock, ordering — under an auto-claimed SC placeholder code. If a scanned
  // barcode kicked this off it's linked in the same step, then the starting-count
  // prompt follows. Export the pending rows from the panel button when done.
  async _bcNewItemPrompt(code) {
    const ow = document.getElementById('overlay-wrap');
    // Existing categories (ghosts' included) as suggestions — typing a brand-new
    // category is fine too, it just becomes a new tab everywhere.
    const cats = Data.categories(this.consumables);
    const qtyTypes = ['Each','Pair','Roll','Pack','Can','Bottle','Tube','Tub','Sheet','Litre','Metre'];
    ow.innerHTML = `
      <div class="success-overlay">
        <div class="success-card" style="max-width:440px;text-align:left">
          <div class="success-icon blue" style="margin-left:auto;margin-right:auto"><i class="ti ti-sparkles"></i></div>
          <h3 style="text-align:center">New item</h3>
          <p style="text-align:center;margin-bottom:12px;font-size:13px">Not in the catalog yet — it gets the next SC code and works everywhere straight away.${code ? `<br><span style="font-family:var(--mono);font-size:12px">barcode ${esc(code)} will be linked</span>` : ''}</p>
          <div class="setup-field"><label>Name / description *</label><input id="gh-name" autocomplete="off" placeholder="e.g. Cutting Disc 125mm x 1mm"></div>
          <div style="display:flex;gap:10px">
            <div class="setup-field" style="flex:1"><label>Category</label>
              <input id="gh-cat" autocomplete="off" placeholder="Uncategorised" list="gh-cat-list">
              <datalist id="gh-cat-list">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
            </div>
            <div class="setup-field" style="flex:1"><label>Subcategory</label><input id="gh-sub" autocomplete="off" placeholder="General"></div>
          </div>
          <div style="display:flex;gap:10px">
            <div class="setup-field" style="flex:1"><label>Unit</label>
              <input id="gh-qtytype" autocomplete="off" value="Each" list="gh-qtytype-list">
              <datalist id="gh-qtytype-list">${qtyTypes.map(q => `<option value="${q}">`).join('')}</datalist>
            </div>
            <div class="setup-field" style="flex:1"><label>Box size <span style="font-weight:400;color:var(--text3)">(optional)</span></label><input id="gh-boxsize" type="number" min="0" step="1" inputmode="numeric" placeholder="e.g. 50"></div>
          </div>
          <div class="inline-error" id="gh-error" role="alert" hidden style="margin-bottom:10px"></div>
          <button class="btn btn-primary" id="btn-gh-save" style="width:100%;margin-top:4px">Create item</button>
          <button class="btn btn-outline" id="btn-gh-cancel" style="width:100%;margin-top:8px">Cancel</button>
        </div>
      </div>`;
    const save = async () => {
      const name = document.getElementById('gh-name').value.trim();
      const err = msg => { inlineError('gh-error', msg); document.getElementById('gh-name').focus(); };
      if (!name) { err('Enter a name.'); return; }
      // A scan landing in the focused name field types digits + Enter — catch it.
      if (/^\d{8,}$/.test(name)) { err('That looks like a barcode. Type the name.'); return; }
      const sid = stockId({ partCode: 'SC0000', description: name });
      const clash = this.consumables.find(x => stockId(x) === sid);
      if (clash) { err(`"${clash.description}" already exists. Use that one, or change the name.`); return; }
      inlineError('gh-error', '');
      const boxSize = Math.max(0, parseInt(document.getElementById('gh-boxsize').value) || 0);
      const back = busyBtn(document.getElementById('btn-gh-save'), 'Creating…');
      const s = Settings.get();
      const by = `${(s.managerName || 'Manager').trim() || 'Manager'} — setup`;
      try {
        const partCode = await DB.claimGhostCode(this._ghostFloorNum());
        const ghost = {
          partCode,
          description: name,
          category:    document.getElementById('gh-cat').value.trim() || 'Uncategorised',
          subcategory: document.getElementById('gh-sub').value.trim() || 'General',
          qtyType:     document.getElementById('gh-qtytype').value.trim() || 'Each',
          boxSize,
          boxUnit:     'Box',
          createdBy:   by,
          createdAt:   Date.now(),
        };
        await DB.createGhostItem(sid, ghost);
        if (code) {
          try { await DB.linkBarcode(sid, code, by); }
          catch (e) { this._toast('Item created, but the barcode is already linked elsewhere', true); }
        }
        this._toast(`Created ${partCode} — ${name}`);
        setTimeout(() => this.renderBarcodesPanel(), 300);
        // Straight into the starting count — pass the item since the snapshot
        // carrying the new ghost may not have landed yet.
        this._bcCountPrompt(sid, { ...ghost, _ghost: true });
      } catch (e) {
        console.error(e);
        back();
        inlineError('gh-error', `Not created: ${whyFailed(e)}. Click Create item to try again.`);
      }
    };
    document.getElementById('gh-name').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    document.getElementById('btn-gh-save').addEventListener('click', save);
    document.getElementById('btn-gh-cancel').addEventListener('click', () => { ow.innerHTML = ''; });
    document.getElementById('gh-name').focus();
  },

  // Downloads the would-be consumables.csv rows for every item created on-device:
  // same column order as the real file, ready to paste in (drop the header line).
  // Once the rows are committed and deployed, the ghosts reconcile away on the
  // next page load and the CSV becomes their source of truth.
  exportGhostRows() {
    const ghosts = this.consumables.filter(m => m._ghost);
    if (!ghosts.length) { this._toast('No new items waiting for a CSV row', true); return; }
    const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const lines = ['Part Code,Description,Category,Subcategory,Quantity Type,BoxSize,BoxUnit'];
    for (const m of ghosts) {
      lines.push([m.partCode, m.description, m.category, m.subcategory, m.qtyType,
        m.boxSize || '', m.boxSize ? (m.boxUnit || 'Box') : ''].map(q).join(','));
    }
    const blob = new Blob(['\uFEFF' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `New_Consumables_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },

  renderBarcodesPanel() {
    const el = document.getElementById('barcodes-list'); if (!el) return;
    const items = [...this.consumables].sort((a,b) =>
      naturalCompare(a.category, b.category) || descCompare(a.description, b.description));
    const withBc = items.filter(m => (this._stockFor(stockId(m))?.barcodes || []).length > 0);
    const counted = items.filter(m => { const r = this._stockFor(stockId(m)); return r?.tracked && (r.qty || 0) > 0; });
    const ghosts = items.filter(m => m._ghost);
    const summary = document.getElementById('barcodes-summary');
    if (summary) summary.textContent =
      `${withBc.length} of ${items.length} consumables have a barcode · ${counted.length} counted`
      + (ghosts.length ? ` · ${ghosts.length} new item${ghosts.length > 1 ? 's' : ''} not in the CSV yet` : '');
    const exportBtn = document.getElementById('btn-bc-export-ghosts');
    if (exportBtn) exportBtn.style.display = ghosts.length ? '' : 'none';

    const filtered = items.filter(m => {
      const n = (this._stockFor(stockId(m))?.barcodes || []).length;
      if (this._bcFilter === 'missing') return n === 0;
      if (this._bcFilter === 'has')     return n > 0;
      if (this._bcFilter === 'new')     return !!m._ghost;
      return true;
    });
    if (!filtered.length) { el.innerHTML = `<div class="empty-state"><i class="ti ti-barcode-off"></i><p>${({ missing: 'Every consumable has a barcode.', has: 'No consumable has a barcode yet.', new: 'No new items.' })[this._bcFilter] || 'No consumables yet.'}</p></div>`; return; }

    let html = '', lastCat = null;
    for (const m of filtered) {
      if (m.category !== lastCat) { html += `<div class="stocktake-section">${esc(m.category)}</div>`; lastCat = m.category; }
      const sid = stockId(m);
      const rec = this._stockFor(sid);
      const codes = rec?.barcodes || [];
      // Show the last few log entries so a wrong link is traceable to a device and time.
      const log = (rec?.barcodeLog || []).slice(-3).reverse().map(l =>
        `<div class="stocktake-row-meta">${l.action === 'unlinked' ? 'Removed' : 'Linked'} ${esc(l.code)} · ${esc(l.by || 'unknown')}${l.at ? ' · ' + fmtTime(new Date(l.at)) : ''}</div>`).join('');
      // Setup progress at a glance: recorded count (tap to set/correct it).
      const hasCount = rec?.tracked && (rec.qty || 0) > 0;
      const countChip = rec?.tracked
        ? `<button class="bc-chip${hasCount ? '' : ' none'}" data-bc-count="${esc(sid)}" title="Set the counted quantity" style="cursor:pointer"><i class="ti ti-list-numbers" style="font-size:11px"></i> ${esc(boxDisplay(m, rec.qty || 0))}</button>`
        : `<button class="bc-chip none" data-bc-count="${esc(sid)}" title="Set the counted quantity" style="cursor:pointer"><i class="ti ti-list-numbers" style="font-size:11px"></i> no count yet</button>`;
      html += `<div class="stocktake-row" style="flex-wrap:wrap" id="bc-row-${esc(sid)}">
        <div class="stocktake-row-info">
          <div class="stocktake-row-name">${descHtml(m.description)}${m._ghost ? ' <span class="ghost-chip"><i class="ti ti-sparkles" style="font-size:10px"></i> New — not in CSV yet</span>' : ''}</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:5px">
            ${codes.map(c => `<span class="bc-chip">${esc(c)} <button class="bc-chip-x" data-bc-unlink="${esc(c)}" data-sid="${esc(sid)}" title="Remove this barcode">✕</button></span>`).join('')}
            ${codes.length ? '' : '<span class="bc-chip none">no barcode yet</span>'}
            <button class="btn-sm" data-bc-add="${esc(sid)}"><i class="ti ti-plus"></i> Add</button>
            ${countChip}
          </div>
          ${log}
        </div>
      </div>`;
    }
    el.innerHTML = html;
  },

  async bcUnlink(sid, code) {
    const m = this.consumables.find(x => stockId(x) === sid);
    if (!await Ask.confirm({ title: 'Remove this barcode?', body: `${code} will no longer find ${m ? m.description : sid}.`, yes: 'Remove barcode', no: 'Keep barcode', danger: true })) return;
    const s = Settings.get();
    try {
      await DB.unlinkBarcode(sid, code, (s.managerName || 'Manager').trim() || 'Manager');
      // The stock listener will re-render, but do it now so it feels immediate.
      setTimeout(() => this.renderBarcodesPanel(), 300);
    } catch (e) { tellFailed('Barcode not removed', e); }
  },

  // Add a barcode to a specific item. On the consumables iPad you can just SCAN into
  // this dialog — the scanner types the code and its Enter submits the prompt. On the
  // PC (no scanner), type or paste the number off the box.
  async bcManualAdd(sid) {
    const m = this.consumables.find(x => stockId(x) === sid);
    const code = await Ask.text({ title: m ? m.description : sid, body: 'Scan the barcode, or type its number.', label: 'Barcode', yes: 'Link barcode', no: 'Cancel' });
    if (!code) return;
    const s = Settings.get();
    try {
      await DB.linkBarcode(sid, code.trim(), (s.managerName || 'Manager').trim() || 'Manager');
      setTimeout(() => this.renderBarcodesPanel(), 300);
      // Same setup loop as scanning: never-counted items roll into the count prompt.
      const rec = this._stockFor(sid);
      if (!rec?.tracked || (rec?.qty || 0) === 0) this._bcCountPrompt(sid, m);
    } catch (e) {
      if (e.message === 'BARCODE_IN_USE') {
        const other = this.consumables.find(x => stockId(x) === e.existingId);
        Ask.tell('Barcode not linked', `It is already linked to ${other ? other.description : 'another item'}. Remove it there first.`);
      } else tellFailed('Barcode not linked', e);
    }
  },

  // Draws a Code 128 barcode onto a canvas and returns a PNG data URL. Pure-digit
  // even-length values use code set C (compact), everything else set B. Returns null
  // for values that can't be encoded. Standard 107-symbol width table.
  code128DataUrl(text, opts = {}) {
    const P = [
      '212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
      '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
      '221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
      '212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
      '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
      '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
      '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
      '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
      '111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
      '214121','412121','111143','111341','131141','114113','114311','411113','411311','113141',
      '114131','311141','411131','211412','211214','211232','2331112',
    ];
    const s = String(text).trim();
    if (!s) return null;
    let vals;
    if (/^\d+$/.test(s) && s.length % 2 === 0 && s.length >= 4) {
      vals = [105];
      for (let i = 0; i < s.length; i += 2) vals.push(+s.slice(i, i + 2));
    } else {
      vals = [104];
      for (const ch of s) {
        const c = ch.charCodeAt(0);
        if (c < 32 || c > 126) return null;
        vals.push(c - 32);
      }
    }
    let sum = vals[0];
    for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
    vals.push(sum % 103, 106);

    const scale = opts.scale || 2, h = opts.height || 60, quiet = 10 * scale;
    let modules = 0;
    for (const v of vals) for (const d of P[v]) modules += +d;
    const canvas = document.createElement('canvas');
    canvas.width = modules * scale + quiet * 2;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    let x = quiet;
    for (const v of vals) {
      let bar = true;
      for (const d of P[v]) { const w = +d * scale; if (bar) ctx.fillRect(x, 0, w, h); x += w; bar = !bar; }
    }
    return { url: canvas.toDataURL('image/png'), width: canvas.width, height: canvas.height };
  },

  // Consumables list export (.xlsx via ExcelJS — the only export needing embedded
  // images). One row per consumable, grouped into category sections, with recorded
  // stock, a blank Counted column for a manual stocktake, the latest barcode DRAWN
  // as a scannable image, and the code as text (doubles as a backup of the barcode
  // data outside Firestore). Same template styling as the materials export.
  async exportConsumables() {
    if (typeof ExcelJS === 'undefined') { Ask.tell('Not exported', 'The export part of this page did not load. Refresh the page, then try again.'); return; }
    const thin = { style: 'thin', color: { argb: 'FF000000' } };
    const BORDER    = { top: thin, left: thin, bottom: thin, right: thin };
    const F_HEADER  = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
    const F_SECTION = { name: 'Calibri', size: 11, bold: true };
    const F_CELL    = { name: 'Calibri', size: 11, bold: true };
    const F_QTY     = { name: 'Tahoma', size: 9 };
    const FILL_HEADER  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF000080' } };
    const FILL_SECTION = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9D9D9' } };

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Consumables');
    ws.columns = [{ width: 12 }, { width: 42 }, { width: 10 }, { width: 10 }, { width: 10 }, { width: 34 }, { width: 16 }];

    const header = ws.addRow(['Code', 'Description', 'Base Unit', 'In Stock', 'Counted', 'Barcode', 'Barcode #']);
    header.eachCell(c => { c.font = F_HEADER; c.fill = FILL_HEADER; c.border = BORDER; });

    const items = [...this.consumables].sort((a,b) =>
      naturalCompare(a.category, b.category) || naturalCompare(a.subcategory, b.subcategory) || descCompare(a.description, b.description));

    let lastSection = null;
    for (const m of items) {
      const section = `${m.category}${m.subcategory && m.subcategory !== 'General' ? ' — ' + m.subcategory : ''}`;
      if (section !== lastSection) {
        const r = ws.addRow([section, '', '', '', '', '', '']);
        r.eachCell({ includeEmpty: true }, c => { c.font = F_SECTION; c.fill = FILL_SECTION; c.border = BORDER; });
        ws.mergeCells(r.number, 1, r.number, 7);
        lastSection = section;
      }
      const rec   = this._stockFor(stockId(m));
      const codes = rec?.barcodes || [];
      const last  = codes.length ? codes[codes.length - 1] : null;
      const code  = m.partCode && !Data.isDummyCode(m.partCode) ? m.partCode : '';
      const row = ws.addRow([code, m.description, m.qtyType || 'Each', rec?.tracked ? (rec.qty ?? 0) : '', '', '', last || '']);
      row.getCell(1).font = F_CELL; row.getCell(2).font = F_CELL; row.getCell(3).font = F_CELL;
      row.getCell(4).font = F_QTY;  row.getCell(5).font = F_QTY;  row.getCell(7).font = F_QTY;
      row.eachCell({ includeEmpty: true }, c => { c.border = BORDER; });
      if (last) {
        const bc = this.code128DataUrl(last, { scale: 2, height: 60 });
        if (bc) {
          row.height = 34;
          const imgId = wb.addImage({ base64: bc.url, extension: 'png' });
          // ext is in pixels; halve the scale-2 canvas so module ratios stay exact.
          ws.addImage(imgId, { tl: { col: 5.05, row: row.number - 1 + 0.06 }, ext: { width: Math.round(bc.width / 2), height: 38 } });
        }
      }
    }

    const buf  = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Consumables_${new Date().toISOString().slice(0, 10)}.xlsx`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },

  // ══════════════════════════════════════════
  // HISTORY TAB
  // ══════════════════════════════════════════
  renderHistoryFilter() {
    const chip  = document.getElementById('history-clear-filter');
    const label = document.getElementById('history-filter-label');
    if (!chip || !label) return;
    if (this._historyFilter) {
      chip.style.display = 'flex';
      label.textContent  = this._historyFilter.itemName || this._historyFilter.stockId;
    } else {
      chip.style.display = 'none';
    }
  },

  // A visit shows what was already loaded at once and brings the newest entries in front
  // of it; the older pages stay. Only a first load (or a new item filter) starts empty.
  async _loadHistory(append) {
    if (this._historyLoading) return;
    this._historyLoading = true;
    const list = document.getElementById('history-list'); if (!list) { this._historyLoading=false; return; }
    const fresh = !append && !this._historyRecords.length;
    if (fresh) { this._historyLastDoc = null; list.innerHTML = skeleton(6); }
    else if (!append) this.renderHistoryList();
    const at = r => r.timestamp && r.timestamp.toMillis ? r.timestamp.toMillis() : +new Date(r.timestamp || 0);
    try {
      const { records, lastDoc, hasMore } = await DB.fetchHistory(
        this._historyFilter?.stockId || null, 50, append ? this._historyLastDoc : null
      );
      if (append || fresh) {
        if (append) this._historyRecords.push(...records); else this._historyRecords = records;
        this._historyLastDoc = lastDoc; this._historyHasMore = hasMore;
      } else {
        const ids = new Set(records.map(r => r._id)), edge = records.length ? at(records[records.length - 1]) : Infinity;
        const older = this._historyRecords.filter(r => !ids.has(r._id) && at(r) < edge);
        this._historyRecords = [...records, ...older];
        if (!older.length) { this._historyLastDoc = lastDoc; this._historyHasMore = hasMore; }
      }
      this.renderHistoryList();
    } catch(e) {
      console.error('History not loaded:', e);
      if (!fresh) { toast(`History not updated: ${whyFailed(e)}`, true); return; }
      // Filtering by item needs a composite Firestore index (stockId + timestamp).
      // Firestore's error message includes a console link that creates it — surface
      // that as a clickable link instead of a wall of error text.
      const idxUrl = (e.message || '').match(/https:\/\/console\.firebase\.google\.com[^\s"')]+/);
      if (list) list.innerHTML = idxUrl
        ? `<div class="empty-state"><i class="ti ti-alert-circle"></i><p>This filter needs a one-time Firestore index.<br>
            <a href="${esc(idxUrl[0])}" target="_blank" rel="noopener" style="color:var(--link);text-decoration:underline">Create it in the Firebase console</a>,
            wait a minute for it to build, then try again.</p></div>`
        : `<div class="empty-state"><i class="ti ti-alert-circle"></i><p>History not loaded: ${esc(whyFailed(e))}.</p><button class="btn btn-primary" style="width:auto" data-hist-retry>Try again</button></div>`;
    } finally { this._historyLoading = false; }
  },

  renderHistoryList() {
    const list = document.getElementById('history-list'); if (!list) return;
    if (!this._historyRecords.length) {
      list.innerHTML = `<div class="empty-state"><i class="ti ti-history"></i><p>${this._historyFilter?.itemName ? `No stock movements for ${esc(this._historyFilter.itemName)} yet.` : 'No stock movements yet.'}</p></div>`;
      return;
    }
    const nameFilter = (document.getElementById('history-person-search')?.value || '').toLowerCase().trim();
    const itemFilter = (document.getElementById('history-item-search')?.value || '').trim();
    let records = this._historyRecords, note = '';
    if (nameFilter) records = records.filter(r => (r.by||'').toLowerCase().includes(nameFilter));
    // The same search as every other list (typos, sizes, codes); the newest stay first.
    if (itemFilter) {
      const found = Data.filter(records.map(r => ({ description: r.itemName || '', partCode: r.partCode || '', category: '', subcategory: '', r })),
        null, null, itemFilter, { naturalSort: false });
      const hit = new Set(found.map(x => x.r));
      records = records.filter(r => hit.has(r));
      if (found.note) note = `<div class="search-note">${esc(found.note)}</div>`;
    }

    const moreBtn = this._historyHasMore
      ? `<div style="padding:12px;text-align:center"><button class="btn-sm" data-hist-more="1">Load older entries</button></div>`
      : '';
    if (!records.length) {
      list.innerHTML = `<div class="empty-state"><i class="ti ti-history"></i><p>No matching history in what is loaded.</p></div>${moreBtn}`;
      return;
    }

    // Group consecutive-ish records by sessionId (preserving overall newest-first order)
    const groups = [];
    const seenSessions = new Map();
    for (const r of records) {
      if (r.sessionId && seenSessions.has(r.sessionId)) {
        groups[seenSessions.get(r.sessionId)].push(r);
      } else if (r.sessionId) {
        seenSessions.set(r.sessionId, groups.length);
        groups.push([r]);
      } else {
        groups.push([r]);
      }
    }

    const rows = groups.map(group => {
      if (group.length === 1) {
        return this._historyRowHtml(group[0]);
      }
      // Session group — show a summary row, expandable
      const sessId  = group[0].sessionId;
      const ts      = group[0].timestamp?.toDate ? fmtTime(group[0].timestamp.toDate()) : fmtTime(group[0].timestamp);
      const by      = group[0].by || '';
      const action  = group[0].action || 'adjustment';
      const totalAbs= group.reduce((s,r)=>s+Math.abs(r.delta||0),0);
      const allReverted = group.every(r => r.reverted);
      const isOpen  = this._openHistorySessions.has(sessId);
      return `<div class="history-session-group${allReverted?' reverted':''}">
        <div class="history-row" role="button" tabindex="0" data-hist-session="${esc(sessId)}" style="cursor:pointer">
          <span class="history-action-pill ${action}">${esc(this._actionWord(action))} · order</span>
          <span class="history-delta" style="color:var(--text2)">${group.length} item${group.length!==1?'s':''}</span>
          <div style="flex:1;min-width:0">
            <div class="history-item-name">${esc(by)}</div>
            <div class="history-meta">${ts} · ${totalAbs} total units</div>
          </div>
          ${allReverted
            ? `<button class="btn-sm" data-hist-session-unrevert="${esc(sessId)}">Make all again</button>
               <button class="btn-sm btn-sm-danger" data-hist-session-delete="${esc(sessId)}">Delete entries</button>`
            : `<button class="btn-sm btn-sm-danger" data-hist-session-revert="${esc(sessId)}">Reverse all</button>`}
          <i class="ti ti-chevron-right chevron ${isOpen?'open':''}" style="margin-right:2px"></i>
        </div>
        <div class="history-session-body ${isOpen?'open':''}" id="hist-sess-${esc(sessId)}">
          ${group.map(r => this._historyRowHtml(r, true)).join('')}
        </div>
      </div>`;
    }).join('');

    list.innerHTML = note + rows + moreBtn;
    // Re-apply open session state
    for (const sessId of this._openHistorySessions) {
      document.getElementById(`hist-sess-${sessId}`)?.classList.add('open');
    }
  },

  _historyRowHtml(r, nested) {
    // When it happened; a sign-out that waited offline also says when it arrived.
    const got    = r.timestamp?.toDate ? r.timestamp.toDate() : r.timestamp ? new Date(r.timestamp) : null;
    const late   = r.placedAt && got && got - r.placedAt > 90000;
    const ts     = late ? `${fmtTime(r.placedAt)} · arrived ${fmtTime(got)}` : fmtTime(got || r.timestamp);
    const action = r.action || 'adjustment';
    const subtype = r.subtype || null;

    // Delta display varies by subtype so each function reads clearly in
    // history, rather than every adjustment looking like a generic +/-:
    //  - override:  shows "=N" (the new absolute total), not the raw delta
    //  - setup:     shows "=N" too — the initial shelf count during consumables setup
    //  - open_box:   shows "New Box" — a stocktake correction, not a real movement
    //  - everything else: a normal signed delta
    let deltaDisplay, dClass;
    if (subtype === 'override' || subtype === 'setup') {
      deltaDisplay = `=${r.newQty}`;
      dClass = 'neutral';
    } else if (subtype === 'open_box') {
      deltaDisplay = 'New box';
      dClass = 'neutral';
    } else {
      deltaDisplay = r.delta >= 0 ? `+${r.delta}` : `${r.delta}`;
      dClass = r.delta >= 0 ? 'positive' : 'negative';
    }

    const revertBtn = r.reverted
      ? `<button class="btn-sm" data-hist-unrevert="${esc(r._id)}">Make again</button>
         <button class="btn-sm btn-sm-danger" data-hist-delete="${esc(r._id)}">Delete entry</button>`
      : `<button class="btn-sm btn-sm-danger" data-hist-revert="${esc(r._id)}">Reverse</button>`;
    return `<div class="history-row${r.reverted?' reverted':''}${nested?' nested':''}">
      <span class="history-action-pill ${action}">${esc(this._actionWord(action))}</span>
      <span class="history-delta ${dClass}">${deltaDisplay}</span>
      <div style="flex:1;min-width:0">
        <div class="history-item-name">${esc(r.itemName||r.stockId||'')}</div>
        <div class="history-meta">${esc(r.by||'')}${ts ? ' · '+ts : ''}${r.newQty != null ? ` · now: ${String(r.newQty).replace('-', '−')}` : ''}${r.reverted?' · reverted':''}</div>
      </div>
      ${revertBtn}
    </div>`;
  },

  _actionWord(a) { return ({ checkout: 'Signed out', intake: 'Received', adjustment: 'Adjusted' })[a] || 'Changed'; },

  toggleHistorySession(sessId) {
    const opening = !this._openHistorySessions.has(sessId);
    if (opening) this._openHistorySessions.add(sessId); else this._openHistorySessions.delete(sessId);
    const body = document.getElementById(`hist-sess-${sessId}`);
    if (!body) { this.renderHistoryList(); return; }
    Fold.toggle(body, opening);
    body.previousElementSibling?.querySelector('.chevron')?.classList.toggle('open', opening);
  },

  async historyRevert(historyId) {
    const r = this._historyRecords.find(x => x._id === historyId);
    if (!await Ask.confirm({ title: 'Reverse this stock change?', body: r ? `${r.itemName || r.stockId}: stock goes ${r.delta < 0 ? 'up' : 'down'} by ${Math.abs(r.delta)}.` : '', yes: 'Reverse change', no: 'Keep change', danger: true })) return;
    try { await DB.revertHistoryRecord(historyId); this._histSet([historyId], { reverted: true }); }
    catch(e) { tellFailed('Not reversed', e); }
  },

  async historyUnrevert(historyId) {
    if (!await Ask.confirm({ title: 'Make this stock change again?', yes: 'Make change again', no: 'Leave reversed' })) return;
    try { await DB.unrevertHistoryRecord(historyId); this._histSet([historyId], { reverted: false }); }
    catch(e) { tellFailed('Not changed', e); }
  },

  async historyDelete(historyId) {
    if (!await Ask.confirm({ title: 'Delete this reversed entry?', body: 'This cannot be undone.', yes: 'Delete entry', no: 'Keep entry', danger: true })) return;
    try { await DB.deleteHistoryRecord(historyId); this._histSet([historyId], null); }
    catch(e) { tellFailed('Not deleted', e); }
  },
  // A change shown where it happened: the row in place, no reload, the pages kept.
  // patch null takes the entries off.
  _histSet(ids, patch) {
    const set = new Set(ids);
    if (patch) this._historyRecords.forEach(r => { if (set.has(r._id)) Object.assign(r, patch); });
    else this._historyRecords = this._historyRecords.filter(r => !set.has(r._id));
    this.renderHistoryList();
  },

  // Session-level operations: fetch all records for the session, then act on each. Each
  // is safe to repeat, so a run that stops part-way can be started again.
  // Each entry on its own, so one that fails is named and the rest still happen.
  async _historySession(sessId, ask, failed, each, patch) {
    if (!await Ask.confirm(ask)) return;
    let recs;
    try { recs = await DB.fetchSessionRecords(sessId); }
    catch (e) { tellFailed(failed, e); return; }
    const done = [], bad = [];
    let err = null;
    for (const r of recs) {
      try { if (await each(r) !== false) done.push(r._id); }
      catch (e) { err = err || e; bad.push(r.itemName || r.stockId || r._id); }
    }
    this._histSet(done, patch);
    if (bad.length) tellFailed(`${bad.length} of ${recs.length} ${failed}`, err, `Not done: ${bad.join(', ')}. Try again to finish.`);
  },
  historySessionRevert(sessId) {
    return this._historySession(sessId, { title: 'Reverse every stock change in this group?', yes: 'Reverse changes', no: 'Keep changes', danger: true },
      'not reversed', r => r.reverted ? false : DB.revertHistoryRecord(r._id), { reverted: true });
  },
  historySessionUnrevert(sessId) {
    return this._historySession(sessId, { title: 'Make every stock change in this group again?', yes: 'Make changes again', no: 'Leave reversed' },
      'not made again', r => r.reverted ? DB.unrevertHistoryRecord(r._id) : false, { reverted: false });
  },
  historySessionDelete(sessId) {
    return this._historySession(sessId, { title: 'Delete every reversed entry in this group?', body: 'This cannot be undone.', yes: 'Delete entries', no: 'Keep entries', danger: true },
      'not deleted', r => r.reverted ? DB.deleteHistoryRecord(r._id) : false, null);
  },
