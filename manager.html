    const wrap = document.getElementById('order-queue'); if (!wrap) return;
    if (!this._ordersReady) { wrap.innerHTML = skeleton(5, 'tall'); return; }
    // Preserve open card state
    wrap.querySelectorAll('.order-card-body.open:not(.shutting)').forEach(el => this._openCards.add(el.id.replace('body-', '')));
    const restoreFocus = captureInputFocus(); // snapshots re-render while qty fields are focused

    // Sent view: per-category email groups (not per-submission)
    if (this.activeView === 'sent') {
      wrap.innerHTML = this._renderSentGroups();
      for (const id of this._openCards) {
        document.getElementById(`body-${id}`)?.classList.add('open');
        document.getElementById(`chev-${id}`)?.classList.add('open');
      }
      restoreFocus();
      return;
    }

    let list = this._materialsOrders();
    if (this.activeView === 'pending')  list = list.filter(o => this._orderHasPendingItems(o));
    if (this.activeView === 'rejected') list = list.filter(o => o.status === 'rejected');
    const listIds = new Set(list.map(o => o._id));
    for (const id of this._openCards) { if (!id.startsWith('pdg-') && !listIds.has(id)) this._openCards.delete(id); }

    if (!list.length) {
      if (this.activeView === 'pending') { this._renderQueueClear(wrap); return; }
      const msgs = { sent:['ti-mail-check','No emailed orders yet.'], rejected:['ti-ban','No rejected orders.'], all:['ti-inbox','No orders yet.'] };
      const [ic, msg] = msgs[this.activeView] || msgs.all;
      wrap.innerHTML = `<div class="empty-queue"><i class="ti ${ic}"></i><p>${msg}</p></div>`;
      return;
    }
    if (this.activeView === 'pending' && !this._ordersFromCache) this._queueHadPending = true;

    // Combined section
    const pendingOrders = this._materialsOrders().filter(o => this._orderHasPendingItems(o));
    let combinedHtml = '';
    if (this.activeView === 'pending' && pendingOrders.length >= 1) {
      const groups = this._groupByCatKeepSeparate(pendingOrders);
      const cats = Object.keys(groups);
      if (cats.length) {
        const catSections = cats.map(cat => {
          const g = groups[cat];
          const isOpen = this._openCombinedCats.has(cat);
          const catKey = cat.replace(/\s/g, '_');

          // Build per-item rows — respects local _combExcluded and _combMerged state
          const itemRows = Object.values(g.byPartCode).map(pGroup => {
            const pcSafe = pGroup.partCode.replace(/[^a-zA-Z0-9]/g,'_');
            const mergeKey = `${cat}|${pGroup.partCode}`;

            // Filter out excluded lines for display purposes
            const visibleLines = pGroup.lines.filter(
              line => !this.isExcluded(cat, line.orderId, pGroup.partCode)
            );
            const excludedLines = pGroup.lines.filter(
              line => this.isExcluded(cat, line.orderId, pGroup.partCode)
            );
            const totalQty = round2(visibleLines.reduce((s, l) => s + l.qty, 0));

            // If merged, show as a single row (while there is still more than one to merge)
            if (this._combMerged.has(mergeKey) && visibleLines.length > 1) {
              const names = [...new Set(visibleLines.map(l => l.deviceName).filter(Boolean))];
              const merged = { qty: totalQty, deviceLabel: names.length === 1 ? names[0] : 'Merged' };
              return `<div class="combined-main-row">
                <div class="combined-main-info">
                  <div class="combined-main-name">${descHtml(pGroup.description)}</div>
                  <div class="combined-main-code" style="display:flex;align-items:center;gap:4px">
                    <span>${esc(pGroup.partCode)}</span>
                    <span style="opacity:0.4">·</span>
                    <span style="font-size:10px;color:var(--green-text);font-family:var(--mono);background:var(--green-bg);padding:1px 6px;border-radius:20px">Merged${merged.deviceLabel && merged.deviceLabel !== 'Merged' ? ' · ' + esc(merged.deviceLabel) : ''}</span>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                  <span style="font-size:12px;color:var(--text3);font-family:var(--mono)">${merged.qty} ${esc(pGroup.qtyType||'')}</span>
                  <button class="btn-sm" data-unmerge="${esc(cat)}" data-partcode="${esc(pGroup.partCode)}">
                    <i class="ti ti-git-branch"></i> Unmerge
                  </button>
                </div>
              </div>
              ${excludedLines.map(line => `
                <div class="combined-sub-row excluded">
                  <div class="combined-sub-device"><i class="ti ti-device-ipad" style="font-size:11px"></i><span>${esc(line.deviceName||line.orderRef||'Unknown')}</span><span style="margin-left:4px;font-size:10px">${line.submittedAt?fmtTime(line.submittedAt):''}</span><span style="font-size:10px;color:var(--text3);margin-left:4px">(excluded)</span></div>
                  <div class="excluded-acts">
                    <button class="btn-sm" data-unexclude="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">Include again</button>
                    <button class="btn-sm btn-sm-danger" data-reject-item="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}"><i class="ti ti-ban"></i> Reject</button>
                  </div>
                </div>`).join('')}`;
            }

            // originallyHadSingleLine: this partCode came from exactly one order
            // We use pGroup.lines.length (all lines, not just visible) so the layout
            // stays as a top-level row even after that one line is excluded.
            const originallyHadSingleLine = pGroup.lines.length === 1;
            const singleLine = pGroup.lines[0];  // only used in the single-line branch

            if (originallyHadSingleLine) {
              // Single-order item — render as one top-level row.
              // If excluded, grey the whole row and swap controls for a Restore button.
              const isExc = excludedLines.length === 1;
              const line = singleLine;
              const mergedDev = line.mergedDeviceName;
              const displayDevice = mergedDev === '__merged__'
                ? '<span style="font-size:10px;color:var(--green-text);font-family:var(--mono);background:var(--green-bg);padding:1px 6px;border-radius:20px">Merged</span>'
                : line.deviceName
                  ? `<span style="font-size:11px;color:var(--text3);font-family:var(--mono)">${esc(line.deviceName)}</span>${line.submittedAt ? `<span style="margin-left:4px;font-size:11px;font-family:var(--mono);white-space:nowrap;flex-shrink:0">${fmtTime(line.submittedAt)}</span>` : ''}`
                  : line.submittedAt ? `<span style="font-size:11px;font-family:var(--mono);white-space:nowrap">${fmtTime(line.submittedAt)}</span>` : '';
              return `<div class="combined-main-row${isExc ? ' excluded' : ''}">
                <div class="combined-main-info">
                  <div class="combined-main-name">${descHtml(pGroup.description)}</div>
                  <div class="combined-main-code" style="display:flex;align-items:center;gap:4px">
                    <span>${esc(pGroup.partCode)}</span>
                    ${isExc ? `<span style="opacity:0.4">·</span><span style="font-size:10px;color:var(--text3);font-family:var(--mono)">(excluded)</span>` : displayDevice ? `<span style="opacity:0.4">·</span>${displayDevice}` : ''}
                  </div>
                </div>
                ${isExc
                  ? `<div class="excluded-acts">
                      <button class="btn-sm" data-unexclude="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">Include again</button>
                      <button class="btn-sm btn-sm-danger" data-reject-item="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}"><i class="ti ti-ban"></i> Reject</button>
                    </div>`
                  : `<div class="qty-row" style="flex-shrink:0">
                      <button class="qty-btn" data-cqdec="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">−</button>
                      <input class="qty-edit" ${QtyField.attrs(line)} value="${line.qty}"
                        id="cqi-${catKey}-${pcSafe}-${esc(line.orderId)}"
                        data-cqchange="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">
                      <button class="qty-btn" data-cqinc="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">+</button>
                    </div>
                    <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:4px;min-width:40px">${esc(pGroup.qtyType||'')}</span>
                    <button class="btn-sm" data-comb-del="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}" ><i class="ti ti-eye-off"></i> Leave out</button>`
                }
              </div>`;
            } else {
              // Multiple orders for this partCode — show parent row + visible sub-rows + excluded sub-rows
              const mainRow = `<div class="combined-main-row">
                <div class="combined-main-info">
                  <div class="combined-main-name">${descHtml(pGroup.description)}</div>
                  <div class="combined-main-code">${esc(pGroup.partCode)}</div>
                </div>
                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                  <span style="font-size:12px;color:var(--text3);font-family:var(--mono)">Total: ${totalQty} ${esc(pGroup.qtyType||'')}</span>
                  <button class="btn-sm" data-comb-merge="${esc(cat)}" data-partcode="${esc(pGroup.partCode)}">
                    <i class="ti ti-git-merge"></i> Merge
                  </button>
                </div>
              </div>`;
              const subRows = visibleLines.map(line => `
                <div class="combined-sub-row">
                  <div class="combined-sub-device">
                    <i class="ti ti-device-ipad" style="font-size:11px;color:var(--text3);flex-shrink:0"></i>
                    <span>${esc(line.deviceName || 'Unknown')}</span>
                    ${line.submittedAt ? `<span style="margin-left:4px;white-space:nowrap;flex-shrink:0">${fmtTime(line.submittedAt)}</span>` : ''}
                  </div>
                  <div class="qty-row" style="flex-shrink:0">
                    <button class="qty-btn" data-cqdec="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">−</button>
                    <input class="qty-edit" ${QtyField.attrs(line)} value="${line.qty}"
                      id="cqi-${catKey}-${pcSafe}-${esc(line.orderId)}"
                      data-cqchange="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">
                    <button class="qty-btn" data-cqinc="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">+</button>
                  </div>
                  <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:4px;min-width:40px;flex-shrink:0">${esc(line.qtyType||'')}</span>
                  <button class="btn-sm" data-comb-del="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}" ><i class="ti ti-eye-off"></i> Leave out</button>
                </div>`).join('');
              const excludedRowsHtml = excludedLines.map(line => `
                <div class="combined-sub-row excluded">
                  <div class="combined-sub-device">
                    <i class="ti ti-eye-off" style="font-size:11px"></i>
                    <span>${esc(line.deviceName||line.orderRef||'Unknown')}</span>
                    ${line.submittedAt ? `<span style="margin-left:4px;font-size:10px">${fmtTime(line.submittedAt)}</span>` : ''}
                    <span style="font-size:10px;color:var(--text3);margin-left:4px">(excluded)</span>
                  </div>
                  <div class="excluded-acts">
                    <button class="btn-sm" data-unexclude="${esc(cat)}" data-order-id="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}">Include again</button>
                    <button class="btn-sm btn-sm-danger" data-reject-item="${esc(line.orderId)}" data-partcode="${esc(pGroup.partCode)}"><i class="ti ti-ban"></i> Reject</button>
                  </div>
                </div>`).join('');
              return mainRow + subRows + excludedRowsHtml;
            }
          }).join('');

          return `<div style="border-bottom:2px solid var(--border)">
            <div class="combined-header" role="button" tabindex="0" data-comb-cat="${esc(cat)}">
              <div style="display:flex;align-items:center;gap:8px">
                ${catTile(cat, 'sm')}
                <span style="font-size:13px;font-weight:500">${esc(cat)}</span>
                <span style="font-size:11px;color:var(--text3);font-family:var(--mono)">${Object.keys(g.byPartCode).length} item${Object.keys(g.byPartCode).length!==1?'s':''}</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <button class="btn-sm" data-cat-email="${esc(cat)}">
                  <i class="ti ti-mail"></i> Write email
                </button>
                <i class="ti ti-chevron-right chevron ${isOpen?'open':''}" id="comb-chev-${catKey}"></i>
              </div>
            </div>
            <div class="combined-cat-body ${isOpen?'open':''}" id="comb-body-${catKey}">${itemRows}</div>
          </div>`;
        }).join('');

        combinedHtml = `<div class="combined-card">
          <div style="padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg)">
            <div style="font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px">
              <i class="ti ti-layers-union"></i> Send all pending by category
            </div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px">Expand a category to review quantities and device sources before emailing.</div>
          </div>
          ${catSections}
        </div>`;
      }
    }

    if (this.activeView === 'pending') {
      // Lines put back from an earlier email can be shown together, by that email. The
      // choice only appears when there are such lines.
      const dGroups = this._buildPendingDeliveryGroups(list);
      const sortMode = dGroups.length ? this._queueSortMode : 'order';
      const opt = (v, label) => `<button type="button" class="${sortMode === v ? 'on' : ''}" data-queue-sort="${v}" aria-pressed="${sortMode === v}">${label}</button>`;
      const sortBar = dGroups.length ? `<div class="queue-sort"><span>Sort</span><div class="seg" role="group" aria-label="Sort">${opt('order', 'By order')}${opt('delivery', 'By delivery')}</div></div>` : '';
      let deliveryGroupsHtml = '', inDeliveryGroup = null;
      if (sortMode === 'delivery') {
        inDeliveryGroup = new Set();
        for (const g of dGroups) for (const { order, item } of g.entries) inDeliveryGroup.add(`${order._id}:::${String(item.id)}`);
        deliveryGroupsHtml = dGroups.map(g => this._pendingDeliveryGroupCard(g)).join('');
      }
      wrap.innerHTML = combinedHtml + sortBar + deliveryGroupsHtml + list.map(o => this._orderCard(o, inDeliveryGroup)).join('');
    } else {
      wrap.innerHTML = combinedHtml + list.map(o => this._orderCard(o)).join('');
    }
    for (const id of this._openCards) {
      document.getElementById(`body-${id}`)?.classList.add('open');
      document.getElementById(`chev-${id}`)?.classList.add('open');
    }
    restoreFocus();
  },

  // ── SENT VIEW: per-delivery groups ───────────────────────────────────
  // Each card = one delivery — everything emailed together in one real send, which may
  // span multiple orders (see Intake.buildCategoryGroups). Uses the same grouping as the
  // Deliveries page so "what's been sent" reads the same way in both places.
  _renderSentGroups() {
    const matGroups  = Intake.buildCategoryGroups(this.orders, 'materials');
    const consGroups = Intake.buildCategoryGroups(this.orders, 'consumables');
    // Materials groups are already emailed-only by construction; consumables' eligibility
    // filter isn't (it includes not-yet-emailed items too), so filter explicitly here —
    // mirrors the original check that every non-rejected item in the group is emailed.
    const sentGroups = [...matGroups, ...consGroups].filter(g => g.entries.every(({ item }) => !!item.emailed));
    if (!sentGroups.length) {
      return `<div class="empty-queue"><i class="ti ti-mail-check"></i><p>No emailed orders yet.</p></div>`;
    }
    return sentGroups.map(g => this._sentGroupCard(g.groupKey, g.category, g.entries)).join('');
  },

  _sentGroupCard(groupKey, category, entries) {
    const distinctOrderIds = [...new Set(entries.map(e => e.order._id))];
    const submittedDates = entries
      .map(e => e.order.submittedAt?.toDate ? e.order.submittedAt.toDate() : (e.order.submittedAt || null))
      .filter(Boolean);
    const emailed = entries.map(e => e.item.emailedAt).filter(Boolean);
    const ts = emailed.length ? 'Emailed ' + fmtTime(new Date(Math.max(...emailed)))
      : submittedDates.length
      ? fmtTime(new Date(Math.min(...submittedDates.map(d => d instanceof Date ? d.getTime() : new Date(d).getTime()))))
      : '';
    const deviceNames = [...new Set(entries.map(e => e.order.deviceName || ''))].filter(Boolean);
    const deviceLabel = deviceNames.length === 0 ? '' : (deviceNames.length === 1 ? deviceNames[0] : 'Multiple devices');
    const safeKey = `sent-${groupKey.replace(/[^a-zA-Z0-9]/g,'_')}`;
    const isOpen  = this._openCards.has(safeKey);
    return `<div class="order-card" id="card-${esc(safeKey)}">
      <div class="order-card-header" role="button" tabindex="0" data-card-id="${esc(safeKey)}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%">
          <div>
            <div class="order-ref-text">${esc(category)}</div>
            <div class="order-meta">${ts}${deviceLabel ? ' · ' + esc(deviceLabel) : ''} · ${entries.length} line${entries.length!==1?'s':''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="status-pill status-sent">Sent</span>
            <i class="ti ti-chevron-right chevron${isOpen?' open':''}" id="chev-${esc(safeKey)}"></i>
          </div>
        </div>
      </div>
      <div class="order-card-body${isOpen?' open':''}" id="body-${esc(safeKey)}">
        ${(() => {
          const byItemId = new Map();
          for (const { item, order } of entries) {
            const key = Intake.mergeKey(item);
            if (!byItemId.has(key)) byItemId.set(key, { item, totalQty: 0, orders: [] });
            const b = byItemId.get(key); b.totalQty += (item.qty || 0); b.orders.push({ item, order });
          }
          return [...byItemId.values()].map(({ item, totalQty, orders }) => `
          <div class="order-line">
            <div class="order-line-info">
              <div class="order-line-name">${descHtml(item.description)}</div>
              <div class="order-line-code">${esc(item.partCode)}${orders.length > 1 ? ` &middot; ${orders.length} orders` : distinctOrderIds.length > 1 ? ' &middot; ' + esc(orders[0].order.deviceName || orders[0].order.ref || orders[0].order._id) : ''}</div>
            </div>
            <div class="order-line-right">
              <span class="emailed-badge"><i class="ti ti-mail-check"></i> Emailed</span>
              <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:4px">× ${totalQty}${item.qtyType ? ' ' + esc(item.qtyType) : ''}</span>
            </div>
          </div>`).join('');
        })()}
        <div class="order-card-actions">
          <button class="btn btn-outline" data-put-back="${esc(groupKey)}" style="margin-bottom:4px">
            <i class="ti ti-arrow-back-up"></i> ${entries[0].order.type === 'consumables' ? 'Put back in the cart' : 'Put back to pending'}
          </button>
        </div>
      </div>
    </div>`;
  },

  // Group pending items by category, then by partCode, keeping separate sub-lines per order
  _groupByCatKeepSeparate(orders) {
    const groups = {};
    for (const order of orders) {
      for (const item of (order.items || [])) {
        if (item.emailed || item.rejected) continue;
        const cat = item.category || 'Uncategorised';
        if (!groups[cat]) groups[cat] = { byPartCode: {} };
        const pc = item.partCode;
        if (!groups[cat].byPartCode[pc]) {
          groups[cat].byPartCode[pc] = {
            partCode: pc,
            description: item.description,
            qtyType: item.qtyType || '',
            lines: [],
          };
        }
        const existing = groups[cat].byPartCode[pc].lines.find(l => l.orderId === order._id);
        if (existing) {
          existing.qty += item.qty;
        } else {
          groups[cat].byPartCode[pc].lines.push({
            orderId:           order._id,
            orderRef:          order.ref || order._id,
            deviceName:        order.deviceName || '',
            mergedDeviceName:  item.mergedDeviceName || null,  // set on item after a merge
            submittedAt:       order.submittedAt?.toDate ? order.submittedAt.toDate() : (order.submittedAt || null),
            qty:               item.qty,
            qtyType:           item.qtyType || '',
          });
        }
      }
    }
    return groups;
  },

  toggleCombinedCat(cat) {
    const key = cat.replace(/\s/g, '_');
    const body = document.getElementById(`comb-body-${key}`);
    const chev = document.getElementById(`comb-chev-${key}`);
    if (!body) return;
    const opening = !Fold.isOpen(body);
    Fold.toggle(body, opening);
    chev?.classList.toggle('open', opening);
    if (opening) this._openCombinedCats.add(cat); else this._openCombinedCats.delete(cat);
  },

  // ── LOCAL-ONLY combined view operations (never write to Firebase) ──

  // Exclude a line from the email view (greyed out, still in Firebase)
  excludeCombinedLine(cat, orderId, partCode) {
    const key = `${cat}|${partCode}|${orderId}`;
    this._combExcluded.add(key);
    this._keepStaged();
    this.renderQueue();
  },

  unexcludeLine(cat, orderId, partCode) {
    const key = `${cat}|${partCode}|${orderId}`;
    this._combExcluded.delete(key);
    this._keepStaged();
    this.renderQueue();
  },

  isExcluded(cat, orderId, partCode) {
    return this._combExcluded.has(`${cat}|${partCode}|${orderId}`);
  },

  // Show a part code's lines as one row. Only how it is shown: the quantity is always
  // added up from the live lines, so a later edit or a new order is never left behind.
  localMergeLines(cat, partCode) {
    if (!cat || !partCode) return;
    this._combMerged.add(`${cat}|${partCode}`);
    this._keepStaged();
    this.renderQueue();
  },

  unmergeLines(cat, partCode) {
    this._combMerged.delete(`${cat}|${partCode}`);
    this._keepStaged();
    this.renderQueue();
  },

  // Excluded and merged lines survive a reload. Kept per database, and tidied as orders
  // arrive: a line that is no longer waiting to be emailed has nothing to exclude.
  _stagedKey() { return `mo_queue_staged${FirebaseConfig.isTestMode() ? '_test' : ''}`; },
  _keepStaged() {
    try { localStorage.setItem(this._stagedKey(), JSON.stringify({ excluded: [...this._combExcluded], merged: [...this._combMerged] })); } catch {}
  },
  _loadStaged() {
    try {
      const v = JSON.parse(localStorage.getItem(this._stagedKey()) || '{}');
      this._combExcluded = new Set(v.excluded || []);
      this._combMerged   = new Set(v.merged || []);
    } catch {}
  },
  _tidyStaged() {
    if (!this.orders.length || !(this._combExcluded.size || this._combMerged.size)) return;
    const lines = new Set(), parts = new Set();
    for (const o of this._materialsOrders()) {
      if (o.status === 'rejected') continue;
      for (const i of (o.items || [])) {
        if (i.emailed || i.rejected) continue;
        lines.add(`${i.category}|${i.partCode}|${o._id}`); parts.add(`${i.category}|${i.partCode}`);
      }
    }
    const before = this._combExcluded.size + this._combMerged.size;
    for (const k of [...this._combExcluded]) if (!lines.has(k)) this._combExcluded.delete(k);
    for (const k of [...this._combMerged])   if (!parts.has(k)) this._combMerged.delete(k);
    if (this._combExcluded.size + this._combMerged.size !== before) this._keepStaged();
  },

  // Rejecting acts at once and offers to undo: nothing is lost, it only leaves the queue.
  async rejectOrder(id) {
    const o = this.orders.find(x => x._id === id), was = (o && o.status) || 'pending';
    try {
      await DB.rejectOrder(id);
      this._toast(`${(o && o.ref) || 'Order'} rejected`, false, { label: 'Undo', run: () => DB.updateStatus(id, was === 'rejected' ? 'pending' : was).catch(e => tellFailed('Not undone', e)) });
    } catch (e) { tellFailed('Not rejected', e); }
  },

  async rejectItem(orderId, partCode) {
    // Remove from local exclusions
    for (const key of [...this._combExcluded]) {
      if (key.endsWith(`|${partCode}|${orderId}`)) this._combExcluded.delete(key);
    }
    this._keepStaged();
    try {
      await DB.rejectItem(orderId, partCode);
      this._toast(`${partCode} rejected`, false, { label: 'Undo', run: () => this.unrejectItem(orderId, partCode) });
    } catch (e) { tellFailed('Not rejected', e); }
  },

  // Undo for rejectItem — restoring is safe (the line just goes back to pending and
  // reappears in the combined list), so no question.
  async unrejectItem(orderId, partCode) {
    try { await DB.unrejectItem(orderId, partCode); } catch (e) { tellFailed('Not put back', e); }
  },

  // ── PUTTING AN EMAIL BACK ────────────────────────────────────────────
  // For an email that was marked as sent and wasn't, or went out wrong. Material lines go
  // back to the queue; consumables have no queue, so theirs go back to the cart.
  async putBackDelivery(groupKey) {
    const groups = [...Intake.buildCategoryGroups(this.orders, 'materials'), ...Intake.buildCategoryGroups(this.orders, 'consumables')];
    const g = groups.find(x => x.groupKey === groupKey); if (!g) return;
    const cons = g.entries[0].order.type === 'consumables';
    const total = new Map();
    for (const { item } of g.entries) {
      const k = Intake.mergeKey(item);
      if (!total.has(k)) total.set(k, { item, qty: 0 });
      total.get(k).qty = round2(total.get(k).qty + (item.qty || 0));
    }
    // The warehouse ticking it off means the supplier did get it: say so before undoing that.
    const ticked  = g.entries.filter(({ item, order }) => Intake._itemStatus(order, item) !== 'pending').length;
    const inStock = Intake.appliedStockTotal(g.entries) > 0;
    const body = [
      ticked  ? `${ticked} of ${g.entries.length} line${g.entries.length !== 1 ? 's' : ''} already ticked off on the delivery. That will be cleared.` : '',
      inStock ? 'What was added to stock stays in stock.' : '',
    ].filter(Boolean).join(' ');
    const go = await Ask.confirm({
      title: cons ? `Put ${g.category} back in the cart?` : `Put ${g.category} back to pending?`, body,
      rows: [...total.values()].map(({ item, qty }) => [item.description, orderQtyDisplay(item, qty)]),
      yes: cons ? 'Put back in the cart' : 'Put back to pending', no: 'Keep as sent', danger: ticked > 0 || inStock,
    });
    if (go) await this._putBack({
      what: g.category, keys: [groupKey], orderIds: g.entries.map(e => e.order._id),
      toCart: cons ? g.entries.map(e => e.item) : null,
    });
  },

  // { what, keys, orderIds, toCart: the lines to return to the consumables cart, or null }
  async _putBack(p) {
    if (this._opBusy.has('putBack')) return;
    this._opBusy.add('putBack');
    if (p.toCart) this._owe(p);
    try {
      let go = true;
      while (go) {
        try {
          if (navigator.onLine === false) throw Object.assign(new Error('offline'), { code: 'unavailable' });
          await DB.putBackEmail(p.orderIds, p.keys, !!p.toCart);
          if (p.toCart) this._payCart(p);
          this._toast(p.toCart ? `${p.what} is back in the cart` : `${p.what} is back to pending`);
          return true;
        } catch (e) {
          console.error('Put back failed:', e);
          const why = whyFailed(e);
          go = await Ask.confirm({ title: 'Not put back', body: `${why[0].toUpperCase()}${why.slice(1)}.${nothingDone(e, 'Nothing was changed.')}`, yes: 'Try again', no: 'Later' });
        }
      }
      return false;
    } finally { this._opBusy.delete('putBack'); this._settleOwed(); }
  },

  // Lines on their way from an order back to the cart. They are noted on this PC first: if
  // the reply is lost (or the page closed) the order may be gone with its lines in neither
  // place, so the note is kept until the server says which.
  _owed: [],
  _owedKey() { return `mo_put_back${FirebaseConfig.isTestMode() ? '_test' : ''}`; },
  _keepOwed() { try { localStorage.setItem(this._owedKey(), JSON.stringify(this._owed)); } catch {} },
  _loadOwed() { try { this._owed = JSON.parse(localStorage.getItem(this._owedKey()) || '[]') || []; } catch { this._owed = []; } },
  _sameOwed(a, b) { return a.keys.join() === b.keys.join(); },
  _owe(p) {
    this._owed = [...this._owed.filter(o => !this._sameOwed(o, p)), { what: p.what, keys: p.keys, orderIds: p.orderIds, toCart: p.toCart }];
    this._keepOwed();
  },
  _payCart(p) {
    p.toCart.forEach(i => this._cartAdd('co', i));
    this._updateCoBadge(); this.renderCoList();
    this._owed = this._owed.filter(o => !this._sameOwed(o, p)); this._keepOwed();
  },
  async _settleOwed() {
    if (!this._owed.length || this._opBusy.has('putBack')) return;
    this._opBusy.add('putBack');
    try {
      for (const p of this._owed.slice()) {
        if (await DB.emailedLines(p.orderIds, p.keys)) { this._owed = this._owed.filter(o => o !== p); this._keepOwed(); }   // it never happened
        else { this._payCart(p); this._toast(`${p.what} is back in the cart`); }
      }
    } catch { /* not connected: the next change to the orders tries again */ }
    finally { this._opBusy.delete('putBack'); }
  },

  async putBackOrder(id) {
    const o = this.orders.find(x => x._id === id); if (!o) return;
    const lines = (o.items || []).filter(i => i.emailed);
    const ticked = lines.filter(i => Intake._itemStatus(o, i) !== 'pending').length;
    if (!await Ask.confirm({
      title: 'Put this order\u2019s emailed lines back to pending?',
      body: ticked ? `${ticked} of ${lines.length} line${lines.length !== 1 ? 's' : ''} already ticked off on the delivery. That will be cleared.` : '',
      rows: lines.map(i => [i.description, orderQtyDisplay(i, i.qty)]),
      yes: 'Put back to pending', no: 'Keep as sent', danger: ticked > 0,
    })) return;
    await this._putBack({ what: o.ref || 'The order', orderIds: [id], toCart: null,
      keys: [...new Set(lines.map(i => i.deliveryId || `legacy:${id}:${i.category}`))] });
  },

  async stepCombinedSubQty(cat, orderId, partCode, delta) {
    if (!partCode) return;
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const items = [...order.items];
    const idx = items.findIndex(i => i.category === cat && i.partCode === partCode && !i.emailed);
    if (idx < 0) return;
    const newQty = Math.max(0, round2((items[idx].qty || 0) + delta));
    items[idx] = { ...items[idx], qty: newQty };
    const catKey = cat.replace(/\s/g, '_');
    const pcSafe = partCode.replace(/[^a-zA-Z0-9]/g,'_');
    const inp = document.getElementById(`cqi-${catKey}-${pcSafe}-${orderId}`);
    if (inp) { inp.value = newQty; inp.defaultValue = newQty; inp._before = newQty; }
    try { await DB.updateItems(orderId, items); } catch (e) { tellFailed('Quantity not saved', e); this.renderQueue(); }
  },

  async editCombinedSubQty(cat, orderId, partCode, qty) {
    if (!partCode) return;
    const order = this.orders.find(o => o._id === orderId); if (!order) return;
    const items = [...order.items];
    const idx = items.findIndex(i => i.category === cat && i.partCode === partCode && !i.emailed);
    if (idx < 0) return;
    items[idx] = { ...items[idx], qty };
    try { await DB.updateItems(orderId, items); } catch (e) { tellFailed('Quantity not saved', e); this.renderQueue(); }
  },

  _orderCard(o, inDeliveryGroup) {
    const items     = o.items || [];
    if (inDeliveryGroup) {
      const hasPendingOutside = items.some(i => !i.emailed && !i.rejected && !inDeliveryGroup.has(`${o._id}:::${String(i.id)}`));
      if (!hasPendingOutside && this._orderHasPendingItems(o)) return '';
    }
    // Received by the server — and when the device placed it, if that was
    // noticeably earlier (an order that waited offline on an iPad).
    const received = o.submittedAt?.toDate ? o.submittedAt.toDate() : null;
    const placed   = o.placedAt ? new Date(o.placedAt) : null;
    const ts = (received ? fmtTime(received) : fmtTime(o.submittedAt))
      + (received && placed && received - placed > 90000 ? ` · submitted ${fmtTime(placed)}` : '');
    const isPending = this._orderHasPendingItems(o);
    const isSent    = this._orderIsFullySent(o);
    const isRejected = o.status === 'rejected';
    const statusLabel = isPending ? 'Pending review' : isSent ? 'Sent' : isRejected ? 'Rejected' : o.status;
    const statusClass = isPending ? 'status-pending' : isSent ? 'status-sent' : isRejected ? 'status-rejected' : 'status-pending';

    const allRows = items.map((item, idx) => {
      if (inDeliveryGroup && !item.emailed && !item.rejected && inDeliveryGroup.has(`${o._id}:::${String(item.id)}`)) return '';
      return `
      <div class="order-line ${item.emailed ? 'emailed' : ''} ${item.rejected ? 'rejected-line' : ''}">
        <div class="order-line-info">
          <div class="order-line-name">${descHtml(item.description)}</div>
          <div class="order-line-code">${esc(item.partCode)}</div>
        </div>
        <div class="order-line-right">
          ${item.rejected
            ? `<span class="status-pill status-rejected" style="font-size:10px;padding:2px 8px"><i class="ti ti-ban"></i> Rejected</span>
               <button class="btn-sm" data-unreject-item="${esc(o._id)}" data-partcode="${esc(item.partCode)}"
                 title="Put this line back to pending">
                 <i class="ti ti-arrow-back-up"></i> Put back
               </button>`
            : item.emailed
              ? `<span class="emailed-badge"><i class="ti ti-mail-check"></i> Emailed</span>
                 <button class="btn-sm" data-reset-item="${o._id}" data-category="${esc(item.category)}" data-partcode="${esc(item.partCode)}"><i class="ti ti-arrow-back-up"></i> Put back</button>`
              : isPending
                ? `<span class="order-line-qty">× ${item.qty}</span>
                  <button class="btn-sm btn-sm-danger line-reject" data-reject-item="${esc(o._id)}" data-partcode="${esc(item.partCode)}"><i class="ti ti-ban"></i> Reject</button>`
                : `<span class="order-line-qty">× ${item.qty}</span>`}
          <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:6px">${esc(item.qtyType||'')}</span>
        </div>
      </div>`;
    }).join('');

    const pendingItems = items.filter(i => !i.emailed && !i.rejected && !(inDeliveryGroup && inDeliveryGroup.has(`${o._id}:::${String(i.id)}`)));
    const emailedItems = items.filter(i =>  i.emailed);
    const pendingCats  = [...new Set(pendingItems.map(i => i.category))];
    // Always show reject/delete for empty orders or rejected orders
    const catEmailBtns = isRejected ? `
      <span class="status-pill status-rejected"><i class="ti ti-ban"></i> Rejected</span>
      <button class="btn btn-outline" data-reset-order="${o._id}" style="margin-top:8px">
        <i class="ti ti-arrow-back-up"></i> Put back to pending
      </button>
      <button class="btn btn-outline" data-delete="${o._id}" style="margin-top:4px">
        <i class="ti ti-trash"></i> Delete record
      </button>` : isPending && pendingCats.length ? `
      ${pendingCats.map(cat => { const n = this._categoryLines(cat).orders; return `
        <button class="btn btn-outline" data-cat-email="${esc(cat)}" style="margin-bottom:6px">
          <i class="ti ti-mail"></i> Email all pending ${esc(cat)} (${n} order${n !== 1 ? 's' : ''})
        </button>`; }).join('')}
      ${emailedItems.length > 0 ? `
        <button class="btn btn-outline" data-put-back-order="${o._id}" style="margin-bottom:4px">
          <i class="ti ti-arrow-back-up"></i> Put emailed lines back to pending
        </button>` : ''}
      <button class="btn btn-danger" data-reject-order="${o._id}" style="margin-top:2px">
        <i class="ti ti-ban"></i> Reject order
      </button>` : isPending && items.length === 0 ? `
      <button class="btn btn-danger" data-reject-order="${o._id}">
        <i class="ti ti-ban"></i> Reject order
      </button>
      <button class="btn btn-outline" data-delete="${o._id}" style="margin-top:4px">
        <i class="ti ti-trash"></i> Delete record
      </button>` : isSent ? `
      <span class="sent-stamp"><i class="ti ti-circle-check"></i> All emailed</span>
      <button class="btn btn-outline" data-put-back-order="${o._id}" style="margin-top:8px">
        <i class="ti ti-arrow-back-up"></i> Put all lines back to pending
      </button>
      <button class="btn btn-outline" data-delete="${o._id}" style="margin-top:4px">
        <i class="ti ti-trash"></i> Delete record
      </button>` : '';

    return `<div class="order-card" id="card-${o._id}">
      <div class="order-card-header" role="button" tabindex="0" data-card-id="${o._id}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%">
          <div>
            <div class="order-ref-text">${esc(o.ref||o._id)}</div>
            <div class="order-meta">${ts}${o.deviceName ? ' · ' + esc(o.deviceName) : ''} · ${items.length} line${items.length!==1?'s':''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="status-pill ${statusClass}">${statusLabel}</span>
            <i class="ti ti-chevron-right chevron" id="chev-${o._id}"></i>
          </div>
        </div>
      </div>
      <div class="order-card-body" id="body-${o._id}">
        ${this._orderNoteHtml(o, isPending)}
        ${allRows}
        <div class="order-card-actions">${catEmailBtns}</div>
      </div>
    </div>`;
  },

  // ── ORDER NOTES ──────────────────────────────────────────────────────
  // A note rides on the order document for the manager's eyes only: typed on
  // the worker's or manager's confirmation screen, shown and editable on the
  // queue card, and deliberately never copied into the email or a delivery.
  _orderNoteHtml(o, isPending) {
    const id = o._id, note = (o.note || '').trim();
    if (this._noteEditing.has(id)) {
      return `<div class="order-note">
        <div class="order-note-head"><i class="ti ti-message-2"></i> Order note</div>
        <textarea class="order-note-input" id="onote-input-${esc(id)}" rows="3" placeholder="Anything the manager should know about this order">${esc(note)}</textarea>
        <div class="order-note-actions">
          <button class="btn-sm btn-sm-save" data-note-save="${esc(id)}">Save note</button>
          <button class="btn-sm" data-note-cancel="${esc(id)}">Don't save</button>
        </div>
      </div>`;
    }
    if (!note) return isPending ? `<button class="order-note-add" data-note-edit="${esc(id)}"><i class="ti ti-message-plus"></i> Add a note</button>` : '';
    return `<div class="order-note">
      <div class="order-note-head"><i class="ti ti-message-2"></i> Order note${o.deviceName ? ' · ' + esc(o.deviceName) : ''}${isPending ? `<button class="btn-sm" data-note-edit="${esc(id)}">Edit</button>` : ''}</div>
      <div class="order-note-text">${esc(note)}</div>
    </div>`;
  },
  // Read-only notes from every order contributing to a delivery-sorted group,
  // since that view can hide the order cards themselves.
  _groupNotesHtml(entries) {
    const seen = new Set(); let html = '';
    for (const { order } of entries) {
      const note = (order.note || '').trim();
      if (!note || seen.has(order._id)) continue;
      seen.add(order._id);
      html += `<div class="order-note"><div class="order-note-head"><i class="ti ti-message-2"></i> Note · ${esc(order.deviceName || order.ref || order._id)}</div><div class="order-note-text">${esc(note)}</div></div>`;
    }
    return html;
  },
  noteEdit(id)   { this._noteEditing.add(id); this.renderQueue(); document.getElementById(`onote-input-${id}`)?.focus(); },
  noteCancel(id) { this._noteEditing.delete(id); this.renderQueue(); },
  async noteSave(id) {
    const ta = document.getElementById(`onote-input-${id}`); if (!ta) return;
    try { await DB.updateOrderNote(id, ta.value); this._noteEditing.delete(id); this.renderQueue(); }
    catch (e) { tellFailed('Note not saved', e, 'Click Save note to try again.'); }
  },

  // Groups pending items that have a deliveryId by delivery+category — these are
  // items previously emailed (and hence assigned a deliveryId) but then reset to
  // pending, which kept their deliveryId. In "by delivery" sort mode these show
  // as grouped cards so the manager can see which items belong to the same delivery.
  _buildPendingDeliveryGroups(pendingOrders) {
    const byKey = new Map();
    for (const order of pendingOrders) {
      for (const item of (order.items || [])) {
        if (item.emailed || item.rejected || !item.deliveryId) continue;
        const key = `${item.deliveryId}|||${item.category}`;
        if (!byKey.has(key)) byKey.set(key, { deliveryId: item.deliveryId, category: item.category, entries: [] });
        byKey.get(key).entries.push({ item, order });
      }
    }
    return [...byKey.values()];
  },

  _pendingDeliveryGroupCard(group) {
    const { deliveryId, category, entries } = group;
    const safeKey = `pdg-${(deliveryId + category).replace(/[^a-zA-Z0-9]/g, '_')}`;
    const isOpen  = this._openCards.has(safeKey);
    const deviceNames = [...new Set(entries.map(e => e.order.deviceName || '').filter(Boolean))];
    const deviceLabel = deviceNames.length === 0 ? '' : deviceNames.length === 1 ? deviceNames[0] : 'Multiple devices';
    const submittedDates = entries
      .map(e => e.order.submittedAt?.toDate ? e.order.submittedAt.toDate() : (e.order.submittedAt || null))
      .filter(Boolean);
    const ts = submittedDates.length
      ? fmtTime(new Date(Math.min(...submittedDates.map(d => d instanceof Date ? d.getTime() : new Date(d).getTime()))))
      : '';

    const byItemId = new Map();
    for (const { item, order } of entries) {
      const key = Intake.mergeKey(item);
      if (!byItemId.has(key)) byItemId.set(key, { item, totalQty: 0, subEntries: [] });
      const b = byItemId.get(key); b.totalQty += (item.qty || 0); b.subEntries.push({ item, order });
    }

    const itemRows = [...byItemId.values()].map(({ item, totalQty, subEntries }) => {
      if (subEntries.length === 1) {
        const { item: i, order } = subEntries[0];
        const idx = (order.items || []).indexOf(i);
        return `<div class="order-line">
          <div class="order-line-info">
            <div class="order-line-name">${descHtml(i.description)}</div>
            <div class="order-line-code">${esc(i.partCode)}</div>
          </div>
          <div class="order-line-right">
            <span class="order-line-qty">× ${i.qty}</span>
            <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:6px">${esc(i.qtyType||'')}</span>
          </div>
        </div>`;
      }
      const showCode = item.partCode && !Data.isDummyCode(item.partCode);
      return `<div class="intake-merged-block">
        <div class="intake-merged-header">
          <div class="intake-item-name">${descHtml(item.description)}</div>
          ${showCode ? `<div class="intake-item-code">${esc(item.partCode)}</div>` : ''}
          <div class="intake-item-ordered">Total: <strong>${totalQty}</strong>${item.qtyType ? ' ' + esc(item.qtyType) : ''}</div>
        </div>
        ${subEntries.map(({ item: i, order }) => {
          const idx = (order.items || []).indexOf(i);
          return `<div class="order-line">
            <div class="order-line-info"><div class="order-line-code">${esc(order.deviceName || order.ref || order._id)}</div></div>
            <div class="order-line-right">
              <span class="order-line-qty">× ${i.qty}</span>
              <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:6px">${esc(i.qtyType||'')}</span>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('');

    return `<div class="order-card pending-delivery-group" id="card-${safeKey}">
      <div class="order-card-header" role="button" tabindex="0" data-card-id="${safeKey}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%">
          <div>
            <div class="order-ref-text">${esc(category)}</div>
            <div class="order-meta">${ts}${deviceLabel ? ' · ' + esc(deviceLabel) : ''} · ${entries.length} line${entries.length!==1?'s':''} · from delivery</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="status-pill status-pending">Pending</span>
            <i class="ti ti-chevron-right chevron${isOpen?' open':''}" id="chev-${safeKey}"></i>
          </div>
        </div>
      </div>
      <div class="order-card-body${isOpen?' open':''}" id="body-${safeKey}">
        ${this._groupNotesHtml(entries)}
        <div class="edit-note">Put back from an earlier email.</div>
        ${itemRows}
      </div>
    </div>`;
  },

  toggleCard(id) {
    const body = document.getElementById(`body-${id}`);
    const chev = document.getElementById(`chev-${id}`);
    if (!body) return;
    const opening = !Fold.isOpen(body);
    Fold.toggle(body, opening);
    chev?.classList.toggle('open', opening);
    if (opening) this._openCards.add(id); else this._openCards.delete(id);
  },

  async deleteOrder(id) {
    const o = this.orders.find(x => x._id === id), n = ((o && o.items) || []).length;
    if (!await Ask.confirm({ title: `Delete ${(o && o.ref) || 'this order'}?`, body: `${n} line${n !== 1 ? 's' : ''}. This cannot be undone.`, yes: 'Delete order', no: 'Keep order', danger: true })) return;
    try { await DB.deleteOrder(id); this._toast('Order deleted'); } catch(e) { tellFailed('Not deleted', e); }
  },

  async resetItemEmailed(orderId, category, partCode) {
    try { await DB.resetItemEmailed(orderId, category, partCode); this._toast(`${partCode} is back to pending`); }
    catch(e) { tellFailed('Not put back', e); }
  },

  async restoreOrder(orderId) {
    const o = this.orders.find(x => x._id === orderId);
    try { await DB.restoreOrder(orderId); this._toast(`${(o && o.ref) || 'Order'} is back in the queue`); }
    catch(e) { tellFailed('Not put back', e); }
  },

  // ══════════════════════════════════════════
  // EMAIL
  // ══════════════════════════════════════════
  // What emailing a category covers right now: every pending line of it in every order,
  // less the excluded ones.
  _categoryLines(category) {
    const byPart = new Map(), lines = [], orders = new Set();   // lines: exactly what the email will say, order by order
    let excluded = 0;
    for (const order of this._materialsOrders().filter(o => this._orderHasPendingItems(o))) {
      for (const item of (order.items || [])) {
        if (item.emailed || item.rejected || item.category !== category) continue;
        if (this.isExcluded(category, order._id, item.partCode)) { excluded++; continue; }
        lines.push({ orderId: order._id, key: DB.lineKey(item), qty: item.qty, description: item.description });
        orders.add(order._id);
        const k = Intake.mergeKey(item);
        if (!byPart.has(k)) byPart.set(k, { ...item, qty: 0 });
        byPart.get(k).qty = round2(byPart.get(k).qty + (item.qty || 0));
      }
    }
    return { lines, items: [...byPart.values()], orders: orders.size, excluded };
  },

  openCategoryEmail(category) {
    const { lines, items, orders, excluded } = this._categoryLines(category);
    if (!items.length) { this._toast(`Every ${category} line is excluded`, true); return; }
    const n = items.length;
    this._openEmail({
      kind: 'queue', category, lines, what: category,
      covers: `${n} line${n !== 1 ? 's' : ''} from ${orders} order${orders !== 1 ? 's' : ''}`,
      // One deliveryId shared across every contributing order — this is what lets the
      // Deliveries page and Sent tab collapse a multi-order send into one card instead
      // of one per order.
      deliveryId: genDeliveryId(),
    }, category, buildCategoryEmail(items, category, 'Material Order'), excluded);
  },

  // Every email goes through here. The draft says what "Email sent" will record; opening
  // one replaces any other, and closing the panel (closePanel) drops it.
  _openEmail(draft, title, { subject, body }, excluded) {
    const s = Settings.get();
    this._emailDraft = draft;
    inlineError('email-error', '');
    document.getElementById('email-panel-title').textContent = title;
    document.getElementById('email-to').value      = s.supplierEmail;
    document.getElementById('email-cc').value      = s.ccEmail;
    document.getElementById('email-subject').value = subject;
    document.getElementById('email-body').value    = body;
    document.getElementById('email-covers').textContent = draft.covers + (excluded ? ` · ${excluded} excluded` : '');
    this.openPanel('email-panel');
  },

  // Opens the email in Outlook. Nothing is marked here: a mail link can't say whether the
  // email was sent, so the question that follows asks.
  openInOutlook() {
    const draft = this._emailDraft;
    if (!draft || this._emailOpen) return;
    const to      = document.getElementById('email-to').value.trim();
    const cc      = document.getElementById('email-cc').value.trim();
    const subject = document.getElementById('email-subject').value.trim();
    const body    = document.getElementById('email-body').value;
    if (!to.includes('@')) {
      inlineError('email-error', 'Enter a To address.');
      document.getElementById('email-to').focus();
      return;
    }
    if (this._connState.connected === false || navigator.onLine === false) {
      inlineError('email-error', 'Offline. Connect, then click Open in Outlook.');
      return;
    }
    if (draft.kind === 'queue' && this._draftChanges(draft).length) {
      inlineError('email-error', 'An order changed while this email was open. Go back and open the email again.');
      return;
    }
    this._emailOpen = { draft, at: Date.now(), tried: false };
    this._keepEmailOpen();
    this.closePanel('email-panel');
    this._showEmailQuestion();
    setTimeout(() => { openMailto(to, cc, subject, body); }, 300);
  },
  _draftChanges(draft) {
    return [...new Set(draft.lines.map(l => l.orderId))].flatMap(id => {
      const o = this.orders.find(x => x._id === id);
      return DB.changedLines(draft.lines.filter(l => l.orderId === id), o, draft.deliveryId);
    });
  },

  // ── WAS IT SENT? ─────────────────────────────────────────────────────
  // Kept on this PC, so a reload or a closed browser asks again instead of guessing.
  _emailOpenKey() { return `mo_email_open${FirebaseConfig.isTestMode() ? '_test' : ''}`; },
  _keepEmailOpen() {
    try {
      if (this._emailOpen) localStorage.setItem(this._emailOpenKey(), JSON.stringify(this._emailOpen));
      else localStorage.removeItem(this._emailOpenKey());
    } catch {}
  },
  _loadEmailOpen() {
    const read = () => { try { return JSON.parse(localStorage.getItem(this._emailOpenKey()) || 'null'); } catch { return null; } };
    const q = read();
    if (q && q.draft) { this._emailOpen = q; this._showEmailQuestion(); }
    // Answered, or opened, in another tab of this browser.
    window.addEventListener('storage', e => {
      if (e.key !== this._emailOpenKey() || this._opBusy.has('email')) return;
      const now = read();
      this._emailOpen = now && now.draft ? now : null;
      this._showEmailQuestion();
      this.renderQueue();
    });
  },

  _showEmailQuestion() {
    document.getElementById('email-q')?.remove();
    const q = this._emailOpen, root = document.getElementById('app-root');
    if (root) root.inert = !!q;
    if (!q) return;
    const w = document.createElement('div'); w.id = 'email-q';
    w.innerHTML = `<div class="success-overlay"><div class="success-card ask-card" role="alertdialog" aria-modal="true" aria-labelledby="email-q-title" tabindex="-1">
        <div class="success-icon blue"><i class="ti ti-mail-forward"></i></div>
        <h3 id="email-q-title">${esc(q.draft.what)} email opened in Outlook</h3>
        <p>${esc(q.draft.covers)} · ${esc(fmtTime(q.at))}</p>
        <div class="inline-error" id="email-q-error" role="alert" hidden></div>
        <button class="btn btn-primary" id="btn-email-sent"></button>
        <button class="btn btn-outline" id="btn-email-not-sent"></button>
      </div></div>`;
    document.body.appendChild(w);
    this._emailQuestionBusy('');
    document.getElementById('btn-email-sent')    .addEventListener('click', () => this.emailWasSent());
    document.getElementById('btn-email-not-sent').addEventListener('click', () => this.emailNotSent());
    w.querySelector('.ask-card').focus();   // not a button: Enter must not answer for anyone
  },
  _emailQuestionBusy(which) {
    const sent = document.getElementById('btn-email-sent'), not = document.getElementById('btn-email-not-sent');
    if (!sent || !not) return;
    const spin = '<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i>';
    sent.disabled = not.disabled = !!which;
    sent.innerHTML = which === 'sent' ? `${spin}Saving…` : '<i class="ti ti-check"></i>Email sent';
    not.innerHTML  = which === 'not'  ? `${spin}Putting back…`
      : `Not sent, keep ${this._emailOpen && this._emailOpen.draft.kind === 'queue' ? 'as pending' : 'in the cart'}`;
  },

  // Only this marks anything. If it fails the question stays, and pressing again is safe.
  async emailWasSent() {
    const q = this._emailOpen;
    if (!q || this._opBusy.has('email')) return;
    if (this._connState.connected === false || navigator.onLine === false) {
      inlineError('email-q-error', 'Offline. Connect, then click Email sent.');
      return;
    }
    this._opBusy.add('email');
    inlineError('email-q-error', '');
    this._emailQuestionBusy('sent');
    q.tried = true; this._keepEmailOpen();   // from here a reply may be lost with the lines marked
    try {
      for (;;) {
        try { await this._recordEmail(q.draft); break; }
        catch (e) {
          if (e.code !== 'draft-changed' || !e.changed) throw e;
          const left = await this._askChanged(q.draft, e.changed);
          if (!left) return;
          q.draft.lines = left; this._keepEmailOpen();
          if (!left.length) break;
        }
      }
    } catch (e) {
      console.error('Email not recorded:', e);
      inlineError('email-q-error', `Not saved: ${whyFailed(e)}.${nothingDone(e, 'Nothing was marked as emailed.')} Click Email sent to try again.`);
      return;
    } finally {
      this._opBusy.delete('email');
      this._emailQuestionBusy('');
    }
    this._emailOpen = null; this._keepEmailOpen(); this._showEmailQuestion();
    const marked = q.draft.kind !== 'queue' || q.draft.lines.length > 0;
    this._afterEmail(q.draft);
    if (marked) this._toast(`${q.draft.what} marked as emailed`, false, { label: 'Put back', run: () => this._putBackDraft(q.draft) });
    this._backToCart(q.draft.kind);
  },

  // Some lines changed after the email was opened, so it said something else. Resolves with
  // the lines still to mark, or null to leave the question open.
  async _askChanged(draft, changed) {
    const said = c => draft.lines.find(l => l.orderId === c.orderId && l.key === c.key) || {};
    const left = draft.lines.slice();
    for (const c of changed) {
      const i = left.findIndex(l => l.orderId === c.orderId && l.key === c.key && l.qty === c.qty);
      if (i >= 0) left.splice(i, 1);
    }
    const n = changed.length;
    const go = await Ask.confirm({
      title: `${n} line${n !== 1 ? 's' : ''} changed after this email was opened`,
      rows: changed.map(c => [said(c).description || c.key, typeof c.now === 'number' ? `emailed ${c.qty}, now ${c.now}`
        : c.now === 'emailed' ? 'already emailed' : c.now]),
      yes: left.length ? `Mark the other ${left.length} as emailed` : 'Leave as they are', no: 'Go back',
    });
    return go ? left : null;
  },

  // Nothing was marked, so there is usually nothing to undo. If "Email sent" was pressed
  // and failed, its reply may be all that was lost: take back whatever it did.
  async emailNotSent() {
    const q = this._emailOpen;
    if (!q || this._opBusy.has('email')) return;
    const { draft } = q;
    if (q.tried) {
      this._opBusy.add('email');
      inlineError('email-q-error', '');
      this._emailQuestionBusy('not');
      try {
        if (navigator.onLine === false) throw Object.assign(new Error('offline'), { code: 'unavailable' });
        await DB.putBackEmail(this._draftOrderIds(draft), this._draftKeys(draft), draft.kind !== 'queue');
      } catch (e) {
        console.error('Put back failed:', e);
        inlineError('email-q-error', `Not put back: ${whyFailed(e)}. Click Not sent to try again.`);
        return;
      } finally {
        this._opBusy.delete('email');
        this._emailQuestionBusy('');
      }
    }
    this._emailOpen = null; this._keepEmailOpen(); this._showEmailQuestion();
    if (draft.kind === 'queue') {
      // Land on the lines, ready to fix.
      this._openCombinedCats.add(draft.category);
      this.setMainTab('queue'); this.setView('pending');
      return;
    }
    const cart = draft.kind === 'newOrder' ? 'no' : 'co';
    for (const i of draft.order.items) this._cartAdd(cart, i, true);   // still there, unless the page was reloaded
    if (cart === 'no') { if (!this._noNote) this._noNote = draft.order.note || ''; this._updateNoBadge(); this.renderNoList(); }
    else { this._updateCoBadge(); this.renderCoList(); }
    this._backToCart(draft.kind);
  },
  // Back to the cart's review, if it still holds anything.
  _backToCart(kind) {
    if (kind === 'newOrder' && this.noCount())    { this.setMainTab('new-order'); this.noOpenReview(); }
    if (kind === 'consumables' && this.coCount()) { this.setMainTab('stock'); this.openPanel('cons-order-panel'); this.coOpenReview(); }
  },

  _draftOrderIds(draft) { return draft.kind === 'queue' ? draft.lines.map(l => l.orderId) : [draft.orderId]; },
  _draftKeys(draft)     { return draft.kind === 'queue' ? [draft.deliveryId] : Object.values(draft.deliveryIds); },
  // "Put back" on the message after "Email sent".
  _putBackDraft(draft) {
    return this._putBack({
      what: draft.what, keys: this._draftKeys(draft), orderIds: this._draftOrderIds(draft),
      toCart: draft.kind === 'consumables' ? draft.order.items : null,
    });
  },

  // Queue emails mark the orders' lines; emails from a cart save that cart's lines as an
  // order of their own, already emailed. Either way it is one write — all or nothing —
  // and safe to repeat.
  async _recordEmail(draft) {
    if (draft.kind === 'queue') { await DB.markLinesEmailed(draft.lines, draft.deliveryId); return; }
    this._myOrderIds.add(draft.orderId);
    if (this._seenOrderIds) this._seenOrderIds.add(draft.orderId);
    await DB.saveEmailedOrder(draft.orderId, draft.order, draft.deliveryIds);
  },

  // What has been emailed leaves the queue's staging or the cart it came from.
  _afterEmail(draft) {
    if (draft.kind === 'queue') {
      // Excluded lines are fresh for the next send; merged rows have nothing left to merge.
      for (const set of [this._combExcluded, this._combMerged])
        for (const key of [...set]) if (key.startsWith(`${draft.category}|`)) set.delete(key);
      this._keepStaged();
      this.renderQueue();
      return;
    }
    const cart = draft.kind === 'newOrder' ? this._no : this._co, which = draft.kind === 'newOrder' ? 'no' : 'co';
    for (const i of draft.order.items) delete cart._items[i.id];
    this._cartSent[which] = [...new Set([...this._cartSent[which], ...Object.keys(draft.deliveryIds)])];
    if (draft.kind === 'newOrder') {
      this._updateNoBadge(); this.renderNoList();
      if (this.noCount() === 0) { this._noNote = ''; this.orderRef = genRef(); this._cartSent.no = []; this._keepCarts(); }
    } else {
      this._updateCoBadge(); this.renderCoList();
      if (this.coCount() === 0) { this._coOrderRef = null; this._cartSent.co = []; }
    }
  },
  // "Mild Steel emailed · 2 more to email", above a cart's email buttons.
  _cartProgress(which, left) {
    const sent = this._cartSent[which];
    if (!sent.length) return '';
    return `<div class="email-progress"><i class="ti ti-circle-check"></i> ${esc(sent.join(', '))} emailed · ${left} more to email</div>`;
  },

  // The order an email from a cart will save: the lines in the email, nothing else. What
  // is still in the cart stays there.
  _cartDraft(kind, items, ref, extra) {
    const deviceName = (Settings.get().managerName || 'Manager').trim() || 'Manager';
    const deliveryIds = {};
    for (const i of items) if (!deliveryIds[i.category]) deliveryIds[i.category] = genDeliveryId();   // one delivery per category
    return {
      kind, orderId: DB.newOrderId(), deliveryIds,
      what:   Object.keys(deliveryIds).length === 1 ? items[0].category : 'Consumables',
      covers: `${items.length} line${items.length !== 1 ? 's' : ''}`,
      order: {
        ref, deviceName, ...extra,
        items: items.map(i => ({
          id: i.id, partCode: i.partCode, description: i.description,
          category: i.category, subcategory: i.subcategory,
          qtyType: i.qtyType || '', qty: i.qty,
          // Box info rides along so the delivery and stock steps count boxed items in boxes.
          ...(kind === 'consumables' ? { boxSize: i.boxSize || 0, boxUnit: i.boxUnit || '' } : {}),
        })),
      },
    };
  },

  // ══════════════════════════════════════════
  // NEW ORDER TAB (materials only)
  // ══════════════════════════════════════════
  noGet(id)       { return this._no._items[id]||0; },
  noSet(id,qty)   { if(qty<=0) delete this._no._items[id]; else this._no._items[id]=qty; },
  noAdj(id,d)     { this.noSet(id, round2(this.noGet(id)+d)); this._noChanged(); },
  noQuickAdd(id)  { if(!this.noGet(id)) this.noSet(id,1); this._noChanged(); },
  noZero(id)      { delete this._no._items[id]; this._noChanged(); },
  noRevAdj(id,d)  { if (d < 0 && this.noGet(id) <= 1) return; this.noAdj(id,d); },   // at 1 it stops: Remove takes a line off
  noCount()       { return Object.keys(this._no._items).length; },
  noItems()       {
    return Object.keys(this._no._items).map(id => {
      const m = this.materials.find(x => x.id == id);
      return m ? { ...m, qty: this._no._items[id] } : null;
    }).filter(Boolean);
  },

  _noChanged() {
    this._updateNoBadge(); this.renderNoList();
    if (document.getElementById('no-review-panel')?.classList.contains('open')) this._renderNoReview();
  },
  _updateNoBadge() {
    this._keepCarts();
    const b = document.getElementById('new-order-badge'); if (!b) return;
    const n = this.noCount(); setCount(b, n);
    const c = document.getElementById('btn-no-clear-main'); if (c) c.hidden = n === 0;
  },

  // Both carts are kept on this PC through a reload, by what each line is (stockId), as
  // ids can change with the catalogue.
  _cartsKey() { return `mo_carts${FirebaseConfig.isTestMode() ? '_test' : ''}`; },
  _keepCarts() {
    if (!this._cartsLoaded) return;
    const list = (items, waiting) => [...items.map(i => ({ sid: stockId(i), qty: i.qty })), ...waiting];
    try {
      localStorage.setItem(this._cartsKey(), JSON.stringify({
        at: Date.now(), note: this._noNote,
        no: list(this.noItems(), this._cartWaiting.no), co: list(this.coItems(), this._cartWaiting.co),
        rc: list(this.receiveItems(), this._cartWaiting.receive), rcRef: this._receiveRef,
      }));
    } catch {}
  },
  _loadCarts() {
    try {
      const v = JSON.parse(localStorage.getItem(this._cartsKey()) || 'null');
      if (v && v.at > Date.now() - 14 * 86400000) {
        this._cartWaiting = { no: v.no || [], co: v.co || [], receive: v.rc || [] };
        this._noNote = v.note || '';
        this._receiveRef = v.rcRef || '';
        const ref = document.getElementById('receive-reference'); if (ref) ref.value = this._receiveRef;
      }
    } catch {}
    this._cartsLoaded = true;
    this._fillCarts();
  },
  // Lines whose item is in the list go into the cart. The rest wait: items made on a
  // device only appear once the stock list has arrived.
  _fillCarts() {
    for (const [cart, catalog] of [['no', this.materials], ['co', this.consumables], ['receive', this.consumables]]) {
      const waiting = this._cartWaiting[cart]; if (!waiting.length) continue;
      this._cartWaiting[cart] = waiting.filter(l => {
        const m = catalog.find(x => stockId(x) === l.sid);
        const items = this['_' + cart]._items;
        if (m && l.qty > 0) items[m.id] = round2((items[m.id] || 0) + l.qty);
        return !m;
      });
      if (cart === 'no') { this._updateNoBadge(); this.renderNoList(); }
      else if (cart === 'co') { this._updateCoBadge(); this.renderCoList(); }
      else { this._updateReceiveBadge(); this.renderReceiveList(); }
    }
  },
  // Puts one order line back in a cart. keep: leave it alone if it is there already;
  // otherwise it adds to what is there.
  _cartAdd(cart, line, keep) {
    const catalog = cart === 'no' ? this.materials : this.consumables, sid = stockId(line);
    const m = catalog.find(x => stockId(x) === sid), items = this['_' + cart]._items;
    if (!m) { this._cartWaiting[cart].push({ sid, qty: line.qty }); return; }
    if (!items[m.id])  items[m.id] = line.qty;
    else if (!keep)    items[m.id] = round2(items[m.id] + line.qty);
  },

  // Typed quantities in the three carts (New Order, Consumables Order, Receive Stock) and
  // their review lists — see QtyField. A list takes 0 as "not on the order"; a review
  // has its own Remove.
  _cartFields(boxId, attr, catalog, cart) {
    const list = attr === 'qid', box = document.getElementById(boxId);
    QtyField.attach(box, `[data-${attr}]`, {
      zero: list,
      item: el => catalog().find(m => m.id == el.dataset[attr]),
      get:  el => this[cart + 'Get'](+el.dataset[attr]),
      set:  (el, qty) => this[cart + 'Set'](+el.dataset[attr], qty),
      live: el => {
        const on = this[cart + 'Get'](+el.dataset[attr]) > 0;
        const card = el.closest('.mat-card'), add = card && card.querySelector('.add-btn');
        if (card) card.classList.toggle('in-order', on);
        if (add)  { add.classList.toggle('in-order', on); add.innerHTML = `<i class="ti ${on ? 'ti-check' : 'ti-plus'}"></i>`; }
        if (cart === 'no') this._updateNoBadge();
        if (cart === 'co') this._updateCoBadge();
        if (cart === 'receive') this._updateReceiveBadge();
        if (!list) {                                  // the review: its line and its total, in place
          this['render' + (cart === 'no' ? 'No' : 'Co') + 'List']();
          const i = this[cart + 'Items']().find(x => x.id == el.dataset[attr]);
          const q = el.closest('.order-item')?.querySelector('.order-item-qty');
          if (q && i) q.textContent = cart === 'co' ? orderQtyDisplay(i, i.qty) : `× ${i.qty}`;
          const t = box.querySelector('.order-summary-row.total span:last-child');
          if (t) t.textContent = this._cartTotal(this[cart + 'Items']());
        }
      },
    });
  },
  _cartTotal(items) { return `${round2(items.reduce((s, i) => s + i.qty, 0))} across ${items.length} line${items.length !== 1 ? 's' : ''}`; },

  renderNoTabs() {
    const wrap = document.getElementById('no-tabs-wrap'); if (!wrap) return;
    this._cats = Data.categoriesBySize(this.materials);
    this._subs = this.activeCat ? Data.subcategories(this.materials, this.activeCat) : [];
    Strip.draw(wrap, { cats: this._cats, cat: this.activeCat, subs: this._subs, sub: this.activeSub, catAttr: 'cat-idx', subAttr: 'sub-idx' });
  },

  noSetCat(cat) { this.activeCat=cat; this.activeSub=null; this.renderNoTabs(); this.renderNoList(); const s=document.getElementById('no-scroll'); if(s)s.scrollTop=0; },
  noSetSub(sub) { this.activeSub=sub; this.renderNoTabs(); this.renderNoList(); },

  renderNoList() {
    const q = document.getElementById('no-search')?.value || '';
    const filtered = Data.filter(this.materials, this.activeCat, this.activeSub, q);
    const list = document.getElementById('no-mat-list'); if (!list) return;
    const note = searchNote(filtered, q);
    if (!filtered.length) {

    if (this._opBusy.has('noAdd')) return; // double-tap would submit a duplicate order doc
    if (this.noCount() === 0) { toast('No items on this order yet', true); return; }
    if (this._connState.connected === false || navigator.onLine === false) {
      Ask.tell('Not added to the queue', 'Offline. Connect, then click Add to order queue.'); return;
    }
    this._opBusy.add('noAdd');
    const back = busyBtn(document.getElementById('btn-no-add-to-orders'), 'Adding…');
    const s = Settings.get();
    const deviceName = (s.managerName || 'Manager').trim() || 'Manager';
    const items = this.noItems().map(i => ({
      id: i.id, partCode: i.partCode, description: i.description,
      category: i.category, subcategory: i.subcategory,
      qtyType: i.qtyType || '', qty: i.qty,
    }));
    const ref = this.orderRef;
    try {
      const submittedId = await DB.submitOrder({ ref, deviceName, items, note: this._noNote.trim() });
      this._myOrderIds.add(submittedId);
      if (this._seenOrderIds) this._seenOrderIds.add(submittedId);
      this._no._items = {};
      this._noNote = '';
      this.orderRef = genRef();
      this._updateNoBadge();
      this.renderNoList();
      this.closePanel('no-review-panel');
      this._cartSent.no = [];
      this.setMainTab('queue'); this.setView('pending');
      doneMessage(document.getElementById('overlay-wrap'), { title: 'Added to the order queue',
        text: `${ref} · ${items.length} line${items.length !== 1 ? 's' : ''}. It's under Pending.` });
    } catch(e) {

    }
    inlineError('receive-error', '');
    const reference = document.getElementById('receive-reference')?.value.trim();
    const s = Settings.get();
    const managerName = (s.managerName || 'Manager').trim() || 'Manager';
    const by = reference ? `${managerName} — ${reference}` : managerName;
    const sessionId = genRef();

    const btn = document.getElementById('btn-receive-submit');
    const busy = on => {
      if (!btn) return;
      btn.disabled = on;
      btn.innerHTML = on ? `<i class="ti ti-loader" style="animation:spin 1s linear infinite"></i> Saving ${items.length} item${items.length !== 1 ? 's' : ''}…`
        : '<i class="ti ti-truck-delivery"></i>Confirm stock received <span class="sidebar-count zero" id="receive-badge" style="margin-left:4px">0</span>';
      document.getElementById('btn-receive-clear-main').disabled = on;
      document.getElementById('btn-close-receive').disabled = on;
    };
    this._opBusy.add('receive');
    busy(true);
    // For boxed items the quantity entered is whole boxes: stock is kept in units.
    const lines = items.map(i => ({ sid: stockId(i), description: i.description, units: hasBoxTracking(i) ? i.qty * i.boxSize : i.qty }));
    try {
      await DB.receiveStock(lines, by, sessionId, OpId.for('receive', { lines, reference }));

      this._opBusy.delete('receive');
      busy(false);

    }

    this._receive._items = {}; this._cartWaiting.receive = []; this._receiveRef = '';
    document.getElementById('receive-reference').value = '';
